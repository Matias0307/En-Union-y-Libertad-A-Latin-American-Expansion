 ### EUYL ###
 
 MENU_DISCORD:0 "Servidor de Discord Oficial para En Unión y Libertad"
 MENU_PATREON:0 "Mi Patreon, cualquier donación me ayudaría muchisimo!"
 MENU_TWITCH:0 "Mi Twitch, hago streams de vez en cuando"
 MENU_SURVEY:0 "Encuesta de opinión de los jugadores para valorar los árboles de enfoque y los países en general. ¡Su opinión es muy importante para mí, ya que me permite mejorar el mod aún más para su disfrute! Gracias y ¡que tengas un buen día!"
 MENU_ALS:0 "Si podrian donar cualquier cantidad, sin importar lo poco que sea, me haria la persona mas feliz del mundo! Por favor, necesitamos que mas gente sepa sobre la ELA y la crueldad de esta enfermadad. Tengo un primo que esta sufriendo de esta enfermedad, asi que por favor, desde el fondo de mi corazon, les pido que les cuente a todos sobre esto. Cuanto mas gente sepa y mas donen, mas cerca estaremos a una cura. Muchas gracias por su tiempo, solo con leer este mensaje me ayuda muchisimo. ¡Gracias!"
