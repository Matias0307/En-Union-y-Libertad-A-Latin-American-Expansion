l_spanish:
 ARG_GATHERING_STORM_DESC:0 "Gracias a la Gran Depresión, la economía argentina está en ruinas desde hace años. No solo Agustín Pedro Justo tiene que lidiar con una economía destrozada, sino también con una población muy desconfiada. Hace tan solo 6 años, ocurrió un gran golpe de Estado, derrocar al otrora presidente Hipólito Yrigoyen, lo que provocó que muchas personas desconfiaran de las fuerzas armadas y del gobierno en su conjunto.\n\nAhora, con el calentamiento del mundo y una guerra a escala global que parece inminente, es imposible decir qué pasará con Argentina y su agitación política."
 ARG_BLITZKRIEG_DESC:0 "Después de unas elecciones bastante cuestionables en 1937, Roberto Maria Ortiz se ha convertido en presidente de la república. Los problemas económicos en su mayoría han desaparecido y la gente confía un poco más en el ejército. \n\nEn general, todo parece ir bien hasta ahora, sin embargo, muchos especulan que esto no durará mucho y que en algún momento los militares intervendrán una vez más en el gobierno. \n\nSi estas especulaciones son ciertas, entonces todo lo que podemos hacer es rezar para que nada de esto se convierta en algo sangriento."
 CHL_GATHERING_STORM_DESC:0 "Con la agitación económica ahora fuera del camino, Chile puede concentrarse en partes más importantes de su nación, sobre todo en su política exterior. Con el mundo ardiendo rápidamente por todas partes, ¿el bastión de la democracia en América del Sur conservará su corona o lo hará? sucumbe a la influencia extranjera."
 CHL_BLITZKRIEG_DESC:0 "Chile ahora se ve a sí mismo en medio del caos global. Europa está siendo devorada por el fascismo y las ideologías radicales. Aquí en casa, Paraguay, Perú y Venezuela renunciaron a los principios democráticos básicos. \n\nDepende de nosotros para mostrar la democracia latinoamericana y los beneficios que aporta a la nación. ¡Por la libertad y propseridad!"
 URG_GATHERING_STORM_DESC:0 "Han pasado 5 años desde que Gabriel Terra tomó el poder en Uruguay y se estableció como dictador del país. Ya se han hecho múltiples intentos para que abandone el poder, pero todos han fracasado hasta ahora. Debido a estos golpes fallidos y a otras razones, Terra ha estado encarcelando a personas importantes sólo por la sospecha de que puedan estar en su contra. \n\nCon el mundo calentándose, uno se pregunta qué ocurrirá con Uruguay".
 URG_BLITZKRIEG_DESC:0 "El mundo está en su punto de inflexión, y no se sabe qué va a pasar. Muchos especulan que los últimos días de Terra como dictador están llegando a su fin y que volveremos a tener elecciones. Otros dicen que continuará como dictador hasta que muera. \n\nCualquiera que ocurra, esperemos que sea para mejor."
 PRU_GATHERING_STORM_DESC:0 "Desde la Guerra del Pacífico, Perú se ha convertido en una cáscara de lo que fue. El ejército peruano es un hazmerreír, la marina fue destruida por los chilenos, ¡y ni siquiera tienen una fuerza aérea! Además, la ira de la Gran Depresión ha llegado incluso a Perú, aunque no tan severamente como a otras naciones.\n\nÓscar Benavides tiene muchas cosas que hacer-y no mucho tiempo-ya que muchos de nuestros vecinos están mirando nuestras tierras mientras el mundo se pone más tenso..."
 PRU_BLITZKRIEG_DESC:0 "Gracias a Óscar, muchos de los problemas que aquejan al Perú han comenzado a sanar. Con la cuestión de nuestra forma de gobierno resuelta, nuestra nación se ha estabilizado políticamente. El ejército peruano ha comenzado a modernizarse con la compra de armamento extranjero, y por lo tanto se ha hecho más fuerte.\n\nCon muchas cargas quitadas de los hombros del Perú y mientras el mundo se sumerge en otra guerra, el Perú -salvado de las garras del extremismo por la Asamblea Constituyente- se queda ahora con una pregunta; "¿Qué hacemos ahora?"
 BOL_GATHERING_STORM_DESC:0 "Sólo un año después de perder el Chaco ante Paraguay en la Guerra del Chaco, Bolivia se encuentra en un estado de casi anarquía. El actual presidente simplemente no es capaz de mantener la nación por más tiempo, y los militares están planeando un golpe de estado debido a su incompetencia. \n\nLa situación se presenta oscura para Bolivia, y por ahora sólo el futuro dirá si salen de esto como una potencia más fuerte, o sucumben a su propia agitación política".
 BOL_BLITZKRIEG_DESC:0 "Con el mundo al borde de una gran guerra, Bolivia se encuentra en un punto muerto. ¿Intervienen y aprovechan la oportunidad de expandirse, o se mantienen neutrales y se mantienen al margen de las guerras? Esa es una pregunta que Germán tendrá que responder y rápido si quiere mantener la estabilidad y la soberanía de su nación y su pueblo."
 COL_GATHERING_STORM_DESC:0 "Después de permanecer casi 50 años excluidos, los liberales finalmente llegaron al poder en 1930. Sin embargo, recibieron un país industrialmente atrasado, estancado económicamente y agitado por una ola de violencia bipartidista que se recrudece a diario. \n\nDesde entonces Colombia ha atravesado un periodo de reformas sociales que no han pasado desapercibidas para la oposición. Mientras López Pumarejo pretende forjar una nación neutra, otros parecen empeñados en restaurar la grandeza pasada de Colombia, aunque sea por la fuerza..."
 COL_BLITZKRIEG_DESC:0 "La presidencia de los liberales ha marcado un antes y un después en la historia colombiana. La nación se ha desarrollado rápidamente y ha conseguidos hitos sociales que han revolucionado el concepto de Estado, pero sigue estando atrasada en comparación con sus vecinos regionales. \n\nCon Eduardo Santos ahora a la cabeza, el país parece buscar un rumbo menos radical; ralentizar las reformas para evitar una catástrofe social es lo que propone con su programa 'la Gran Pausa'."
 BRA_GATHERING_STORM_DESC:0 "Con la Revolución aún fresca en la mente de la mayoría de los brasileños, el clima político y social del país no ha ido bien. Vargas se ve ahora obligado a lidiar con una nación socialmente frágil, cuya economía sigue siendo mayoritariamente rural y se está quedando atrás con respecto a otras naciones. \n\nLos paulistas aún se aferran a los sueños separatistas, y los partidos políticos opositores crecen en apoyo. Es seguro decir que los próximos años para Brasil serán cruciales para el país".
 BRA_BLITZKRIEG_DESC:0 "El proceso de establecimiento del Estado Novo fue largo y brutal. Se cerraron por la fuerza muchos partidos y hubo que censurar las voces de la gente para que Vargas alcanzara el estatus de dictadura. \n\nCuando el mundo se calienta y las tensiones entre los Aliados y el Eje siguen aumentando, el Brasil de Vargas se ve obligado a decidir entre ponerse del lado de uno u otro bando o mantener la neutralidad. ¿Qué hará Brasil?"
 PAR_GATHERING_STORM_DESC:0 "No ha pasado ni un año desde la conclusión de la Guerra del Chaco. Afortunadamente salimos victoriosos, sin embargo, la guerra aún afectó mucho a nuestro país, ya que tanto nuestro ejército como la política se encuentran en un estado frágil debido a los recursos gastados en la guerra. Necesitaremos recuperarnos y volver a ponernos en pie antes de que ningún país se aproveche de nuestra frágil situación."
 PAR_BLITZKRIEG_DESC:0 "Si bien la situación actual de Paraguay ha mejorado significativamente en comparación con hace sólo 3 años. Todavía no se puede negar que la situación actual está lejos de ser ideal. El actual gobierno liberal ha sido duramente criticado por muchos, y las promesas que se han hecho antes de asumir el poder no se han cumplido. \n\n¿Será capaz Paraguay de salir adelante y prevalecer?"
 VEN_GATHERING_STORM_DESC:0 "Eleazar López Contreras, el nuevo presidente de los Estados Unidos de Venezuela, se encuentra de repente al mando del país tras la muerte del anterior dictador, Juan Vicente Gómez, hace apenas unos días. El abrupto cambio de gobierno aún no ha sido aceptado por el pueblo de Venezuela, y los comunistas trabajan en la clandestinidad, sin saber cuál será su próximo movimiento. \n\n¿Será capaz Contreras de ganarse la confianza de la población y cumplir su sueño de una Venezuela libre y democrática?"
 VEN_BLITZKRIEG_DESC:0 "El mundo se acerca cada vez más a una guerra total, mientras Alemania planea su invasión polaca. Esto puede ser beneficioso y no para nosotros, ya que las dificultades de la guerra pueden llevar a los países a buscarnos para su suministro de petróleo. Esto mejorará nuestra economía, pero puede ser a costa de que los países contrarios intenten coaccionarnos políticamente para que comerciemos sólo con ellos. \n\nA Contreras no le queda mucho tiempo en el cargo, y necesita preparar el terreno para el candidato emergente, Isaías Medina Angarita."
 ECU_GATHERING_STORM_DESC:0 "Sólo han pasado 4 años desde la Guerra Civil de los 4 Días, un sangriento conflicto entre los conservadores y los liberales del país. Las cicatrices de aquel conflicto aún se ciernen sobre la política ecuatoriana, y mientras Federico Páez Chiriboga no hace más que encariñarse cada vez más con el fascismo, la situación no hace más que empeorar. \n\n¿Podrá Ecuador resistir la amenaza que se cierne sobre su frontera?"
 ECU_BLITZKRIEG_DESC:0 "Las tensiones entre Ecuador y Perú no dejan de aumentar, ya que ambos países mantienen reclamaciones contra el otro. A este paso, la guerra es inevitable. La pregunta que muchos se hacen es: ¿cuándo? Auerlio tiene mucho en su haber, y tendrá que gestionar el país con un 100% de eficacia si quiere salir victorioso."
 HON_GATHERING_STORM_DESC:0 "Con las elecciones a la vuelta de la esquina, Tiburicio busca aumentar su influencia sobre la nación y asegurar su reelección, convirtiéndose efectivamente en un dictador. La economía tampoco está en su mejor estado, con las exportaciones de banano desmoronándose con el paso del tiempo. \n\nCon el mundo calentándose, Honduras necesita estabilizarse antes de que cualquier influencia extranjera aproveche la situación."
 PAN_GATHERING_STORM_DESC:0 "Siendo una nación relativamente nueva, Panamá todavía intenta encontrar su lugar en el mundo. Los Estados Unidos tienen una gran influencia sobre la nación, llegando incluso a dictar su política. \n\nSi queremos ser una nación soberana, necesitamos empezar a tomar decisiones por nosotros mismos y no permitir que otras naciones lo hagan por nosotros."
 HON_BLITZKRIEG_DESC:0 "Tiburicio Carías Andino ha sido reelegido para un segundo mandato como presidente de Honduras. Con su nuevo mandato, se ha convertido efectivamente en un dictador, disolviendo el congreso y prohibiendo todos los partidos políticos excepto el suyo. \n\nCon el mundo al borde de la guerra, Honduras necesita estabilizar su economía y su política antes de que cualquier influencia extranjera aproveche la situación."
 PAN_BLITZKRIEG_DESC:0 "Panamá ha estado bajo la influencia de los Estados Unidos desde su independencia. Los EE. UU. tienen una gran influencia en la política panameña, e incluso poseen bases militares en nuestro territorio. \n\nSi queremos ser una nación soberana, necesitamos empezar a tomar decisiones por nosotros mismos y no permitir que otras naciones lo hagan por nosotros."
