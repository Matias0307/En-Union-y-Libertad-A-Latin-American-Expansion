l_braz_por:
 ARG_GATHERING_STORM_DESC:0 "Graças à Grande Depressão, a economia argentina tem estado em ruínas há anos. Não só Agustín Pedro Justo tem que lidar com uma economia destroçada, mas também com uma população muito desconfiada. Há apenas 6 anos, ocorreu um grande golpe de Estado, derrubando o ex-presidente Hipólito Yrigoyen, que fez com que muitas pessoas desconfiassem das forças armadas e do governo como um todo. \n\nAgora, com o aquecimento do mundo e uma guerra em escala global aparentemente iminente, é impossível dizer o que vai acontecer com a Argentina e sua turbulência política".
 ARG_BLITZKRIEG_DESC:0 "Depois de uma eleição bastante questionável em 1937, Roberto Maria Ortiz tornou-se presidente da república. Os problemas econômicos desapareceram em sua maioria e o povo confia um pouco mais no exército. \No entanto, muitos especulam que isto não vai durar muito e que em algum momento os militares irão intervir novamente no governo. \n\nSe estas especulações são verdadeiras, então tudo o que podemos fazer é rezar para que nada disto se torne sangrento".
 CHL_GATHERING_STORM_DESC:0 "Com o tumulto econômico agora fora do caminho, o Chile pode se concentrar em partes mais importantes de sua nação, não menos importante, sua política externa. Com o mundo queimando rapidamente de todos os lados, o bastião da democracia na América do Sul conservará sua coroa ou sucumbirá à influência estrangeira".
 CHL_BLITZKRIEG_DESC:0 "O Chile se vê agora no meio do caos global. A Europa está sendo devorada pelo fascismo e por ideologias radicais. Aqui em casa, Paraguai, Peru e Venezuela renunciaram aos princípios democráticos básicos. \n\nCabe a nós mostrar a democracia latino-americana e os benefícios que ela traz para a nação. Pela liberdade e prosperidade"!
 URG_GATHERING_STORM_DESC:0 "Faz 5 anos que Gabriel Terra tomou o poder no Uruguai e se estabeleceu como ditador do país. Já foram feitas várias tentativas para tirá-lo do poder, mas todas falharam até agora. Devido a estes golpes fracassados e outras razões, Terra tem prendido pessoas importantes apenas sob a suspeita de que elas poderiam estar contra ele. \n\nCom o aquecimento do mundo, perguntamo-nos o que vai acontecer com o Uruguai".
 URG_BLITZKRIEG_DESC:0 "O mundo está no seu ponto de viragem e não há como dizer o que vai acontecer. Muitos especulam que os últimos dias do Terra como ditador estão chegando ao fim e que teremos eleições novamente. Outros dizem que ele continuará como ditador até a sua morte. \n\nO que quer que aconteça, esperemos que seja para melhor".
 PRU_GATHERING_STORM_DESC:0 "Desde a Guerra do Pacífico, o Peru se tornou uma concha de seu antigo eu. O exército peruano é motivo de riso, a marinha foi destruída pelos chilenos, e eles nem sequer têm força aérea! Além disso, a ira da Grande Depressão chegou até ao Peru, embora não tão severamente quanto outras nações.Oscar Benavides tem muitas coisas a fazer - e não muito tempo - já que muitos de nossos vizinhos estão observando nossas terras enquanto o mundo fica mais tenso"...
 PRU_BLITZKRIEG_DESC:0 "Graças a Oscar, muitos dos problemas que assolam o Peru começaram a sarar. Com a questão de nossa forma de governo resolvida, nossa nação se estabilizou politicamente. O exército peruano começou a se modernizar com a compra de armas estrangeiras, e assim se tornou mais forte. Com muitos fardos retirados dos ombros do Peru e com o mundo mergulhando em outra guerra, o Peru - salvo das garras do extremismo pela Assembléia Constituinte - fica agora com uma pergunta: "O que fazemos agora?
 BOL_GATHERING_STORM_DESC:0 "Apenas um ano após perder o Chaco para o Paraguai na Guerra do Chaco, a Bolívia se encontra em um estado de quase anarquia. O atual presidente simplesmente não é mais capaz de manter a nação unida, e os militares estão planejando um golpe de Estado por causa de sua incompetência. \n\nA situação parece sombria para a Bolívia e, por enquanto, somente o futuro dirá se eles sairão disto como uma potência mais forte, ou sucumbirão à sua própria agitação política."
 BOL_BLITZKRIEG_DESC:0 "Com o mundo à beira de uma grande guerra, a Bolívia se encontra em um impasse. Será que eles intervêm e aproveitam a oportunidade para se expandir, ou permanecem neutros e se mantêm fora das guerras? Essa é uma pergunta que Germán terá que responder, e rapidamente, se quiser manter a estabilidade e a soberania de sua nação e de seu povo"
 COL_GATHERING_STORM_DESC:0 "Depois de quase 50 anos de exclusão, os liberais finalmente chegaram ao poder em 1930. Entretanto, eles receberam um país que estava industrialmente atrasado, economicamente estagnado e perturbado por uma onda de violência bipartidária que se agitava diariamente. \n\nDesde então, a Colômbia passou por um período de reformas sociais que não passaram despercebidas pela oposição. Enquanto López Pumarejo procura forjar uma nação neutra, outros parecem inclinados a restaurar a grandeza do passado da Colômbia, embora pela força...".
 COL_BLITZKRIEG_DESC:0 "A presidência liberal marcou um antes e um depois na história da Colômbia. A nação se desenvolveu rapidamente e alcançou marcos sociais que revolucionaram o conceito de Estado, mas ainda fica atrás de seus vizinhos regionais. \n\nCom Eduardo Santos agora no leme, o país parece estar buscando um rumo menos radical; retardar as reformas para evitar a catástrofe social é o que ele propõe com seu programa de 'Grande Pausa'".
 BRA_GATHERING_STORM_DESC:0 "Com a Revolução ainda fresca na mente da maioria dos brasileiros, o clima político e social do país não tem corrido bem. Vargas é agora forçado a lidar com uma nação socialmente frágil, cuja economia continua em grande parte rural e está ficando para trás em relação a outras nações. \n\nPaulistas ainda se agarram aos sonhos separatistas, e os partidos políticos de oposição estão crescendo em apoio. É seguro dizer que os próximos anos para o Brasil serão cruciais para o país."
 BRA_BLITZKRIEG_DESC:0 "O processo de estabelecimento do Estado Novo foi longo e brutal. Muitos partidos foram fechados à força e as vozes do povo tiveram que ser censuradas para que Vargas alcançasse o status de ditadura. \n\nComo o mundo se aquece e as tensões entre os Aliados e o Eixo continuam a aumentar, o Brasil de Vargas é forçado a decidir entre ficar do lado de um lado ou do outro ou manter a neutralidade. O que fará o Brasil?"
 PAR_GATHERING_STORM_DESC:0 "Nem mesmo um ano se passou desde a conclusão da Guerra do Chaco. Felizmente, saímos vitoriosos, mas a guerra ainda afetou muito nosso país, pois tanto nosso exército quanto nossa política estão em um estado frágil devido aos recursos gastos na guerra. Precisamos nos recuperar e nos reerguer antes que qualquer país tire proveito de nossa situação frágil."
 PAR_BLITZKRIEG_DESC:0 "Embora a situação atual do Paraguai tenha melhorado significativamente em comparação com apenas 3 anos atrás. Ainda não há como negar que a situação atual está longe de ser ideal. O atual governo liberal foi duramente criticado por muitos, e as promessas feitas antes de assumir o poder não foram cumpridas. \n\nO Paraguai conseguirá se recuperar e prevalecer?"
 VEN_GATHERING_STORM_DESC:0 "Eleazar López Contreras, o novo presidente dos Estados Unidos da Venezuela, encontra-se repentinamente no comando do país após a morte do ditador anterior, Juan Vicente Gomez, há poucos dias. A mudança abrupta no governo ainda não foi aceita pelo povo da Venezuela, e os comunistas estão trabalhando na clandestinidade, sem que saibamos qual será seu próximo passo. \n\nSerá que Contreras conseguirá ganhar a confiança da população e realizar seu sonho de uma Venezuela livre e democrática?"
 VEN_BLITZKRIEG_DESC:0 "O mundo está cada vez mais próximo de uma guerra total, pois a Alemanha planeja sua invasão polonesa. Isso pode ser benéfico e não benéfico para nós, pois as dificuldades da guerra podem levar os países a nos procurar para o fornecimento de petróleo. Isso melhorará nossa economia, mas pode ter o custo de países adversários tentando nos coagir politicamente a negociar apenas com eles. \n\nContreras não tem muito tempo no cargo e precisa preparar o terreno para o candidato emergente, Isaías Medina Angarita."
 ECU_GATHERING_STORM_DESC:0 "Apenas quatro anos se passaram desde a Guerra Civil dos 4 Dias, um conflito sangrento entre os conservadores e os liberais do país. As cicatrizes desse conflito ainda pairam na política do Equador e, como Federico Páez Chiriboga está cada vez mais apaixonado pelo fascismo, a situação continua piorando. \n\nO Equador conseguirá se manter firme contra a ameaça que se aproxima do outro lado da fronteira?""
 ECU_BLITZKRIEG_DESC:0 "As tensões continuam aumentando entre o Equador e o Peru, pois ambos os países têm reivindicações contra o outro. Nesse ritmo, uma guerra é inevitável. A pergunta que muitos fazem é: quando? Auerlio tem muito sob sua responsabilidade e precisará administrar o país com 100% de eficácia se quiser sair vitorioso."
 HON_GATHERING_STORM_DESC:0 "Com as eleições se aproximando, Tiburicio busca aumentar sua influência sobre a nação e garantir sua reeleição, tornando-se efetivamente um ditador. A economia também não está em seu melhor estado, com as exportações de banana desmoronando com o passar do tempo. \n\nCom o mundo esquentando, Honduras precisa se estabilizar antes que qualquer influência estrangeira aproveite a situação."
 PAN_GATHERING_STORM_DESC:0 "Sendo uma nação relativamente nova, o Panamá ainda tenta encontrar seu lugar no mundo. Os Estados Unidos têm grande influência sobre o país, chegando até a ditar suas políticas. \n\nSe quisermos ser uma nação soberana, precisamos começar a tomar decisões por conta própria e não permitir que outras nações façam isso por nós."
 HON_BLITZKRIEG_DESC:0 "Tiburicio Carías Andino foi reeleito para um segundo mandato como presidente de Honduras. Com seu novo mandato, ele efetivamente se tornou um dictador, dissolvendo o congresso e proibindo todos os partidos políticos exceto o seu. \n\nCom o mundo à beira da guerra, Honduras precisa estabilizar sua economia e sua política antes que qualquer influência estrangeira aproveite a situação."
 PAN_BLITZKRIEG_DESC:0 "O Panamá tem estado sob influência dos Estados Unidos desde sua independência. Os EUA têm grande influência na política panamenha e até possuem bases militares em nosso território. \n\nSe quisermos ser uma nação soberana, precisamos começar a tomar decisões por conta própria e não permitir que outras nações façam isso por nós."
