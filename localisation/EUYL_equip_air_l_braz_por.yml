 #Argentina
 
 ARG_heavy_fighter_equipment_3:0 "I.Ae 30 Ñancú P1"
 ARG_heavy_fighter_equipment_3_short:0 "Ñancú P1"
 ARG_heavy_fighter_equipment_3_desc:0 "O I.Ae. 30 "Ñancú", em homenagem a uma águia indígena da Patagônia, foi projetado pelo engenheiro italiano Cesare Pallavicino, que veio para a Argentina em 1946. Pallavicino liderou uma equipe de técnicos e engenheiros argentinos no desenvolvimento do conceito de caça de escolta de alta velocidade, destinado a ser operado em conjunto com os bombardeiros usados ​​na Força Aérea Argentina."
 ARG_strat_bomber_equipment_1:0 "Fortaleza Voadora do Boeing B-17"
 ARG_strat_bomber_equipment_1_short:0 "B-17"
 ARG_strat_bomber_equipment_3:0 "Avro Lancaster"
 ARG_strat_bomber_equipment_3_short:0 "Avro Lancaster"
 
 ARG_fighter_equipment_0:0 "FMA D.21"
 ARG_fighter_equipment_0_short:0 "D.21"
 ARG_fighter_equipment_0_desc:0 "O Dewotine D.21 era um avião de caça monoplano de cabine aberta e trem de pouso fixo projetado na França na década de 1920. 9 unidades do D.21 foram compradas pelo governo argentino do governo suíço em 1929. Na década de 1930 , a licença foi adquirida e a produção local começou em Córdoba até o final de 1936, quando o D.21 foi substituído pelo Hawk H-750."
 ARG_fighter_equipment_1:0 "FMA Hawk 75O"
 ARG_fighter_equipment_1_short:0 "Falcão 75O"
 ARG_fighter_equipment_1_desc:0 "O Hawk 750 era um monoplano monoposto fabricado pela Curtis na década de 1930. A "Dirección General de Aeronáutica" comprou 30 unidades do Curtiss Hawk H-75O e posteriormente adquiriu a licença do Hawk H-75O sob a FMA para substituir o desatualizado D.21."
 ARG_fighter_equipment_2:0 "Fiar Cr.32"
 ARG_fighter_equipment_2_short:0 "Cr.32"
 ARG_fighter_equipment_3:0 "Norte Americano P-51 Mustang"
 ARG_fighter_equipment_3_short:0 "P-51 Mustang"

 ARG_cv_fighter_equipment_2:0 "Vought F4U Corsair"
 ARG_cv_fighter_equipment_2_short:0 "F4U Corsair"
 ARG_cv_fighter_equipment_2_desc:0 "O Vought F4U Corsair foi um caça americano que serviu principalmente na Segunda Guerra Mundial e na Guerra da Coréia. O governo argentino comprou 26 F4U Corsairs para o governo dos EUA, que foram incorporados ao "Naval Fighter and Attack Squadron" , sediado na base aeronaval "Punta Indio".
 ARG_cv_fighter_equipment_3:0 "Grumman F6F Hellcat"
 ARG_cv_fighter_equipment_3_short:0 "F6F Hellcat"

 ARG_nav_bomber_equipment_1:0 "Supermarine Walrus"
 ARG_nav_bomber_equipment_1_short:0 "Morsa"
 ARG_nav_bomber_equipment_1_desc:0 "O Supermarine Walrus era um biplano anfíbio monomotor britânico, fabricado pela empresa aeronáutica britânica Supermarine. 2 unidades foram compradas pela Argentina e foram atribuídas ao ramo de Aviação Naval da marinha, onde serviram até 1948."
 ARG_nav_bomber_equipment_2:0 "Short S25 Sunderland"
 ARG_nav_bomber_equipment_2_short:0 "S25 Sunderland"
 ARG_nav_bomber_equipment_3:0 "Martin PBM Mariner"
 ARG_nav_bomber_equipment_3_short:0 "PBM Mariner"
 ARG_nav_bomber_equipment_3_desc:0 "O PBM Mariner era um bombardeiro-patrulha naval fabricado pela Glenn L. Martin Company, que foi utilizado pela primeira vez em 1940, sob a Marinha dos Estados Unidos. 9 unidades foram adquiridas pela Marinha Argentina, e posteriormente integradas ao o ramo de aviação naval da marinha."
 
 ARG_CAS_equipment_1:0 "Douglas Modelo 8A-2"
 ARG_CAS_equipment_1_short:0 "8A-2"
 ARG_CAS_equipment_1_desc:0 "O Douglas Modelo 8A-2 era um monoplano de ataque de dois lugares. Foi construído para a Força Aérea Argentina pela Douglas Aircraft Company como uma variante especial do Northrop A-17, com 30 unidades sendo produzidas e integradas o Regimento de Ataque nº 2."
 ARG_CAS_equipment_2:0 "I.Ae 22 DL"
 ARG_CAS_equipment_2_short:0 "I.Ae 22 DL"
 ARG_CAS_equipment_3:0 "I.Ae 30 Ñancú Pallavicino 2"
 ARG_CAS_equipment_3_short:0 "Ñancú P2"
 ARG_CAS_equipment_3_desc:0 "O Ñancú P2 era um bombardeiro leve de dois lugares projetado por Cesare Pallavicino e fabricado pela FMA. Era uma variante do I.Ae 30 Ñancú, que tinha asas mais longas e menor peso devido à substituição das naceles do motor ."
 
 ARG_tac_bomber_equipment_0:0 "Junkers Ju 52"
 ARG_tac_bomber_equipment_0_short:0 "Ju 52"
 ARG_tac_bomber_equipment_1:0 "FMA AeMB.2"
 ARG_tac_bomber_equipment_1_short:0 "FMA AeMB.2"
 ARG_tac_bomber_equipment_1_desc:0 "O FMA AeMB.2 Bombi foi um bombardeiro desenvolvido na Argentina em meados da década de 1930. Era um monoplano cantilever de asa baixa de configuração convencional. por longas carenagens estilo "calças". A configuração inicial do AeMB.1 foi equipada com uma torre de metralhadora dorsal, posteriormente removida do AeMB.2 para melhorar a estabilidade. Quinze exemplares de produção serviram na Força Aérea Argentina entre 1936 e 1945 ."
 ARG_tac_bomber_equipment_2:0 "B-25 Mitchell norte-americano"
 ARG_tac_bomber_equipment_2_short:0 "B-25 Mitchell"
 ARG_tac_bomber_equipment_3:0 "I.Ae 24 Calquín"
 ARG_tac_bomber_equipment_3_short:0 "Calquín"
 ARG_tac_bomber_equipment_3_desc:0 "O I.Ae.24 Calquin (palavra mapudungun que significa "Águia Real") era um bombardeiro tático projetado e construído pelo Instituto Aerotécnico de Córdoba. Com o modelo do bem sucedido Mosquito de Havilland, o Calquín tinha uma estrutura de madeira semelhante ao FMA AeMB.2, e foi a primeira aeronave bimotor projetada e construída na Argentina. Foram construídas 101 unidades desta aeronave e a última foi desativada em 1960."
 
 ARG_jet_fighter_equipment_1:0 "FMA I.Ae. 27 Pulqui I"
 ARG_jet_fighter_equipment_1_short:0 "Pulqui I"
 ARG_jet_fighter_equipment_1_desc:0 "O I.Ae. 27 Pulqui I foi um jato argentino projetado no Instituto Aerotécnico em 1946. Apenas um protótipo foi concluído; desempenho insatisfatório levou a aeronave a ser substituída por um projeto posterior. A fuselagem era semi-monocoque com uma seção transversal elíptica que abriga um único motor Rolls-Royce Derwent 5 com a entrada de ar no nariz e os dutos ao redor do cockpit."
 ARG_jet_fighter_equipment_2:0 "FMA IAe 33 Pulqui II"
 ARG_jet_fighter_equipment_2_short:0 "Pulqui II"
 ARG_jet_fighter_equipment_2_desc:0 "O FMA IAe 33 Pulqui II foi um caça a jato monolugar projetado por Kurt Tank no final da década de 1940 na Argentina, sob o governo Perón, e construído pela FMA. Sua estrutura era feita puramente de metal e a cabine foi pressurizado com uma tampa tipo bolha."
 
