### Leaders ###
POLITICS_AGUSTIN_PEDRO_JUSTO_DESC:0 "A general, engineer, president, and the right hand of José F. Uriburu during the 1930 coup d'etat, Justo stands in the last years of his mandate, his government has seen corruption, bribes, political assasinations and a shattered economy. Elections are in the horizon, and La Concordancia is already looking for a new candidate"
POLITICS_ROBERTO_ORTIZ_DESC:0 "Before a "Radical" now member of the Concordancia, Ortiz is a man of conviction, standing as the nation's elected president in an election full of controversy, his goal is to exterminate corruption from the system, modernize the infraestructure and assist the economy. These promises though, might see a sudden cut."
POLITICS_FANNY_EDELMAN_DESC:0 "Fanny Jabcovsky, or Edelman, has assumed leadership of the communist party of the nation, With strict marxist and feminist ideals, Fanny is the first female ruler not only in this country but in much of the continent."
POLITICS_LIBORIO_JUSTO_DESC:0 "Liborio Justo, son of Agustin P. Justo, is a man of marxist ideals and anti-stalinist morals. Member of the IV Internationale he is no stranger to trotskyism, but his views might change on the way. Liborio, now head of state, is sure to partake in continental and maybe even international revolutions."
POLITICS_PEDRO_PABLO_RAMIREZ_DESC:0 "General Pedro Ramirez and his G.O.U have seized power in the nation in a coup d'etat. Ramirez is a nationalist and proud catholic, it's sure his government will see several reforms returning argentina to its hispanic and christian roots. Ramirez is sure to hold on to power with help with his military men, but who knows, maybe some in his government have other plans. "
POLITICS_JUAN_DOMINGO_PERON_DESC:0 "Colonel Juan Domingo Perón with support of syndicates and workers has seized power in teh government. Perón sees social justice, or more specifically his "Justicialismo", as the answer to argentina's economic and social problems, to this mix, a fierce nationalist and irredentist sentiment is added to mould Peron's dreamed Argentina."
POLITICS_MARCELO_T_ALVEAR_DESC:0 "Alvear has already been president in 1922, now with the UCR back in charge and the grises as majority, labor and economic reforms are sure to be implemented. Marcelo sees anti-personalism and social reforms as the solution to Argentina's troubled recent years, it worked once, why shouldn't it work again?"
POLITICS_NICOLAS_REPETTO_DESC:0 "Repetto has been a member of the Socialist Party since the days of Juan B. Justo, as a social democrat Repetto sees rapid socialist policies implementation as trouble and prefers gentle reforms to acommodate the country and economy for a slow revolution. It's unknown if a socialist state is possible in this nation, but with Repetto as president, a chance might exist."
POLITICS_ALFREDO_PALACIOS_DESC:0 "An old school socialist like Repetto, Palacios joined the Socialist Party alongside Juan B. Justo. Being the first Socialist representative in the continent gave fame to his name. Palacios although a social democrat is not a stranger to textbook socialist policies, with Alfredo as president, chances of a total conversion of Argentina to a Socialist State are possible, but a slow revolution might be the path to take."
POLITICS_EDELMIRO_JULIAN_FARREL_DESC:0 "The power struggle inside the G.O.U has led Ramirez to resign, with this, Farrel was to assume the position as head of state, Farrel seems to be a less harshliner integralist, we might not see much from him in this aspect as expanding the military industry seems more important. With Ramirez' resign and Farrel in charge concern grows in the stability of this coalition, new characters may appear in this new political landscape. "
POLITICS_JUNTA_DESC:0 "The argentine army high command has concluded that the government had its days counted already, with the situation in hand, they have taken control of all institutions and are currently deciding the nation's next move."
