 #Argentinia
 
 ARG_heavy_fighter_equipment_3:0 "I.Ae 30 Ñancú P1"
 ARG_heavy_fighter_equipment_3_short:0 "Ñancú P1"
 ARG_heavy_fighter_equipment_3_desc:0 "El I.Ae. 30 "Ñancú", que lleva el nombre de un águila indígena de la Patagonia, fue diseñado por el ingeniero italiano Cesare Pallavicino, que había llegado a Argentina en 1946. Pallavicino dirigió un equipo de técnicos e ingenieros argentinos en el desarrollo del concepto de un caza de escolta de alta velocidad, destinado a ser operado en conjunto con los bombarderos utilizados en la Fuerza Aérea Argentina."
 ARG_strat_bomber_equipment_1:0 "Boeing B-17 Flying Fortress"
 ARG_strat_bomber_equipment_1_short:0 "B-17"
 ARG_strat_bomber_equipment_3:0 "Avro Lancaster"
 ARG_strat_bomber_equipment_3_short:0 "Avro Lancaster"
 
 ARG_fighter_equipment_0:0 "FMA D.21"
 ARG_fighter_equipment_0_short:0 "D.21"
 ARG_fighter_equipment_0_desc:0 "El Dewotine D.21 fue un avión de caza monoplano de cabina abierta y tren de aterrizaje fijo diseñado en Francia en la década de 1920. El gobierno argentino compró 9 unidades del D.21 al gobierno suizo en 1929. En la década de 1930, se adquirió la licencia y se comenzó a producir localmente en Córdoba hasta finales de 1936, cuando el D.21 fue sustituido por el Hawk H-750".
 ARG_fighter_equipment_1:0 "FMA Hawk 75O"
 ARG_fighter_equipment_1_short:0 "Hawk 75O"
 ARG_fighter_equipment_1_desc:0 "El Hawk 750 fue un monoplano monoplaza fabricado por Curtis en la década de 1930. La "Dirección General de Aeronáutica" compró 30 unidades del Curtiss Hawk H-75O y posteriormente adquirió la licencia del Hawk H-75O bajo la FMA para sustituir al anticuado D.21."
 ARG_fighter_equipment_2:0 "Fiar Cr.32"
 ARG_fighter_equipment_2_short:0 "Cr.32"
 ARG_fighter_equipment_3:0 "North American P-51 Mustang"
 ARG_fighter_equipment_3_short:0 "P-51 Mustang"

 ARG_cv_fighter_equipment_2:0 "Vought F4U Corsair"
 ARG_cv_fighter_equipment_2_short:0 "F4U Corsair"
 ARG_cv_fighter_equipment_2_desc:0 "El Vought F4U Corsair fue un avión de combate estadounidense que vio servicio principalmente en la Segunda Guerra Mundial y la Guerra de Corea. El gobierno argentino compró 26 F4U Corsair al gobierno de los Estados Unidos, los cuales fueron incorporados al "Escuadrón Naval de Caza y Ataque", con sede en la base aeronaval "Punta Indio"."
 ARG_cv_fighter_equipment_3:0 "Grumman F6F Hellcat"
 ARG_cv_fighter_equipment_3_short:0 "F6F Hellcat"

 ARG_nav_bomber_equipment_1:0 "Supermarine Walrus"
 ARG_nav_bomber_equipment_1_short:0 "Morsa"
 ARG_nav_bomber_equipment_1_desc:0 "El Supermarine Walrus fue un biplano anfibio monomotor británico, fabricado por la compañía aeronáutica británica Supermarine. 2 unidades fueron adquiridas por Argentina y fueron asignadas a la rama de Aviación Naval de la armada, donde sirvieron hasta 1948."
 ARG_nav_bomber_equipment_2:0 "Short S25 Sunderland"
 ARG_nav_bomber_equipment_2_short:0 "S25 Sunderland"
 ARG_nav_bomber_equipment_3:0 "Martin PBM Mariner"
 ARG_nav_bomber_equipment_3_short:0 "PBM Mariner"
 ARG_nav_bomber_equipment_3_desc:0 "El PBM Mariner fue un patrullero-bombardero naval fabricado por la empresa Glenn L. Martin, que se utilizó por primera vez en 1940, a cargo de la US Navy. 9 unidades fueron adquiridas por la Armada Argentina, y posteriormente se integraron a la rama de Aviación Naval de la Armada."
 
 ARG_CAS_equipment_1:0 "Douglas Modelo 8A-2"
 ARG_CAS_equipment_1_short:0 "8A-2"
 ARG_CAS_equipment_1_desc:0 "El Douglas Modelo 8A-2 era un monoplano de ataque biplaza. Fue construido para la Fuerza Aérea Argentina por la Douglas Aircraft Company como una variante especial del Northrop A-17, produciéndose 30 unidades e integrándose en el Regimiento de Ataque Nº 2."
 ARG_CAS_equipment_2:0 "I.Ae 22 DL"
 ARG_CAS_equipment_2_short:0 "I.Ae 22 DL"
 ARG_CAS_equipment_3:0 "I.Ae 30 Ñancú Pallavicino 2"
 ARG_CAS_equipment_3_short:0 "Ñancú P2"
 ARG_CAS_equipment_3_desc:0 "El Ñancú P2 fue un bombardero ligero biplaza diseñado por Cesare Pallavicino y fabricado por la FMA. Era una variante del Ñancú I.Ae 30, que tenía las alas más largas y un menor peso debido a la sustitución de las góndolas de los motores."
 
 ARG_tac_bomber_equipment_0:0 "Junkers Ju 52"
 ARG_tac_bomber_equipment_0_short:0 "Ju 52"
 ARG_tac_bomber_equipment_1:0 "FMA AeMB.2"
 ARG_tac_bomber_equipment_1_short:0 "FMA AeMB.2"
 ARG_tac_bomber_equipment_1_desc:0 "El FMA AeMB.2 Bombi fue un avión bombardero desarrollado en Argentina a mediados de la década de 1930. Era un monoplano de ala baja en voladizo de configuración convencional. Estaba equipado con un tren de aterrizaje de rueda de cola fija, cuyas unidades principales estaban cubiertas por largos carenados tipo "pantalón". La configuración inicial del AeMB.1 estaba equipada con una torreta de ametralladora dorsal, que posteriormente se eliminó del AeMB.2 para mejorar la estabilidad. Quince ejemplares de producción entraron en servicio en la Fuerza Aérea Argentina entre 1936 y 1945."
 ARG_tac_bomber_equipment_2:0 "North American B-25 Mitchell"
 ARG_tac_bomber_equipment_2_short:0 "B-25 Mitchell"
 ARG_tac_bomber_equipment_3:0 "I.Ae 24 Calquín"
 ARG_tac_bomber_equipment_3_short:0 "Calquín"
 ARG_tac_bomber_equipment_3_desc:0 "El I.Ae.24 Calquín (palabra mapudungun que significa "Águila Real") fue un bombardero táctico diseñado y construido por el Instituto Aerotécnico de Córdoba. Inspirado en el exitoso Mosquito de Havilland, el Calquín tenía una estructura de madera similar a la del FMA AeMB.2, y fue el primer avión bimotor diseñado y construido en Argentina. Se construyeron 101 unidades de este avión, y el último fue dado de baja en 1960".
 
 ARG_jet_fighter_equipment_1:0 "FMA I.Ae. 27 Pulqui I"
 ARG_jet_fighter_equipment_1_short:0 "Pulqui I"
 ARG_jet_fighter_1_desc:0 "El I.Ae. 27 Pulqui I fue un jet argentino diseñado en el Instituto Aerotécnico en 1946. Sólo se completó un prototipo; un rendimiento insatisfactorio hizo que el avión fuera sustituido por un diseño posterior. El fuselaje era semimonocasco con una sección transversal elíptica que albergaba un único motor Rolls-Royce Derwent 5 con la toma de aire en el morro y los conductos rodeando la cabina."
 ARG_jet_fighter_equipment_2:0 "FMA IAe 33 Pulqui II"
 ARG_jet_fighter_equipment_2_short:0 "Pulqui II"
 ARG_jet_fighter_equipment_2_desc:0 "El FMA IAe 33 Pulqui II fue un avión de combate monoplaza diseñado por Kurt Tank a finales de los años 40 en Argentina, bajo el gobierno de Perón, y construido por la FMA. Su armazón era puramente metálico y la cabina estaba presurizada con una cubierta tipo burbuja."
 
