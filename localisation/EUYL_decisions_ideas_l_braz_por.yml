 ARG_the_great_revolution_desc:0 "Após se recusar a realizar as próximas eleições, muitos argentinos de todo o país chegaram ao limite. Chega de governos corruptos, chega de líderes incompetentes, chega de ditaduras militares, chega de golpes, chega de infortúnio econômico, e decidiram se reunir coletivamente para tentar derrubar completamente o governo, exclamando 'La Argentina es del pueblo!'. O país, como resultado dessa revolução em grande escala, está se desestabilizando rapidamente, e será apenas questão de tempo até que exploda!\n\n£infantry_equipment_text_icon  Armas estocadas: [?ARG_stockpiled_guns|0Y] \n\n£arg_socialist_texticon  Influência subversiva §YSocialista§!: [?ARG_ps_subversive_influence|0Y]\n£arg_marxist_texticon  Influência subversiva §YMarxista§!: [?ARG_marxist_subversive_influence|0Y]\n£arg_anarchist_texticon  Influência subversiva §YAnarquista§!: [?ARG_anarchist_subversive_influence|0Y]\n£arg_posadist_texticon  Influência subversiva §YPosadista§!: [?ARG_posadist_subversive_influence|0Y] \n\n§RA facção com mais §!§YInfluência subversiva§!§R assumirá o poder!\nQuanto maior a §!§YTensão política§!§R, mais fortes seremos!§!"
