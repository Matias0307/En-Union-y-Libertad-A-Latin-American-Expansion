 EUYL_peru_ecuador_rising_tensions:0 "Tensões crescentes entre Peru e Equador"
 EUYL_peru_ecuador_rising_tensions_desc:0 "Peru e Equador têm uma história conturbada entre si. Fronteiras não resolvidas na região de Pastaza acabaram em vários conflitos sangrentos que não levaram a lugar nenhum, e agora não é diferente. Houve um esforço para sufocar as tensões com uma linha de status quo proposta e, embora tenha sido acordada, não há dúvida de que não durará. O tempo dirá como essa situação se resolverá, mas até agora a coisa não está bonita."
