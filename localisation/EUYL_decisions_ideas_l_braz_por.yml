 #Colômbia
 escuela_combate:0 "Escola de guerra superior"
 escuela_combate_desc:0 "Os variados biomas da nação a tornam o lugar perfeito para treinar nossos líderes do exército nos diversos tipos de terreno em que nossas tropas lutarão."
 train_des:0 "Treinamento de combate em desertos"
