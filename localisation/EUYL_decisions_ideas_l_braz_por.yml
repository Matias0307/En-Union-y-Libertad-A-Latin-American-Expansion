 HON_kingdom_of_honduras_modifier:0 "O Reino de Honduras"
 HON_kingdom_of_honduras_modifier_desc:0 "Com a chegada de nobres espanhóis, Honduras foi declarada reino mais uma vez, com §YCarlos Pio Habsburgo§! como seu rei. Esta nova monarquia traz um senso de estabilidade e tradição, além de abrir novas oportunidades para relações internacionais e comércio. Contudo, também traz desafios próprios, pois o governo deverá navegar pelas complexidades de uma monarquia constitucional e garantir que os direitos e liberdades dos cidadãos sejam respeitados."
