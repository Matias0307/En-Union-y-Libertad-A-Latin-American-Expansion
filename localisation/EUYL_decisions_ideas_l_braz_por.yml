 BOL_the_1936_coup_d_etat:0 "O Golpe de Estado de 1936"
 BOL_the_1936_coup_d_etat_desc:0 "Após o catastrófico fracasso que foi a Guerra do Chaco, muitos militares começaram a perder a confiança no governo e a se voltar contra Sorzano. Os militares estão planejando algo, e seja o que for, não pode ser coisa boa."
 BOL_civil_civil_war_divisions_counter_full_breakdown:0 "O Governo Boliviano começaria atualmente com [?BOL.BOL_civilian_army_divisions|+0] §HDivisões§!, se a Guerra Civil começasse agora.\n"
 BOL_civil_civil_war_divisions_counter_icon_value:0 "[?BOL.BOL_civilian_army_divisions|0H]"
 BOL_military_civil_war_divisions_counter_full_breakdown:0 "As Forças Armadas Bolivianas começariam atualmente com [?BOL.BOL_military_divisions|+0] §HDivisões§!, se a Guerra Civil começasse agora.\n"
 BOL_military_civil_war_divisions_counter_icon_value:0 "[?BOL.BOL_military_divisions|0H]"
 BOL_the_great_coup:0 "O Grande Golpe"
 BOL_the_great_coup_desc:0 "Os oficiais do nosso Exército estão fartos da instabilidade política e do governo fracassado, e decidiram tomar as rédeas da situação. Para o bem ou para o mal, só podemos imaginar aonde esse evento pode levar."
 BOL_arrest_army_officers:0 "Prender oficiais do Exército"
 BOL_gain_the_trust_of_the_people:0 "Conquistar a confiança do povo"
 BOL_challenge_the_militarys_authority:0 "Desafiar a autoridade dos militares"
 BOL_conscript_a_militia_regiment_in_FROM:0 "Recrutar um regimento de milícia em [FROM.GetName]"
 BOL_regaining_the_trust_of_the_people:0 "Recuperando a confiança do povo"
 BOL_regaining_the_trust_of_the_people_desc:0 "Nossa população ficou muito irritada com o nosso exército e com o governo como um todo, sentindo que os 'abandonamos', o que absolutamente não é o caso. Não importa o anúncio nacional que façamos, simplesmente não há como o povo confiar em nós. Por isso tomaremos ações em vez de palavras, para recuperar a confiança do povo e fazê-lo perceber que não somos os vilões deste cenário."
