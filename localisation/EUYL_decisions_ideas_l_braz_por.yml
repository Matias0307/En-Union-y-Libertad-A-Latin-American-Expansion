 COS_nazi_sympathizers_desc:0 "Devido ao fluxo de imigrantes alemães após a Primeira Guerra Mundial, somado às instituições alemãs do país, a admiração nacional pela comunidade alemã provocou um crescimento do nazismo na Costa Rica. Em conjunto com o governo mais nacionalista e de estilo caudilhista da Costa Rica, esse movimento conseguiu ganhar força entre a população. Embora ainda não seja uma ameaça grave ao governo, é importante ficar de olho nesse movimento, pois ele pode levar à instabilidade no futuro."
