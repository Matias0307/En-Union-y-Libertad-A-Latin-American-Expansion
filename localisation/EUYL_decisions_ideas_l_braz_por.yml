 ROOT_the_second_war_of_the_pacific:0 "A Segunda Guerra do Pacífico"
 ROOT_the_second_war_of_the_pacific_desc:0 "Nosso continente voltou a cair no caos e na guerra. Muitos espectadores do mundo exterior já classificam este conflito como o mais sangrento que a América do Sul já viu. Precisamos derrubar rapidamente nossos inimigos se não quisermos que este conflito se prolongue por muito mais tempo e vidas sejam desperdiçadas. Todos os nossos esforços serão dedicados a este conflito, mesmo que isso signifique passar fome temporariamente em nossa própria nação. Será pelo bem maior do povo!"
