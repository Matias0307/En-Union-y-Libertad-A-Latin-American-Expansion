 PRU_the_peruvian_civil_war:0 "O Golpe Peruano"
 PRU_the_peruvian_civil_war_desc:0 "Depois da vergonha que foram as eleições de 1936 e da corrupção descarada que o governo de Óscar demonstrou ao anular os resultados eleitorais. Como se isso já não fosse ruim o bastante, Óscar foi além e prendeu a maioria dos simpatizantes e políticos fascistas. Também deportou alguns para o Chile e baniu completamente a UR. São atos que não podemos perdoar, e Óscar pagará por isso, e pagará com tudo o que tem. \n\nAtualmente, as chances de termos uma §RGuerra Civil§! são de §R[?PRU_chance_of_civil_war|R0]%§! \n\nAtualmente, as chances de termos um §GGolpe Pacífico§! são de §G[?PRU_chance_of_peaceful_coup|G0]%§!"
 PRU_overthrow_oscars_government:0 "Derrubar o governo de Óscar"
 PRU_overthrow_oscars_government_desc:0 "Estamos planejando um golpe para derrubar o governo de Óscar. Encontrarmos resistência ou não dependerá de muitos fatores, mas uma coisa é certa: os partidários de Óscar não cooperarão imediatamente conosco, aconteça o que acontecer, então precisamos estar preparados."
 PRU_talk_with_opposition_members:0 "Conversar com membros da oposição"
 PRU_set_free_fascist_politicians:0 "Libertar os políticos fascistas"
 PRU_spread_mass_propaganda:0 "Espalhar propaganda em massa"
 PRU_opposition_arresting_our_supporters:0 "A Guarda Civil prendendo nossos apoiadores"
 PRU_opposition_arresting_our_supporters_desc:0 "A Guarda Civil está prendendo muitos de nossos apoiadores em resposta ao aumento repentino de nossa popularidade e ao planejamento do golpe. Precisam ser detidos!"
