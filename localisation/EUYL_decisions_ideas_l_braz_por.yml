 COS_ccss:0 "CCSS"
 COS_ccss_desc:0 "A Caixa Costarriquenha de Seguro Social (CCSS) é uma instituição governamental responsável por prestar serviços de seguridade social aos cidadãos da Costa Rica. Foi estabelecida em 1941 e, desde então, tornou-se parte vital do sistema de saúde do país, oferecendo atendimento médico, pensões e outros benefícios sociais a seus membros. A CCSS é financiada por contribuições de empregadores, trabalhadores e do governo, e desempenha um papel crucial para garantir o bem-estar da população costarriquenha."
