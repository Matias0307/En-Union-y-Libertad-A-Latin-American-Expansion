 PRU_conquering_the_imperialist_europeans:0 "Conquistando os europeus imperialistas"
 PRU_conquering_the_imperialist_europeans_desc:0 "Depois de conquistar a América do Sul e nos estabelecer como potência global, podemos realmente terminar o que começamos. Toda a razão do nosso renascimento foi apenas nos vingarmos dos malditos europeus e dar a eles um gostinho do próprio veneno. Não pararemos até que TODAS as nações europeias tenham sido dizimadas."
 PRU_conquer_the_european_continent:0 "Conquistar o continente europeu"
 PRU_conquer_the_european_continent_desc:0 "Como toda a nossa existência se apoia na conquista do continente, o povo exige que eliminemos os europeus com sucesso em até 5 anos. Se não conseguirmos cumprir essa tarefa nesse prazo, muitos de nossos apoiadores nos trairão e desintegrarão mais uma vez o Império Inca. Não por colonialistas, mas pelo nosso próprio povo."
