 EUYL_defense_pact:0 "O Pacto de Defesa"
 EUYL_defense_pact_desc:0 "Um Pacto de Defesa formado pela Confederação Peru-Boliviana. Eles nos protegerão se algum dia nos virmos em conflito."
 EUYL_defense_pact_call_refused:0 "Chamado do Pacto de Defesa recusado!"
 PBC_cooperating_with_french_resistance:0 "Cooperando com a Resistência Francesa"
 PBC_reforming_lost_unions:0 "Reformando as uniões perdidas"
 PBC_reforming_lost_unions_desc:0 "O panorama atual do continente é compacto demais... Há nações demais, e isso causa conflitos desnecessários, então vamos começar a resolver esses conflitos. Podemos restaurar à força essas antigas uniões, como a nossa. Elas podem ser nossos fantoches e se tornar potências como nós. Ao fazê-lo, poderemos não só mediar a maioria dos conflitos da região, como também levar paz e prosperidade a um lugar que um dia foi cheio de caos."
