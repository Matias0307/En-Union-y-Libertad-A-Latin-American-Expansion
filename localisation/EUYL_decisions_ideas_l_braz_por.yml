 CHL_internal_political_split_desc:0 "Com as tensões globais aumentando lentamente e ideologias extremas como o Fascismo e o Comunismo correndo soltas pelo mundo, nossa nação está sendo profundamente afetada. As cicatrizes da Grande Depressão, somadas ao crescimento de poder da Alemanha Nazista e da União Soviética, alimentam o avanço dessas ideologias extremistas dentro do país a um ritmo alarmante. O bastião da democracia que somos hoje pode não durar, caso permitamos que os Nacistas ou os Comunistas se fortaleçam ainda mais. Também não ajuda o fato de estarem presos em uma luta interminável pelo poder, prejudicando muito nossa capacidade de governar. Devemos ficar atentos: um único passo errado pode mergulhar a nação no caos absoluto.\n\n§RSe ambas as facções alcançarem a categoria de poder §RPrincipal§!, nosso poder político será colocado em risco (-20%)!§!"
 CHL_POWER_CATEGORY_TOOLTIP:0 "A categoria de poder atual da facção. Quanto maior a categoria, maior influência ela possui sobre o governo e suas políticas. As categorias são:\n\n§GIntegrado§!: Exclusivo dos £CHL_communista_text  §YComunistas§! - A facção está totalmente integrada ao governo, sem interferir diretamente, mas podendo apresentar exigências.\n§gExcluído§!: A facção está fora do governo e possui pouca ou nenhuma influência.\n§YMarginal§!: A facção possui pequena influência.\n§OInfluente§!: A facção possui influência moderada.\n§RPrincipal§!: A facção possui grande influência sobre o governo e suas políticas."
 CHL_BOP_INFLUENCE_TOOLTIP:0 "A influência semanal da facção no equilíbrio de poder. Esse valor determina a velocidade com que ela aumenta seu domínio no sistema. Quanto maior o valor, mais rápido o ganho de poder."
