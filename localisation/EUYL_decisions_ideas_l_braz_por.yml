 COS_rewrite_the_constitution_desc:0 "Um líder foi reeleito recentemente, embora a constituição atual da Costa Rica não permita reeleições. Isso causou muita controvérsia e agitação no país, com muitos pedindo a reescrita da constituição para permitir reeleições."
