 EUYL_1936_status_quo:0 "Status quo de 1936"
 EUYL_1936_status_quo_desc:0 "O status quo de 1936 foi acordado por Peru e Equador após a intervenção de Washington. No entanto, essa paz temporária é muito frágil, pois ambos os lados guardam ressentimentos importantes contra o outro, e uma guerra entre os dois é simplesmente inevitável."
