 HON_american_owned_industry_desc:0 "Empresas americanas controlam nossa economia há muitos anos, desde a descoberta do chamado 'ouro cultivado'. Embora isso tenha beneficiado nossa economia inicialmente, com o tempo fez com que nossa economia se tornasse apenas uma extensão da dos [USA.GetAdjective], dependendo completamente dela. Nossa indústria não funciona sem essas empresas, o que pode gerar consequências econômicas devastadoras se continuarmos assim. Apesar disso, expulsá-las também seria prejudicial devido à nossa dependência. É uma situação complicada."
