 COS_crackdown_on_fascism_desc:0 "Tornou-se claro que o fascismo é uma ameaça crescente à nossa nação. Para proteger os direitos e as liberdades de nossos cidadãos, devemos adotar uma postura firme contra as ideologias e organizações fascistas. Essa repressão envolverá maior vigilância, prisões e deportações daqueles que promovem o fascismo, bem como campanhas de educação pública para conscientizar sobre os perigos dessa ideologia."
