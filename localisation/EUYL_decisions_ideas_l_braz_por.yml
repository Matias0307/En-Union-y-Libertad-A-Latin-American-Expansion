 URG_form_liga_federal_category:0 "Reformar a Liga Federal"
 URG_form_liga_federal_category_desc:0 "A Liga Federal foi uma aliança de províncias no que hoje é considerado Argentina, Uruguai e Sul do Brasil. Esse estado, que um dia existiu, surgiu durante a revolução contra os espanhóis, mas teve vida curta. Talvez, com expansão e subjugação suficientes dos nossos vizinhos, possamos trazer de volta este antes poderoso estado."
