 PRU_united_for_the_revolution:0 "Unidos pela Revolução"
 PRU_united_for_the_revolution_desc:0 "Desde a ascensão ao poder dos recentes ditadores, seu reinado de terror tem sido sentido em todo o país, especialmente entre aqueles que simpatizam com os ideais do comunismo. Fomos oprimidos, maltratados e humilhados por acreditar no que consideramos certo para o país. Esses degenerados de mente doentia e retorcida logo entenderão o terrível erro que cometeram, e faremos questão de erguer a bandeira vermelha, alta e orgulhosa, sobre os seus corpos. Viva la Revolución! \n\nApoio atual à £arg_marxist_texticon  §YRevolução§!: [?PRU_support_for_the_revolution|G0]/[?PRU_100|Y0]"
 PRU_adopting_an_expansionist_policy_will_cause_social_democrat_uprising_tt:0 "\n§RAdotar uma política expansionista trairá as nossas promessas ao Partido Socialista, e os social-democratas se revoltarão contra nós!§!"
