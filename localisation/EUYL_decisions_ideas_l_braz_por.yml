 PRU_government_periodically_will_brutally_opress_us_tt:0 "\n§RO governo caçará periodicamente os nossos apoiadores e os perseguirá, reduzindo o nosso apoio à Revolução!§!"
 PRU_the_revolution_has_no_boundaries:0 "A Revolução não tem fronteiras"
