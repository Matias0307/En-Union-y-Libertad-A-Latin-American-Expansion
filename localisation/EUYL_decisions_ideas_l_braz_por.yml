 CHL_anarchist_council_desc:0 "Embora representemos a ausência de um governo central e nos oponhamos à ideia de o povo ser conduzido por uma entidade, é importante que nos organizemos com um conselho, agora que somos uma nação soberana. O conselho será composto por diversas pessoas selecionadas completamente ao acaso e depois verificadas pelo próprio povo, e elas questionarão nossas ações como nação e decidirão se as apoiam ou se vão contra elas. \n\n[ROOT.GetCouncilOpinion]"
