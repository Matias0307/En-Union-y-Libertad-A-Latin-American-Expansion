 ECU_partial_gold_standard_abandonment:0 "Abandono parcial do padrão-ouro"
 ECU_partial_gold_standard_abandonment_desc:0 "O padrão-ouro foi rejeitado no Equador em 1932, devido ao fracasso em alcançar os resultados que os equatorianos esperavam com a missão Kemmerer. Esse abandono, junto com a grande depressão americana, causou grave instabilidade econômica."
 ECU_full_gold_standard_abandonment:0 "Abandono total do padrão-ouro"
 ECU_full_gold_standard_abandonment_desc:0 "Uma decisão da qual não podemos mais voltar atrás. A estabilidade econômica pode oscilar ainda mais agora, mas pelo menos a moeda equatoriana deixará realmente de depender do valor do ouro"
 ECU_returned_to_the_gold_standard:0 "Retorno ao padrão-ouro"
 ECU_returned_to_the_gold_standard_desc:0 "A julgar pela nossa atividade econômica entre 1927 e 1932, quando ainda usávamos o padrão-ouro, está claro que esse foi o ponto de maior estabilidade da economia. Mesmo que traga desvantagens a longo prazo, por ora vale a pena."
