 PBC_nationalism_rising:0 "Nacionalismo em ascensão"
 PBC_nationalism_rising_desc:0 "Com a nossa guerra de independência já superada, muitos em nossa recém-formada união estão descontentes com ela e ainda guardam sentimentos nacionalistas pelos seus países de origem. Esses nacionalistas já acumularam enorme popularidade em toda a nação e, se não os mantivermos sob controle, nossa soberania será seriamente colocada em dúvida. \n\nNúmero de estados controlados pelos £BOL_bolivia_flag  §YNacionalistas bolivianos§!: §R[?PBC_BOL_states_controlled_by_nationalists|R0]§! \n\nNúmero de estados controlados pelos £PRU_peru_flag  §YNacionalistas peruanos§!: §R[?PBC_PRU_states_controlled_by_nationalists|R0]§! \n\n\n§RSe qualquer um dos lados controlar pelo menos§! §Ymetade§!§R dos seus respectivos estados, esse lado lançará um levante!§!"
