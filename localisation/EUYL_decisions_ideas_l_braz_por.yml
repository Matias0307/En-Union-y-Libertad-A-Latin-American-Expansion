 ARG_internal_tensions:0 "Tensões internas"
 ARG_internal_tensions_desc:0 "Devido às recentes mudanças políticas, a situação interna do país vem ficando sombria, pois muitos grupos se levantam para expressar seu ódio ao governo atual. Este país realmente nunca conhecerá a paz."
 ARG_rapidly_deterioriating_political_situation:0 "Situação política em rápida deterioração"
 ARG_rapidly_deterioriating_political_situation_desc:0 "Muitos setores da Concordância, mais democrática e liberal, começaram a se aliar à União Cívica Radical e aos socialistas para iniciar os preparativos de uma revolução em grande escala contra Manuel Fresco, com o objetivo de retomar o controle da nação e não permitir que um governo fascista permaneça no poder."
