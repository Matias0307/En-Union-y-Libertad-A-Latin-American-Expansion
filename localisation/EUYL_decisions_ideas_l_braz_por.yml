 CHL_political_instability_desc:0 "Com a crescente popularidade de um partido de extrema-direita conhecido como os Nacistas e o aumento do sentimento comunista devido às dificuldades econômicas enfrentadas por muitos chilenos, o cenário político do Chile está se tornando cada vez mais instável. O governo deve navegar cuidadosamente nesse delicado equilíbrio de poder entre as duas facções, enquanto também enfrenta os problemas que levaram ao crescimento de ambas."
