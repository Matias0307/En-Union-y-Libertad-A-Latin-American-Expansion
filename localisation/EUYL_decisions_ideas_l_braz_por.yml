 HON_memory_of_the_second_civil_war_desc:0 "A Segunda Guerra Civil Hondurenha, também chamada de 'Revolución Reivindicatoria', foi um conflito interno entre o então presidente Rafael López Gutiérrez e o exército constitucionalista, numa tentativa de impedir que o presidente tomasse o país e se tornasse um ditador. Até hoje, este é o conflito mais sangrento e destrutivo enfrentado por Honduras. Caso outro líder tente seguir os passos de López Gutiérrez, o povo se levantará novamente para impedir isso." 
