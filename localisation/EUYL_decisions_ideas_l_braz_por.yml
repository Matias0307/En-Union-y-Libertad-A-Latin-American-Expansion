 ARG_1937_elections:0 "As Eleições de 1937"
 ARG_1937_elections_desc:0 "Nossa agitação política ainda não diminuiu e muito provavelmente não desaparecerá por muito tempo. As tensões entre os partidos estão aumentando e o espectro político como um todo vai ficando, lenta mas seguramente, feio. Tudo o que realmente podemos fazer é torcer para que não haja derramamento de sangue e que tudo seja resolvido de forma pacífica.\n\n             ~~~~ §YVotos eleitorais previstos§! ~~~~ \n  £ucr_a_texticon §CUnión Cívica Radical Antipersonalista§!:  [?ARG_predicted_UCRA_electoral_votes|Y0]\n  £ucr_texticon §RUnión Cívica Radical§!:  [?ARG_predicted_UCR_electoral_votes|Y0]\n  £partido_socialista_texticon §OPartido Socialista§!:  [?ARG_predicted_PS_electoral_votes|Y0]\n\n§ROs vencedores serão determinados com base nos§! §YVotos eleitorais§!§R. O partido com mais votos eleitorais vencerá as eleições, independentemente da popularidade desse partido.§!"
 ARG_the_1937_elections:0 "As Eleições de 1937"
 ARG_military_conscription:0 "Conscrição militar argentina"
 ARG_infamous_decade_cat:0 "Década Infame"
 ARG_infamous_decade_cat_desc:0 "O panorama político atual é uma bagunça na Argentina. Desde o brutal golpe de Estado de 1930 que derrubou Hipólito Yrigoyen, a Argentina vem em queda livre. O povo está se agitando e os militares vigiam muito de perto cada um dos nossos movimentos. Um pequeno erro pode significar mais uma tomada de poder militar. \n\nO status da £ucr_a_texticon §YUCRA§! é: [ROOT.GetPartyOpinionUCRA]\nO status da £ucr_texticon §YUCR§! é: [ROOT.GetPartyOpinionUCR]\nO status do £partido_socialista_texticon §YPS§! é: [ROOT.GetPartyOpinionPS]\nO status dos £col_militar §YMilitares§! é: [ROOT.GetOpinionMilitaryArgentina]"
