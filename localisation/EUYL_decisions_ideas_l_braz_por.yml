 # Confederação Peru-Boliviana
 PBC_integrating_all_our_claimed_lands:0 "Integrando a nossa legítima argila"
 PBC_integrating_all_our_claimed_lands_desc:0 "Como nossas políticas não coincidem direito, teremos de integrar manualmente os territórios que acabamos de adquirir. Isso exigirá tempo, recursos e os nossos homens, mas, se quisermos realmente alcançar a Confederação que um dia fomos, precisamos integrar totalmente todos os territórios que possuímos e nos tornar a Confederação que nossos antecessores não conseguiram alcançar!"
