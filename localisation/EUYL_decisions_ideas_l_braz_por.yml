 COL_revivir_confederacion_desc:0 "[GetConfederationWarStatus]"
 COL_confederation_war1:0 "Tanto [PRU.GetFlag]§YPeru§! quanto [BOL.GetFlag]§YBolívia§! foram libertados conjuntamente pelo general Bolívar, mas suas discrepâncias impediram a oportunidade real de se consolidarem como uma nação unificada.\n\nSe conseguirmos evocar o sentimento de sedição, talvez possamos aproveitar e restaurar a antiga §YConfederação Peru-Boliviana§!."
 COL_confederation_war2:0 "Agora que os insurgentes triunfaram e a nova [PRU.GetFlag]§YConfederação Peru-Boliviana§! foi proclamada, é a nossa hora de agir. Devemos consolidar nossa superioridade sobre eles antes que nos vejam como uma ameaça. \n\nPoder sobre a §YConfederação§!: [?COL.COL_poder_confederacion|+0]\n\n§RSe não for possível transformar a Confederação Peru-Boliviana em um fantoche após sua reunificação, eles poderão ir à guerra contra nós!§!\n"
 COL_confederation_war3:0 "Apoiados por [COL.GetFlag]§YColômbia§!, partidários fascistas que buscam reunificar a antiga §YConfederação Peru-Boliviana§! se armaram e estão planejando uma insurreição. Devemos preparar o exército para o levante antes que seja tarde demais."

