 COL_incidente_en_japura_desc:0 "O território do que hoje é Japurá fez parte da nossa república há vários anos, mas foi vendido sem querer ao Brasil por políticos. Recuperaremos o que nossos antigos governantes perderam."
 COL_incidente_en_mapari:0 "Provocar um incidente em Mapari"
 COL_incidente_en_mapari_desc:0 "Mapari faz parte da Colômbia desde os tempos de Bolívar e é o ponto mais distante da Amazônia. No entanto, seu potencial de exploração econômica é grande; um potencial que os políticos do passado não viram."

