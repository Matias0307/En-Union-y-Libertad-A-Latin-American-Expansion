 CHL_the_1938_chilean_elections_desc:0 "O povo chileno está se preparando para eleger seu novo presidente. Muitos partidos concorrem ao cargo, mas apenas três se destacam: os Fascistas, o Frente Popular e os Liberais. A disputa entre os três é extremamente acirrada e não há qualquer certeza sobre quem vencerá. Por ora, só o tempo dirá.\n\nNo momento, [ROOT.GetElectionWinner38] vencerá as eleições!\n\nAs Eleições agora são determinadas pela Categoria de Poder e/ou pelo sistema de Equilíbrio de Poder. Se os £CHL_nacista_text  §YNacistas§! estiverem na categoria §RPrincipal§! OU dominarem o §REquilíbrio de Poder§!, eles vencerão. Para o £CHL_frente_popular_text  §YFrente Popular§! e os £CHL_democratic_text  §YLiberais§!, eles vencerão desde que os £CHL_nacista_text  §YNacistas§! NÃO estejam na categoria §RPrincipal§! E NÃO dominem o §REquilíbrio de Poder§!."
