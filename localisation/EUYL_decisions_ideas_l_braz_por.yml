 ECU_significant_support_tt:0 "§7Apoio significativo§!"
 ECU_active_cooperation_tt:0 "§GCooperação ativa§!"
 ECU_CONFLICT_TT:0 "Este sistema representa nossa situação atual em relação aos £ECU_liberal_texticon §YLiberais§! e aos £ECU_conservative_texticon §YConservadores§!. O status pode ir de §RAntagonizando ativamente§! a §GCooperação ativa§!. O §YLíder atual§! também pode influenciar isso, dependendo do partido que representa. No entanto, em última instância, ele não tem muito a dizer sobre o tratamento do país ao partido como um todo. \n\nSe houver uma §YDiferença significativa§! de status entre os dois partidos ou se qualquer um dos lados chegar ao status §RAntagonizando ativamente§!, esse lado causará uma §RInsurreição§!"
