 CHL_el_frente_popular_desc:0 "A Frente Popular é uma coalizão política chilena que reúne diversos partidos e organizações de esquerda. Formada em resposta ao avanço do fascismo e do autoritarismo na Europa durante os anos 1930, seu objetivo é promover democracia, justiça social e os direitos dos trabalhadores no Chile. A Frente Popular teve um papel fundamental na formação da sociedade chilena, e sua influência é sentida até hoje."
