 ARG_infamous_decade_idea:0 "Década Infame"
 ARG_infamous_decade_tt:0 "§LNossa grande nação está sendo consumida pela ganância, pelo medo e pela incerteza. A cada dia que passa, nosso povo confia menos em seu governo, e o medo de outro golpe está presente na mente de todos. Essa incerteza desmoraliza o povo e desestabiliza o país como um todo. Essa situação precisará ser corrigida se quisermos seguir em frente.§!\n\n"
 ARG_corruption_scandal_idea:0 "Escândalo de corrupção"
 ARG_corruption_tt:0 "§LEmbora ninguém queira admitir, a verdade é que nosso país está repleto de corrupção. Dos trabalhadores às elites, corrupção e Argentina andam de mãos dadas. Embora haja dúvidas sobre alguns de nossos políticos por serem potencialmente corruptos, apontar o dedo só causará mais problemas. Se quisermos resolver esse problema, teremos de fazê-lo em silêncio e com o tempo.§!\n\n"
