 ### Brasil
 BRA_not_industrializing_tt:0 "Não tem uma economia em §Yindustrialização§!"
 BRA_industrializing_economy_tt:0 "Nós §Yindustrializamos§! levemente a nossa economia"
 BRA_economic_recession:0 "Recessão econômica"
 BRA_economic_recession_desc:0 "Nossa incapacidade de nos industrializarmos adequadamente deixou muitos sem emprego e, devido a essa onda de desemprego, nossa economia caiu drasticamente. Vai levar tempo para curar nossa economia, e é um tempo de que precisamos para nos concentrar em outras partes da nossa nação."
 BRA_economic_management:0 "Gestão econômica"
 BRA_economic_management_desc:0 "A economia brasileira é uma das maiores de toda a América Latina, então não é surpresa que seja trabalhoso administrá-la como se deve. Precisamos ter muito cuidado com as decisões que tomamos e também ser cautelosos ao industrializar nossa economia, pois estamos fazendo reformas rápidas que nos obrigam a impulsionar uma economia voltada para a indústria."
