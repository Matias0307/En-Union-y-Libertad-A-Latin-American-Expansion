 PAR_legacy_of_solano_lopez_cat:0 "Legado de Solano López"
 PAR_legacy_of_solano_lopez_cat_desc:0 "Passaram-se 7 décadas desde aquela atroz humilhação que sofremos na guerra da Tríplice Aliança. Todo esse tempo fomos odiados, ressentidos e totalmente desprezados. Morreram paraguaios demais, demais para contar, e isso é imperdoável... §RIMPERDOÁVEL§!. §REles pagarão, maldição, com seu sangue, todas essas criaturas vis que nos cercam, cada uma delas. Verão quem realmente somos, e carregaremos a convicção de§! §YSolano López§!§R. Custe o que custar, venceremos!§!"
