 PBC_unlock_conscript_tt:0 "Desbloqueia as decisões de §YRecrutar uma nova milícia no estado§!, que permitem §Gfazer surgir§! uma divisão em §Ycada estado§! que você possua. \n\n§RLembre-se de que só é possível fazer isso uma vez por estado!§!"
 PBC_maneging_the_confederation:0 "Administrando a Confederação"
 PBC_maneging_the_confederation_desc:0 "Sendo a nossa nação muito nova, ela ainda é muito instável. Nossa nação precisa ser reorganizada, e rápido, se quisermos manter a nossa soberania. Nosso primeiro e mais importante objetivo é nomear vários ministérios para organizar adequadamente a nossa nova nação."
