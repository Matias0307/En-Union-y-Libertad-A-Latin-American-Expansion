 BRA_deal_with_the_recession:0 "Lidar com a recessão"
 BRA_dependency_on_our_coffee_productions:0 "Dependência da nossa produção de café"
 BRA_dependency_on_our_coffee_productions_desc:0 "Somos um dos maiores produtores de café do planeta. A maior parte do mundo depende das nossas plantações para o seu suprimento de café. Devido a uma demanda tão alta, a indústria e as plantações de café acumularam enormes quantidades de poder na nossa economia. Por isso, elas ditam boa parte das nossas ações econômicas e industriais. Precisamos controlar o quanto dependemos delas; se não o fizermos, nossa economia pode ser seriamente afetada. \n\nNossa dependência atual da produção de café é: §Y[?BRA_dependency_on_coffee|Y0]%§!\n\nA opinião atual das plantações de café em relação ao nosso governo é: [ROOT.GetCoffeeOpinion]"
