 PRU_restabalizing_our_currency_desc:0 "Agora que preparamos o caminho para lidar com nossos problemas econômicos, podemos começar a lidar com a nossa moeda fraca. Se jogarmos bem as nossas cartas, isso não deve demorar muito e poderemos estabilizar completamente a moeda e seguir pelo caminho certo. Por um Peru poderoso!"
