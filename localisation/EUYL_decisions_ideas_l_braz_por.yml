 COS_1936_elections_desc:0 "A Costa Rica realizará suas eleições nacionais em 1936. Essas eleições determinarão o rumo futuro do país, e muitos desgostam da natureza de ambos os candidatos, que se acusam mutuamente de fascista ou comunista e ameaçam desestabilizar a nação caso o outro candidato vença."
