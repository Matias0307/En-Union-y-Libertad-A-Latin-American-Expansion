 PRU_pathcivilwar_tt:0 "§RESTE caminho PODE levar a uma guerra civil!§!"
 PRU_navy_abandonment_tt:0 "\n§RSe nos tornarmos fascistas e a marinha não tiver sido convertida ao fascismo, o ramo inteiro nos ABANDONARÁ!§!\n"
 PRU_the_purchase_of_japanese_ships:0 "Compra de navios japoneses"
 PRU_the_purchase_of_japanese_ships_desc:0 "Depois de comprar empréstimos estrangeiros do Japão e convidar assessores navais japoneses, além de expandir nossa dizimada marinha, já podemos começar a comprar diversos navios japoneses. A qualidade do navio determinará o seu custo e por quanto tempo teremos de pagar por ele. \n\nOs japoneses devem primeiro aceitar qualquer pedido de compra de um navio, e a IA japonesa será influenciada pelos seguintes fatores: \n\n - §YO tamanho atual da Marinha deles§! \n\n - §YA opinião deles sobre nós§! \n\n - §YO quão pequena é atualmente a nossa Marinha§! \n\n - §YSe estão em guerra ou não§! \n\n - §YO nosso poder industrial atual§!"
