 CEA_stability_drops_before_50_strike_tt:0 "\n\n§RSe a Estabilidade cair abaixo de 40% enquanto este espírito nacional estiver ativo, os trabalhadores das plantações entrarão em greve se a situação não for resolvida dentro de 240 dias.\n\nOs americanos podem ocasionalmente exigir parte dos nossos lucros das plantações de banana!§!"
