l_braz_por:
 EUYL_disband_militia_regiments:0 "Dissolver os Regimentos de Milícia"
 ARG_the_argentine_civil_war:0 "A Guerra Civil Argentina"
 ARG_the_argentine_civil_war_desc:0 "Com a guerra civil a todo vapor, precisamos aproveitar o apoio dos militares para obter melhorias temporárias em nosso ataque, defesa, organização e velocidade. É uma verdadeira vergonha que nosso país tenha de passar por tamanha desgraça, mas isso é necessário para levar esta nação adiante."
 ARG_purchase_FROM_weapons:0 "Comprar armas [FROM.GetAdjective]"
 ARG_division_movement:0 "Melhorar a velocidade de movimento das divisões"
 ARG_division_organization:0 "Melhorar a organização das divisões"
 ARG_division_attack:0 "Melhorar o ataque das divisões"
 ARG_division_defense:0 "Melhorar a defesa das divisões"
 ARG_robertos_deteriorating_health_condition:0 "A deterioração da saúde de Roberto"
 ARG_robertos_deteriorating_health_condition_desc:0 "Após um recente check-up com um médico, descobriu-se que Roberto tem diabetes avançada e que a condição só piorará com o tempo. Não se sabe quanto tempo resta a Roberto, mas podemos tomar medidas para melhorar sua condição. \n\n£arg_medicien_texticon  §YEquipamento médico§!: [?ARG_medical_Equipment]/[?ARG_medical_equipment_upper_limit]\n[ROOT.GetCure]"
 ARG_robertos_renounce:0 "A inevitável renúncia de Roberto"
 ARG_robertos_renounce_desc:0 "A saúde de Roberto vai piorar com o tempo; em algum momento ficará tão ruim que o presidente não conseguirá mais liderar a nação adequadamente e terá de renunciar."
 ARG_give_proper_treatment:0 "Dar a Roberto o tratamento adequado"
 ARG_give_proper_treatment_desc:0 "Dar a Roberto o tratamento adequado nos dará tempo e permitirá que ele continue no cargo por mais tempo."
 ARG_pay_for_better_doctors:0 "Pagar por médicos melhores"
 ARG_pay_for_better_doctors_desc:0 "Pagar por médicos melhores melhorará levemente a condição dele e permitirá que continue no cargo por mais tempo."
 ARG_give_proper_medicine:0 "Dar a Roberto o remédio adequado"
 ARG_give_proper_medicine_desc:0 "Dar a Roberto o remédio adequado nos dará bastante tempo e permitirá que ele continue no cargo por mais tempo."
 ARG_allow_roberto_to_rest:0 "Deixar Roberto descansar"
 ARG_allow_roberto_to_rest_desc:0 "Deixar Roberto tirar uma folga da liderança direta do país nos dará muitíssimo tempo, ao custo de ficarmos sem um líder central adequado por enquanto."
 ARG_convince_roberto_to_work_harder:0 "Convencer Roberto a trabalhar mais"
 ARG_convince_roberto_to_work_harder_desc:0 "Convencer Roberto a trabalhar mais fará a doença progredir mais rápido e a renúncia dele chegar mais cedo."
 ARG_give_him_improper_treatment:0 "Dar a Roberto um tratamento inadequado"
 ARG_give_him_improper_treatment_desc:0 "Dar a Roberto o tratamento errado fará a doença progredir mais rápido e a renúncia dele chegar mais cedo."
 ARG_fake_his_test_results:0 "Falsificar os resultados dos exames dele"
 ARG_fake_his_test_results_desc:0 "Falsificar os resultados dos exames dele fará parecer que a condição dele está melhorando, quando na realidade acontece o contrário."
 ARG_give_roberto_the_wrong_medicine:0 "Dar a Roberto o remédio errado"
 ARG_give_roberto_the_wrong_medicine_desc:0 "Dar a Roberto o remédio errado piorará gravemente a condição dele, com o custo temporário de uma liderança ainda pior, como se a liderança já não fosse ruim o bastante."
 ARG_peron_left_argentina:0 "A partida de Perón para a Itália"
 ARG_peron_left_argentina_desc:0 "Perón deixou a Argentina recentemente, por ordem do Ministério da Guerra, para estudar a guerra de montanha nos Alpes italianos. Muitos especulam que estudar as táticas da Itália também pode afetar os ideais e as crenças de Perón, mas isso são apenas especulações."
 ARG_perons_return:0 "O retorno de Perón à Argentina"
 ARG_perons_return_desc:0 "Perón voltará daqui a cerca de 2 anos. No entanto, parece improvável que isso esteja escrito em pedra."
 ARG_demand_peron_to_report_back:0 "Exigir que Perón apresente suas conclusões"
 ARG_the_great_coup:0 "O Grande Golpe"
 ARG_the_great_coup_desc:0 "Facções das forças armadas estão descontentes com o governo atual e planejam orquestrar um golpe contra o atual líder, mirando principalmente Ramón Castillo."
 ARG_the_coup:0 "O Golpe"
 ARG_the_coup_desc:0 "Estamos preparando o golpe e tentando garantir que Roberto renuncie antes de o executarmos; caso contrário, o povo ficará furioso e muito provavelmente não aceitará Perón como seu novo líder."
 ARG_slight_concessions:0 "Pequenas concessões"
 ARG_moderate_concessions:0 "Concessões moderadas"
 ARG_large_concessions:0 "Grandes concessões"
 ARG_foreign_investments:0 "Oportunidades de investimento estrangeiro"
 ARG_foreign_investments_desc:0 "Muitas grandes potências do mundo abriram suas economias para que invistamos nelas. Embora custosos no início, esses investimentos podem render enormes recompensas em um futuro próximo."
 ARG_invest_in_FROM:0 "Investir na economia de [FROM.GetName]"
 invested_in_ARG:0 "Você já investiu na economia desta nação"
 ARG_invest_in_countries_economy_tt:0 "Vamos §Ginvestir§! na §Yeconomia§! desta nação"
 ARG_debt_repayments:0 "Opções de pagamento da dívida"
 ARG_debt_repayments_desc:0 "Os senadores votaram: temos de pagar nossa 'dívida'. Estejamos realmente obrigados a pagar ou não, esse não é o problema. Precisamos quitar a dívida que temos atualmente com vários grupos da nossa nação. Podemos até receber um bônus por cumprir com eles."
 ARG_repay_our_debt_to_the_senators:0 "Pagar a dívida aos senadores"
 ARG_repay_our_debt_to_the_deputies:0 "Pagar a dívida aos deputados"
 ARG_repay_debt_to_the_chamber_of_deputies:0 "Pagar a dívida à Câmara dos Deputados"
 ARG_repay_debt_to_the_employees:0 "Pagar a dívida aos funcionários"
 ARG_repay_debt_to_war_ministry_officials:0 "Pagar a dívida aos oficiais do Ministério da Guerra"
 ARG_ramon_military_coup:0 "Complô militar?"
 ARG_ramon_military_coup_desc:0 "Setores das forças armadas estão descontentes com o sucessor de [Root.GetLeader] e planejam derrubar completamente o governo. Parecem dispostos a usar a força bruta, se forem obrigados."
 ARG_the_possible_coup:0 "O possível golpe"
 ARG_five_year_plan:0 "O Plano Quinquenal"
 ARG_five_year_plan_desc:0 "Com nossa posição totalmente garantida, agora precisamos nos concentrar na economia e garantir que ela alcance um nível satisfatório. Os países ao nosso redor estão se industrializando rapidamente, e não podemos ficar para trás."
 ARG_invest_in_the_civilian_economy:0 "Investir na economia civil"
 ARG_invest_in_the_military:0 "Investir nas forças armadas"
 ARG_nationalize_the_road_industry:0 "Nacionalizar a indústria rodoviária"
 ARG_nationalize_the_steel_mines:0 "Nacionalizar as minas de aço"
 ARG_nationalize_the_tungsten_mines:0 "Nacionalizar as minas de tungstênio"
 ARG_nationalize_the_oil_fields:0 "Nacionalizar os campos de petróleo"
 ARG_integrate_our_territories:0 "Integrando nossos territórios"
 ARG_integrate_our_territories_desc:0 "Com nossa expansão abrupta por todos os cantos da América do Sul, os povos desses países estão longe de ficar felizes com o nosso domínio sobre eles. Precisamos subjugá-los e integrá-los à nossa nação, mesmo que isso signifique a perda de nossos homens e de nosso poder político. \n\n§RVocê só pode integrar estados que façam fronteira com os seus estados núcleo!§!"
 develop_catamarca_iron_ore_deposits:0 "Desenvolver as jazidas de minério de ferro de Catamarca"
 exploit_the_rio_negro_oil_field:0 "Explorar o campo de petróleo de Río Negro"
 develop_cordoba_aluminium_deposits:0 "Desenvolver as jazidas de alumínio de Córdoba"
 develop_chaco_tungsten_deposits:0 "Desenvolver as jazidas de tungstênio do Chaco"
 develop_buenos_aires_chromium_deposits:0 "Desenvolver as jazidas de cromo de Buenos Aires"
 develop_neuquen_rubber_plantations:0 "Desenvolver as plantações de borracha de Neuquén"
 develop_misiones_steel_deposits:0 "Desenvolver as jazidas de aço de Misiones"
 drill_the_chubut_oil_field:0 "Perfurar o petróleo de Chubut"
 develop_arica_chromium_mines:0 "Desenvolver as minas de cromo de Arica"
 develop_antofagasta_steel_deposits:0 "Desenvolver as jazidas de aço de Antofagasta"
 develop_magallanes_aluminium_deposits:0 "Desenvolver as jazidas de alumínio de Magallanes"
 ARG_inflation:0 "Combatendo a inflação"
 ARG_inflation_desc:0 "A Argentina tem uma história tão longa com a inflação que as duas são quase sinônimos. Precisamos conter a inflação o mais rápido e eficazmente possível, ou nosso país literalmente desabará sobre si mesmo. A inflação é muito imprevisível e precisamos ficar atentos a isso, de modo que qualquer contratempo ou problema que surja precisa ser enfrentado com eficácia. Temos várias maneiras de lidar com a inflação, e precisaremos usar todas elas para nos livrarmos dessa desgraça."
 ARG_inflationary_crisis:0 "Crise inflacionária"
 ARG_inflationary_crisis_desc:0 "A delicada situação da nossa moeda faz seu valor cair constantemente com o tempo. Isso pode ser parcialmente evitado tomando diversas medidas para combater a inflação e freá-la de vez. Boa sorte, você vai precisar."
 ARG_emit_pesos_to_control_inflation:0 "Estabelecer controles de salários e preços"
 ARG_emit_pesos_to_control_inflation_desc:0 "Se quisermos garantir que a inflação não saia do controle, devemos implementar controles de salários e preços. Devido à natureza socialista dessa medida, o partido comunista ganhará poder com isso."
 ARG_employ_a_contractionary_monetary_policy:0 "Adotar uma política monetária contracionista"
 ARG_employ_a_contractionary_monetary_policy_desc:0 "Um pouco mais cara que os controles de salários e preços, mas dá o mesmo efeito e impede que os comunistas ganhem poder."
 ARG_force_companies_to_lower_prices:0 "Obrigar as empresas a reduzir os preços ao consumidor"
 ARG_force_companies_to_lower_prices_desc:0 "Nossa opção mais cara, mas também a mais eficaz: reduz significativamente a inflação depois de seguir seu curso."
 ARG_temporarily_slow_down_the_inflation:0 "Frear temporariamente a inflação"
 ARG_temporarily_slow_down_the_inflation_desc:0 "Com alguns truques na manga, podemos conter temporariamente a crise inflacionária. Infelizmente, isso não é infinito."
 ARG_end_the_inflation:0 "Acabar com a inflação"
 ARG_end_the_inflation_desc:0 "Depois de muitas reformas, agora podemos oficialmente dar o golpe final e estabelecer uma moeda estável."
 ARG_mobilize_elite_militia_in_FROM:0 "Mobilizar uma milícia de elite em [FROM.GetName]"
 ARG_integration_of_the_falklands:0 "Integrando as Malvinas"
 ARG_integration_of_the_falklands_desc:0 "A proximidade das Ilhas Malvinas com o nosso território continental, somada a uma reivindicação que mantemos há mais de 100 anos, faz delas uma parte integral da Argentina, hoje e sempre. Os britânicos serão expulsos das ilhas mais cedo ou mais tarde, e seremos nós a realizar tal feito, a menos que estejam dispostos a cooperar e nos entregar as ilhas, caso em que as aceitaremos com prazer. Em qualquer um dos casos, as Malvinas serão totalmente integradas ao nosso território e consideradas verdadeiramente argentinas!"
 ARG_integrate_the_falklands:0 "Integrar as Malvinas"
 ARG_integrate_the_falklands_desc:0 "Agora que as Malvinas finalmente estão sob nosso controle, podemos de fato 'argentinizá-las'."
 ARG_integrating_territories:0 "Integrar a província de [FROM.GetName]"
 ARG_1937_elections:0 "As Eleições de 1937"
 ARG_1937_elections_desc:0 "Nossa agitação política ainda não diminuiu e muito provavelmente não desaparecerá por muito tempo. As tensões entre os partidos estão aumentando e o espectro político como um todo vai ficando, lenta mas seguramente, feio. Tudo o que realmente podemos fazer é torcer para que não haja derramamento de sangue e que tudo seja resolvido de forma pacífica.\n\n             ~~~~ §YVotos eleitorais previstos§! ~~~~ \n  £ucr_a_texticon §CUnión Cívica Radical Antipersonalista§!:  [?ARG_predicted_UCRA_electoral_votes|Y0]\n  £ucr_texticon §RUnión Cívica Radical§!:  [?ARG_predicted_UCR_electoral_votes|Y0]\n  £partido_socialista_texticon §OPartido Socialista§!:  [?ARG_predicted_PS_electoral_votes|Y0]\n\n§ROs vencedores serão determinados com base nos§! §YVotos eleitorais§!§R. O partido com mais votos eleitorais vencerá as eleições, independentemente da popularidade desse partido.§!"
 ARG_the_1937_elections:0 "As Eleições de 1937"
 ARG_elections_called_off_tt:0 "As §YEleições de 1937§! serão §Gsuspensas§!\n\n"
 ARG_pressure_the_parties_for_faster_elections:0 "Pressionar os partidos por eleições mais rápidas"
 ARG_coup_will_be_shut_down_tt:0 "Os §YMilitares§! serão §Gdesmantelados§! e o golpe será §Gcancelado§!"
 ARG_state_will_be_dealt_with_tt:0 "Os §YMilitares§! neste estado serão §Gdesmantelados§!"
 ARG_shut_down_the_coup:0 "Deter o golpe"
 ARG_march_in_the_province_of_FROM:0 "Marchar sobre a província de [FROM.GetName]"
 ARG_all_states_were_dealt_with_tt:0 "Os militares foram contidos nas províncias de §YTierra del Fuego, Santa Cruz, Chubut, Neuquén e Río Negro§! \n\n§RSe não conseguirmos conter todas as 5 províncias, ainda assim haverá uma guerra civil, com os militares controlando as 5 províncias.§!"
 ARG_states_military_have_influence_over_tt:0 "Estas são as províncias controladas pelos militares"
 ARG_unlock_march_decisions_tt:0 "Desbloqueia a decisão §YDeter o golpe§!, que permitirá §Gdeter§! o golpe e §Gevitar§! uma §Rguerra civil§! ao lidar com todas as províncias controladas pelos militares."
 ARG_fm_is_a_monopoly_tt:0 "A §YFabricaciones Militares§! recebeu o status de monopólio sobre a nossa produção militar."
 PRU_coup_attempt_fascists:0 "Possível tentativa de golpe"
 PRU_coup_attempt_fascists_desc:0 "Após o constrangimento público causado pelo cancelamento das eleições, muitos fascistas da população decidiram se mobilizar e se rebelar contra o cancelamento, ocupando algumas províncias do país. Suas intenções são claras: derrubar o governo atual por meio de uma guerra civil. Precisamos fazer o possível para que isso não aconteça!"
 PRU_states_fascists_have_influence_over_tt:0 "Estas são as províncias controladas pelos §YFascistas§!!"
 PRU_the_coup_attempt:0 "A tentativa de golpe"
 PRU_stop_the_coup:0 "Deter o golpe"
 PRU_march_in_the_province_of_FROM:0 "Marchar sobre a província de [FROM.GetName]"
 PRU_coup_was_shut_down_tt:0 "Os §YFascistas§! foram §GDetidos§!"
 PRU_all_states_were_dealt_with_tt:0 "Os §YFascistas§! foram contidos nas províncias de §YLoreto, Áncash, Piura e Yaguas§! \n\n§RSe não conseguirmos conter todas as 4 províncias, ainda assim haverá uma guerra civil.§!"
 PRU_coup_will_be_shut_down_tt:0 "Os §YFascistas§! serão §GDetidos§! e uma §RGuerra Civil§! será §GEvitada§!"
 PRU_fascists_take_over_states_tt:0 "Os §YFascistas§! tomarão as províncias de §YLoreto, Áncash, Piura e Yaguas§! e começarão os preparativos para uma §RGuerra Civil§!"
 PRU_state_will_be_dealt_with_tt:0 "Os §YFascistas§! nesta província serão §GNeutralizados§!"
 PRU_fascist_coup_attempt:0 "Os §YFascistas§! estão tentando um golpe"
 EUYL_scrap_the_obligatory_military_service:0 "Abolir o serviço militar obrigatório"
 ARG_huemul_reactor:0 "Reator Huemul"
 ARG_peron_returned_from_italy:0 "Perón voltou de sua missão na Itália"
 ARG_if_communism_less_than_45_civil_war_tt:0 "Se o §YComunismo§! for §Rmenor que§! §Y45%§!, uma §RGuerra Civil§! eclodirá! \n\nSe o apoio for §Gmaior que§! §Y45%§!, ocorrerá um golpe pacífico."
 form_commune_of_la_plata:0 "Formar a Comuna de La Plata"
 form_commune_of_la_plata_desc:0 "A região do Prata sempre foi unida culturalmente. O povo é um só, e é hora de oficializar a unificação."
 ARG_form_commune_of_la_plata:0 "Unificar La Plata"
 ARG_controls_all_uruguayan_states_tt:0 "Controla todos os estados §Yuruguaios§!"
 ARG_controls_all_paraguayan_states_tt:0 "Controla todos os estados §Yparaguaios§!"
 ARG_formed_la_plata_tt:0 "Formou §YLa Plata§!"
 ARG_gain_cores_on_urg_and_par_tt:0 "Você obterá §Gnúcleos§! em todos os estados §Yparaguaios§! e §Yuruguaios§!"
 ARG_brazil_may_intervene_tt:0 "§RO Brasil pode intervir se invadirmos o Uruguai sem aviso§!"
 BRA_reestablish_the_police_force:0 "Restabelecer a força policial"
 BRA_gain_claim_on_every_french_state_tt:0 "Obtenha §YReivindicações§! sobre todo estado §Yfrancês§! que [ROOT.GetNameWithFlag] ainda não reivindique nem esteja sob controle [ROOT.GetFlag] [ROOT.GetAdjectiveCap]"
 
 PRU_radicalise_the_moderates_dec:0 "Radicalize os moderados"

 URG_prisoners_of_the_terra_dictatorship:0 "A Ditadura de Terra"
 URG_prisoners_of_the_terra_dictatorship_desc:0 "Desde que Gabriel Terra assumiu o poder no Uruguai, ele governa o país com mão de ferro. Com o passar dos anos, Terra foi ganhando muitos inimigos nos cenários político e social, a ponto de haver tentativas de golpe para derrubá-lo do poder. Por isso, Terra começou a prender muitos políticos, médicos, escritores e até o vice-presidente. A delicada situação da ditadura de Terra agora o obriga a prender essas pessoas, pois, se não o fizer, os partidos de oposição se levantarão e esmagarão o ditador. \n\nNúmero de pessoas importantes presas pelo regime de Terra: [?URG_politicians_arrested|R0] \n\n£stability_texticon  §YEstabilidade: §! [?URG_terra_stability|+%]§!\n\n£occupation_costs  §YDeriva democrática diária: §! [?URG_democracy_from_terra|Y]§Y%§!\n\n£pol_power  §YDeriva neutra diária: §! [?URG_terra_support|Y]§Y%§!\n\n"
 URG_arrest_politicians:0 "Prender pessoas que pareçam suspeitas"
 URG_set_free_politicians:0 "Libertar alguns dos presos"
 URG_repaying_the_debt_to_britain:0 "Pagando nossa dívida com os britânicos"
 URG_repaying_the_debt_to_britain_desc:0 "Os britânicos não têm ficado satisfeitos com a nossa relutância em pagar a dívida que temos com eles, mas isso vai mudar a partir de hoje. Nossa indústria já é forte o bastante para podermos pagá-la, e além disso será útil ter os britânicos como aliados em vez de inimigos. \n\nPorcentagem atual da nossa dívida que já foi paga:  [?URG_debt_to_britain|G0]§G%§!"
 URG_small_debt_repayment:0 "Pequeno pagamento da dívida"
 URG_medium_debt_repayment:0 "Pagamento médio da dívida"
 URG_large_debt_repayment:0 "Grande pagamento da dívida"
 URG_dealing_with_the_protestors:0 "Lidando com os manifestantes"
 URG_dealing_with_the_protestors_desc:0 "Agora que podemos governar a nação com punho de ferro, podemos começar a lidar com os manifestantes que ousam arruinar qualquer parte da nossa nação. Ninguém os obrigou a sair e protestar violentamente, e ninguém os defenderá quando o destino inevitável chegar."
 URG_stomp_out_the_loyalists_in_FROM:0 "Esmagar os legalistas em [FROM.GetName]"
 URG_guide_the_companies:0 "Orientando as empresas"
 URG_guide_the_companies_desc:0 "Como privatizamos a grande maioria da nossa indústria, não podemos mais intervir diretamente no desenvolvimento industrial nem militar, pelo menos não com a mesma eficácia. O que podemos fazer é dizer às empresas, ou pelo menos orientá-las, a fazer o que queremos. Muitos de nossos investidores nos disseram que esse método é muito mais eficiente do que a intervenção direta do governo, mas só o tempo dirá."
 URG_ask_companies_to_invest_slightly_in_the_industry:0 "Pedir às empresas que invistam um pouco na indústria"
 URG_ask_companies_to_invest_heavily_in_the_industry:0 "Pedir às empresas que invistam pesado na indústria"
 URG_ask_companies_to_invest_slightly_in_the_military:0 "Pedir às empresas que invistam um pouco nas forças armadas"
 URG_ask_companies_to_invest_heavily_in_the_military:0 "Pedir às empresas que invistam pesado nas forças armadas"
 URG_ask_companies_to_invest_dockyard_expansion:0 "Pedir às empresas que invistam na expansão dos estaleiros"
 URG_ask_companies_to_invest_in_the_infrastructure:0 "Pedir às empresas que invistam na infraestrutura"
 URG_march_to_argentina_capital:0 "Marchar sobre Buenos Aires"
 URG_march_to_argentina_capital_desc:0 "Buenos Aires é o coração do país, é o que mantém a nação à tona. Se conseguirmos capturá-la em pouco tempo, os argentinos ficarão arrasados e a vitória estará garantida."
 URG_capture_buenos_aires:0 "Capturar Buenos Aires"
 URG_capture_buenos_aires_desc:0 "A capital está à vista! Uma boa ofensiva e ela estará sob nosso controle em pouco tempo."
 URG_work_with_the_PCU:0 "Concessões ao PCU"
 URG_work_with_the_PCU_desc:0 "Emilio Frugoni tem muita história com o PCU. Antigo integrante do Partido Socialista, o partido se dividiu em dois após a Revolução de Outubro na União Soviética, já que a postura de Frugoni sempre foi a de um reformismo pacífico, contrário a revoluções sangrentas, algo com que a maioria dos seus antigos companheiros de partido discordava. Essa maioria queria que o PSU se juntasse à recém-formada Internacional Comunista e ajudasse a libertar os trabalhadores. Tudo isso levou à divisão do partido em 1920, com Frugoni e seus seguidores sendo expulsos do novo Partido Comunista. \n\nMas, apesar de tudo isso, ambos os partidos compartilham um objetivo semelhante e, com a recente crise política no Uruguai após o sangrento derrubamento de Gabriel Terra, Frugoni pode fazer concessões aos comunistas para criar uma coalizão que estabilize sua posição instável como presidente."
 URG_undermine_berres:0 "Minar o presidente Berres"
 URG_undermine_berres_desc:0 "Apesar de ter governado a nação por pouco tempo, o apoio a Batlle Berres dentro e fora do partido continua crescendo, deixando seus opositores políticos paranoicos. \n\nNo entanto, um de seus opositores políticos, Andrés Martínez Trueba, vê uma oportunidade de ganhar poder para si mesmo, colocando os outros opositores uns contra os outros e contra Batlle."
 URG_support_berres:0 "Apoiar o presidente Berres"
 URG_support_berres_desc:0 "Tendo vencido recentemente a eleição extraordinária, Batlle Berres já causou uma ótima impressão tanto nas massas quanto nos membros do seu partido, chegando a criar sua própria corrente política baseada no batllismo, chamada neobatllismo. \n\nMas, apesar de tudo isso, ainda há políticos empenhados em dificultar sua presidência, sentindo-se ameaçados por seu poder e apoio crescentes. No entanto, graças às suas conexões dentro e fora do partido, Batlle foi alertado sobre a situação, e só lhe resta agir contra seus adversários."
 URG_extraordinary_elections_tt:0 "Realizaremos eleições em §Y30§! dias\n\n"
 URG_consequences_tt:0 "§RPode haver consequências inesperadas ao tomar esta decisão!§!"


 CHL_purchasing_foreign_planes:0 "Comprando aviões estrangeiros"
 CHL_purchasing_foreign_planes_desc:0 "Há muitas grandes potências com aviões muito modernos, e esses são aviões que gostaríamos muito de ter em nosso arsenal. Com aeronaves de tão alta qualidade à nossa disposição, nossos inimigos tremerão de medo!"
