 PAN_american_political_intervention:0 "Intervenção Política Americana"
 PAN_american_political_intervention_desc:0 "Os Estados Unidos há muito exercem significativa influência sobre o cenário político do Panamá. Por meio de vários meios, incluindo ajuda econômica, apoio militar e pressão diplomática, os EUA buscam moldar o governo e as políticas panamenhas para alinhá-los a seus próprios interesses. Essa intervenção frequentemente encontra resistência entre cidadãos e líderes panamenhos que procuram afirmar a soberania e independência de seu país."
 PAN_overarching_american_shadow:0 "A Sombra Americana Abrangente"
 PAN_overarching_american_shadow_desc:0 "Apesar do resultado positivo de nossas negociações com os Estados Unidos sobre sua intervenção em nossos assuntos políticos, é claro que sua influência continuará pairando sobre nossa nação."
 PAN_ongoing_talks_with_the_united_states:0 "Negociações em Curso com os Estados Unidos"
 PAN_ongoing_talks_with_the_united_states_desc:0 "As negociações com [USA.GetName] foram iniciadas por [ROOT.GetLeader] na tentativa de reduzir a influência dos Estados Unidos na política panamenha. O objetivo dessas conversas é estabelecer uma relação mais igualitária e respeitosa entre os dois países.\n\nO resultado dessas negociações depende dos nossos £PAN_panama_flag  §YPontos de Soberania§! ao seu término:\n - §G90§! £PAN_panama_flag  §YPontos de Soberania§! ou §GMais§!: Os Estados Unidos concordam em reduzir totalmente sua intervenção na política panamenha.\n - §G60§! £PAN_panama_flag  §YPontos de Soberania§! ou §GMais§!: Os Estados Unidos concordam em reduzir moderadamente sua intervenção na política panamenha.\n - §RAbaixo§! de §G60§! £PAN_panama_flag  §YPontos de Soberania§!: Os Estados Unidos recusam reduzir sua intervenção na política panamenha."
 PAN_outcome_of_the_treaty:0 "Resultado do Tratado"
 PAN_sovereignty_points_counter_val_tt:0 "[?PAN.PAN_sovereignty_points|0H]"
 PAN_sovereignty_points_counter_text_tt:0 "Este contador mostra a quantidade atual de £PAN_panama_flag  §YPontos de Soberania§! acumulados durante as negociações em curso com [USA.GetName].\n\nEsses pontos determinarão o resultado das negociações e o nível de intervenção que os Estados Unidos terão na política panamenha."
