 VEN_democratic_revolution:0 "Revolução democrática"
 VEN_democratic_revolution_desc:0 "Em 1901, a Venezuela passou pelo que ficou conhecido como a Revolução Libertadora, uma revolução dirigida contra o então presidente Cipriano Castro. Essa revolução fracassou, o que levou às 3 décadas seguintes sob o comando do ditador Juan Vicente Gómez. Não surpreende que tal derrota tenha deixado a população liberal irritada e frustrada, ansiosa por aproveitar a oportunidade de outro presidente não administrar bem o país. Se não mantivermos o país sob controle, uma segunda revolução pode muito bem ocorrer."
 VEN_impending_democratic_revolution:0 "Iminente revolução democrática"
 VEN_political_crisis:0 "Crise política"
 VEN_gloria_al_bravo_pueblo_cat:0 "'Gloria al Bravo Pueblo'"
 VEN_gloria_al_bravo_pueblo_cat_desc:0 "Glória ao povo da Venezuela, que lutou longa e arduamente para manter e fazer crescer o país que temos hoje. Não podemos decepcionar o nosso povo, e devemos fazer o que for preciso para estabilizar a nossa política interna e administrar adequadamente o país, para que possamos ter um país ainda mais forte e próspero!"
