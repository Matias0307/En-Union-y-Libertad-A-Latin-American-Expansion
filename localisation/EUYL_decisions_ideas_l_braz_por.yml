 PAR_guarani_communications:0 "Comunicações confidenciais em guarani"
 PAR_guarani_communications_desc:0 "Quando o conflito do Chaco começou, a Ordem n.º 51 do general José Félix Estigarribia estabeleceu o guarani como língua militar, determinando que as comunicações e os códigos secretos fossem feitos exclusivamente nesse idioma. O guarani ajuda os paraguaios a se identificarem entre si, evita casos de fogo amigo e até ajudará em comunicações sensíveis."
 PAR_create_guion_rojo_template_tt:0 "Cria o modelo §YGuión Rojo§!, composto por §G5§! batalhões de §YInfantaria§! e §G1§! batalhão de §YArtilharia§!, junto com uma §GCompanhia de engenheiros§! e §GArtilharia de apoio§!"
