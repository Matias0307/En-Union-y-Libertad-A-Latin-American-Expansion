 HON_administrating_the_democracy:0 "Administrando a Democracia"
 HON_administrating_the_democracy_desc:0 "Com o fim do regime autoritário de Tiburcio Carías Andino, Honduras está agora em transição para uma democracia. Este novo sistema político permitirá maior participação e representação do povo no governo, promovendo uma sociedade mais inclusiva e equitativa. No entanto, também exigirá administração cuidadosa para garantir que o processo democrático seja preservado e que os direitos e liberdades de todos os cidadãos sejam protegidos."
