 PRU_unlock_cooperate_with_church:0 "Desbloqueia as decisões de §YCooperar com a Igreja§!, que permitirão §Gmelhorar§! vários setores da sua nação."
 PRU_cooperating_with_the_church:0 "Cooperando com a Igreja"
 PRU_cooperating_with_the_church_desc:0 "O cristianismo e a religião como um todo sempre tiveram grande influência na história e na cultura peruanas. Trazido pelos conquistadores originais há séculos, o impacto do cristianismo ainda é muito forte no país, e a Igreja tem uma quantidade significativa de poder na nação. Podemos usar esse poder em nosso benefício e concordar em cooperar com a igreja."
