 URG_purchasing_british_ships_desc:0 "Graças à nossa nova aliança com a Grã-Bretanha e a uma economia em crescimento, podemos nos dar ao luxo de comprar navios britânicos. A qualidade do navio determinará o seu custo e por quanto tempo teremos de pagar por ele. \n\nOs britânicos devem primeiro aceitar qualquer pedido de compra de um navio, e a IA britânica será influenciada pelos seguintes fatores: \n\n - §YO tamanho atual da Marinha deles§! \n\n - §YA opinião deles sobre nós§! \n\n - §YO quão pequena é atualmente a nossa Marinha§! \n\n - §YSe estão em guerra ou não§! \n\n - §YO nosso poder industrial atual§!"
