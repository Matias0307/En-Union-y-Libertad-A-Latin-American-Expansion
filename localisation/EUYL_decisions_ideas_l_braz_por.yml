 EUYL_latin_american_isolationism_desc:0 "Ao longo da história da América Latina, com várias exceções importantes, a grande maioria da nossa história e dos nossos conflitos permaneceu localizada em nossa região do mundo. Isso gerou uma mentalidade subconsciente de isolacionismo em nosso povo, que nos fez evitar o envolvimento em conflitos estrangeiros que não nos afetam diretamente. Essa mentalidade nos manteve a salvo na maior parte do tempo, mas, como o mundo desmorona ao nosso redor, precisamos ser extremamente cuidadosos com aquilo em que nos envolvemos."
