 COS_carmen_lyra_will_take_charge_of_the_revolution_tt:0 "§YCarmen Lyra§! assumirá o comando da §YRevolução§!\n\nComo §YCarmen Lyra§!, seu principal objetivo é divulgar a §YRevolução§! e ganhar o apoio da população. Você precisará alcançar §G100%§! de §YApoio à Revolução§! para derrubar o governo com sucesso e estabelecer um novo regime. Não chegar a §G100%§! a tempo resultará em uma §RGuerra Civil§!\n\n"
