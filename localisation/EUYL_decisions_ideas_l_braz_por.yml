 PAR_february_revolution:0 "A Revolução de Fevereiro"
 PAR_february_revolution_desc:0 "A Revolução de Fevereiro foi um golpe de Estado organizado pelos militares paraguaios com o objetivo de derrubar Eusebio Ayala e colocar Rafael Franco no poder.\n\nQuer isso cause consequências para nós no futuro ou não, devemos continuar de olho nos militares com cautela. Suas intenções ainda são bastante vagas, e não sabemos que motivos ocultos podem ter, se é que têm. Que Deus abençoe o Paraguai pelo que está por vir."
 PAR_the_february_revolution:0 "A Revolução"
 PAR_unlock_revolution_decisions_tt:0 "Desbloqueará várias §YDecisões§! relacionadas à §YRevolução de Fevereiro§!. Essas decisões permitirão que você §Gatrase§! a revolução e incline o §YEquilíbrio de poder§! para [PAR.GetLeader].\n\nSe feito corretamente, a §YRevolução§! será forçada a §Gser cancelada§! e a §CDemocracia§! prevalecerá!"
