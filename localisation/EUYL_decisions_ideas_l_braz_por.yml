 ECU_gallos_looming_coup:0 "O Golpe latente de Gallo"
 ECU_gallos_looming_coup_desc:0 "Apesar de não estar há muito tempo como presidente, [ROOT.GetLeader] nos mostrou que não é um líder confiável para o Equador e que pode causar problemas se considerarmos suas relações amistosas com as potências fascistas. Por isso e pela má gestão nacional em geral, os militares decidiram intervir e colocar §YAlberto Enríquez Gallo§! no poder para garantir que Páez não consiga o que quer e ganhe mais 4 anos de presidência."
 ECU_pro_conservative_navy:0 "Marinha pró-conservadora"
 ECU_pro_conservative_navy_desc:0 "Muitos setores da marinha equatoriana continuam leais aos conservadores, com rumores de perseguições a liberais que ocorrem de vez em quando dentro da marinha. Por isso, os liberais veem isso como uma ameaça ao seu partido e protestarão caso o governo se alinhe aos conservadores."
