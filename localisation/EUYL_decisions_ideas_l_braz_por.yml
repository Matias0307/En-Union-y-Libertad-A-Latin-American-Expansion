 ##Venezuela##
 VEN_firm_believer_of_democracy:0 "Firme crente na democracia"
 VEN_military_officer:0 "Oficial militar"
 VEN_transition_to_democracy:0 "Transição para a democracia"
 VEN_transition_to_democracy_desc:0 "Eleazar López Contreras sempre foi um firme crente na liberdade de expressão e nos ideais de liberdade e democracia, e quer replicar isso em seu país. Após mais de 3 décadas de ditadura brutal, ele fará tudo o que estiver em seu poder para ir transformando aos poucos seu país em um estado livre e democrático."
 VEN_democracy_trait_tt:0 "Enquanto este espírito nacional estiver ativo, §Y[ROOT.GetLeader]§! terá a característica §YFirme crente na democracia§!"
 VEN_periodic_protests_will_occur_tt:0 "§RProtestos§! periódicos ocorrerão em todo o país!"
 VEN_abrupt_government_transition:0 "Transição abrupta de governo"
 VEN_abrupt_government_transition_desc:0 "Juan Vicente Gómez, o antigo governante e ditador da Venezuela, faleceu há poucos dias, e em seu lugar Eleazar López Contreras assumiu o poder. Vicente foi ditador da Venezuela por mais de 3 décadas, e agora, com a mudança repentina de líder e de governo, as pessoas estão muito inseguras sobre a estabilidade do próprio país e muitos não confiam no novo governante. [ROOT.GetLeader] terá de provar que é capaz de governar o país como deve e de realizar as reformas necessárias para levar esta nação adiante!"
 VEN_dependent_on_oil_extraction:0 "Dependente da extração de petróleo"
 VEN_dependent_on_oil_extraction_desc:0 "Diferentemente das economias de nossos países vizinhos na América Latina, conseguimos lidar com a Grande Depressão de forma rápida e eficiente. No entanto, isso nos tornou mais dependentes da nossa produção de petróleo, o que não permitiu que outros setores da indústria se desenvolvessem adequadamente."
 VEN_underground_communist_movement:0 "Movimento comunista clandestino"
 VEN_underground_communist_movement_desc:0 "Sob a reforma mais recente da constituição, os partidos Comunista e Anarquista são considerados 'contrários à independência deste país' e, portanto, ilegais. Por isso, muitos militantes e simpatizantes comunistas passaram a trabalhar na clandestinidade, sob os olhos do governo. Precisamos desconfiar das ações deles e tentar impedir que tentem qualquer coisa que possa desestabilizar o país."
 VEN_possibility_of_worker_strikes_occuring_tt:0 "§RGreves de trabalhadores§! de vários setores da §YIndústria§! podem ocorrer aleatoriamente enquanto este espírito nacional estiver ativo!"
 VEN_german_infleunce_in_venezuela:0 "Influência alemã na Venezuela"
 VEN_german_infleunce_in_venezuela_desc:0 "Desde 1933, nazistas clandestinos estão presentes na Venezuela, tentando aumentar a influência alemã no país e garantir o comércio de petróleo conosco."
 VEN_america_and_allied_nations_will_become_concerned_tt:0 "\n§RManter este espírito nacional por tempo demais fará os Estados Unidos e outras potências aliadas se preocuparem com uma possível potência do Eixo ameaçando seu petróleo, e isso poderá escalar para uma intervenção armada se não for tratado adequadamente.§!"
 VEN_inefficient_oil_extraction_1:0 "Extração de petróleo ineficiente"
 VEN_inefficient_oil_extraction_2:0 "Extração de petróleo ineficiente"
 VEN_inefficient_oil_extraction_3:0 "Extração de petróleo ineficiente"
 VEN_advanced_oil_extraction:0 "Extração de petróleo avançada"
 VEN_inefficient_oil_extraction_desc_tt:0 "\n§LA tecnologia disponível para extrair o petróleo deste estado simplesmente não basta para extrair todo o potencial petrolífero dele. Portanto, estamos limitados quanto ao petróleo que podemos extrair e vender.§!"
 VEN_looming_oil_strike_cat:0 "Iminente greve petroleira"
 VEN_looming_oil_strike_cat_desc:0 "Os trabalhadores petroleiros estão insatisfeitos com as condições de trabalho e os baixos salários, e é provável que essa insatisfação se transforme em descontentamento total, levando a uma possível greve no futuro. Não atender às suas exigências poderia resultar em uma revolução em grande escala se não for tratado adequadamente."
 VEN_civil_war_government_counter_text_tt:0 "Em caso de guerra civil, §Y[VEN.GetName]§! começaria atualmente com [?VEN.VEN_civil_war_government_counter_val|+0] §HDivisões§!, se a Guerra Civil começasse agora.\n"
