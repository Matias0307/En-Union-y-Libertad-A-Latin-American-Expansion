 CEA_managing_the_banana_republic_desc:0 "As Repúblicas das Bananas da América Central são conhecidas por suas extensas plantações de banana e pelo monopólio americano sobre esses países. Embora isso tenha trazido muito dinheiro, também trouxe muitos problemas. Os trabalhadores estão insatisfeitos, a terra está sendo sobreutilizada e a economia está em ruínas. É hora de resolver isso. [ROOT.GetDebtPayment]"
