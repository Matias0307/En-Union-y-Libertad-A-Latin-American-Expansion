 BRA_patrianovism_on_the_rise:0 "O patrianovismo em ascensão"
 BRA_patrianovism_on_the_rise_desc:0 "Desde a abolição do Império em 1889, houve muitas tentativas fracassadas de restaurar a monarquia, como a Guerra de Canudos ou a Revolta de Ribeirãozinho. No entanto, todas essas tentativas fracassaram e foram rapidamente esmagadas, e ainda assim há muitos brasileiros que ainda anseiam pelo retorno da monarquia e pela restauração do Império. Os Patrianovistas, liderados por Arlindo Veiga dos Santos, oferecem uma nova abordagem do Império, mais autoritária e que acredita firmemente na igualdade de direitos entre brasileiros negros e brancos. Os Patrianovistas oferecem uma nova esperança de restaurar a monarquia para aqueles que ainda têm saudade dos dias imperiais, e com um esforço conjunto podemos seguir em frente e tornar isso realidade. \n\nSerá difícil e teremos muitos obstáculos pela frente, mas seguiremos em frente, seja qual for o caminho que tomarmos!"
