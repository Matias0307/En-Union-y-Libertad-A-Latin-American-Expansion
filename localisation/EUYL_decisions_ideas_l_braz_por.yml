 cupula_militar_col:0 "Alto Comando Militar"
 reintegrar_cobo:0 "Reintegrar Vásquez Cobo"
 col_rebelion_rojas_pinilla:0 "A rebelião de Rojas Pinilla"
 col_rebelion_rojas_pinilla_desc:0 "A instabilidade e a crise institucional do governo laureanista parecem ter levado a Colômbia ao limite. A oposição, liderada por Rojas Pinilla, ganhou uma força perigosa e chegou a um ponto sem volta. Se quisermos evitar outra guerra civil, não temos escolha a não ser ceder às suas exigências..."

 gestionar_bipartidismo_col:0 "Administrar os conflitos bipartidários"
 gestionar_bipartidismo_col_tt:0 "A operação vai começar, mas o sucesso não é garantido."
 bipartidismo_10_tt:0 "\n§RSe a operação falhar, você deverá esperar 10 dias para selecioná-la novamente.§!\n"
 bipartidismo_20_tt:0 "\n§RSe a operação falhar, você deverá esperar 20 dias para selecioná-la novamente.§!\n"
 gestionar_bipartidismo_col_desc:0 "A Colômbia passou por uma longa tradição de violência política entre os partidos liberal e conservador. Nas últimas décadas, o país sofreu um período particularmente violento, deixando a população cansada e sem esperança. Nesse contexto, está claro que o governo é o único que poderia fazer algo a respeito."
 gestionar_bipartidismo_la:0 "Integrar os políticos liberais em Magdalena"
 gestionar_bipartidismo_la_desc:0 "A administração regional excluiu os políticos liberais dos cargos para os quais foram eleitos. Com a pressão presidencial, os liberais finalmente poderão obter os empregos que merecem."
 gestionar_bipartidismo_ant:0 "Eliminar a imprensa subversiva em Antioquia"
 gestionar_bipartidismo_ant_desc:0 "Grupos conservadores estão distribuindo jornais que incitam a violência contra seus opositores políticos. É hora de impedir a circulação desse tipo de imprensa."
 gestionar_bipartidismo_nar:0 "Desmantelar a polícia conservadora em Nariño"
 gestionar_bipartidismo_nar_desc:0 "Latifundiários conservadores financiam milícias privadas encarregadas de eliminar qualquer sinal de liberalismo na região. Esses círculos paramilitares devem ser desmantelados imediatamente."
 gestionar_bipartidismo_cun:0 "Eliminar os favoritos da capital"
 gestionar_bipartidismo_cun_desc:0 "Os comércios liberais de Bogotá se recusaram firmemente a negociar com simpatizantes conservadores. Ao motivá-los, a capital poderá se desenvolver política e economicamente."
 gestionar_bipartidismo_met:0 "Proteger os líderes liberais de Meta"
 gestionar_bipartidismo_met_desc:0 "Os caudilhos liberais são atacados constantemente em Meta, e alguns são até assassinados. Devemos posicionar uma pequena guarda para a defesa deles."
 gestionar_bipartidismo_caq:0 "Prender os extremistas conservadores de Caquetá"
 gestionar_bipartidismo_caq_desc:0 "As sociedades conservadoras do sul do país estão semeando terror na população com suas ameaças. Está claro que não podemos negociar com elas. Uma operação rápida e precisa bastará para prender seus líderes e processá-los por seus atos."
 
 oposicion_politica_col:0 "Oposição política interna"
 oposicion_politica_col_map_name:0 "Ações para eliminar a oposição"
 oposicion_politica_col_desc:0 "A severa tensão política não apenas dividiu a Colômbia socialmente, mas também organicamente. De um lado estão o [GetLiberalName] e o [GetConservativeName], os partidos tradicionais que disputam o poder e frequentemente se recriminam. De outro, está o [GetMilitaryName], cuja liderança é formada por dirigentes politizados que poderiam estar insatisfeitos com a administração dos partidos. \n\nCada grupo aumenta continuamente sua §YInfluência subversiva§!, o que poderia causar uma guerra civil caso chegue a §R100§!. \n\n[GetRuilingLeader] \n[GetConservativeValues] [GetLiberalValues] [GetMilitaryValues]"
