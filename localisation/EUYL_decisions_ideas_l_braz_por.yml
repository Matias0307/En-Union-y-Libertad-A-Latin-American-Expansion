 PBC_winner_of_war_of_independence:0 "Vencemos a nossa Guerra de Independência"
 PBC_unlock_escalate_tt:0 "Desbloqueia §YIntensificar ainda mais a guerra§!, que §Gfortalecerá§! o espírito nacional §YNossa Guerra de Independência§!"
 PBC_war_of_independence_d:0 "Nossa Guerra de Independência"
 PBC_war_of_independence_d_desc:0 "Esses bastardos não nos permitirão ser independentes sem lutar, então garantiremos que lhes daremos luta. Não será fácil, pois temos muitos inimigos contra nós. Por mais sombria que a situação pareça, vamos superá-la e derrotar essas criaturas vis!"
