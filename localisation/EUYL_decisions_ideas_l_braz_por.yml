 COS_looming_communist_revolution_desc:0 "Após descobrir atividades bastante suspeitas vindas do Partido Comunista da Costa Rica, ficou claro que eles planejam uma revolução em larga escala para derrubar nosso governo. Com o apoio de Carmen Lyra e seus seguidores, eles conseguiram ganhar considerável força entre a classe trabalhadora e as comunidades marginalizadas. É imperativo que ajamos rapidamente para impedir que essa revolução aconteça, pois ela levaria ao caos e à instabilidade em nossa nação."
