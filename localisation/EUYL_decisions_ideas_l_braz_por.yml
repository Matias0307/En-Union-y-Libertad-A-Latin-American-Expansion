 PRU_impending_navy_rebellion:0 "Rebelião naval iminente"
 PRU_impending_navy_rebellion_desc:0 "Setores da nossa Marinha estão planejando um golpe contra o nosso governo porque demos poder demais ao Exército. Eles exigem que reduzamos o poder concedido ao exército, ou haverá graves consequências."
 PRU_impending_army_rebellion:0 "Rebelião do Exército iminente"
 PRU_impending_army_rebellion_desc:0 "Setores do nosso Exército estão planejando um golpe contra o nosso governo porque demos poder demais à Marinha. Eles exigem que reduzamos o poder concedido à marinha, ou haverá graves consequências."
