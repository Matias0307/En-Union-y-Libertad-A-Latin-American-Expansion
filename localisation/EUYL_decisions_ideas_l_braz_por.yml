 col_terrain_bonus:0 "Planos geográficos"
 col_terrain_bonus_desc:0 "A vitória não está apenas nas armas ou nos homens, mas também no terreno. Estudar a natureza em detalhes é uma vantagem crucial na hora da batalha."
 supply_bonus:0 "Estudar as linhas de suprimento"
 plan_bonus:0 "Estudar os planos de batalha"
 terreno_bonus:0 "Estudar o terreno"
