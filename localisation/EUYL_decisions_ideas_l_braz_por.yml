 BOL_toro_will_begin_scheme:0 "Toro §ROcupará§! periodicamente vários estados da nossa nação"
 BOL_state_taken_by_toro:0 "§RUm dos nossos estados foi tomado!§!"
 BOL_dealing_with_toros_schemes:0 "Lidando com as tramas de Toro"
 BOL_dealing_with_toros_schemes_desc:0 "Toro não ficou satisfeito com o fato de Germán assumir o poder total sobre a nação e decidiu sair em fúria pelo país, reunindo seus apoiadores leais numa tentativa de derrubar Germán. \n\nEle já tomou o controle de um dos nossos estados e planeja tomar muitos mais até que o detenhamos por completo! \n\nAtualmente, Toro controla §R[?BOL_number_of_states_controlled_by_toro|R0]§! estado(s)! \n\n§RSe mais de 4 estados forem controlados por Toro, ele lançará um golpe!"
 BOL_states_control_toro:0 "Número de estados controlados pela Toro é menor que §Y5§!"
 BOL_toro_planning_to_control_FROM:0 "Toro planeja tomar o controle de [FROM.GetName]"
 BOL_retake_control_of_FROM:0 "Retomar o controle de [FROM.GetName]"
 BOL_try_to_slow_down_toro:0 "Tentar frear Toro"
 BOL_coup_being_planned_by_toro:0 "Toro está planejando um golpe"
 BOL_coup_being_planned_by_toro_desc:0 "Toro decidiu começar a planejar um golpe depois de tomar o controle da maioria dos nossos estados. Precisamos detê-lo!"
 BOL_toro_rebellious:0 "Toro está se rebelando"
 BOL_decisions_toro_cheaper:0 "As decisões de §YRecuperar estados§! ficarão §Gmais baratas§! e levarão §Gmenos tempo§!"
 BOL_toro_controls_no_states:0 "Toro controla um estado ou menos"
 BOL_getting_our_sweet_revenge:0 "Tendo nossa doce vingança"
 BOL_getting_our_sweet_revenge_desc:0 "Há décadas vimos perdendo aos poucos nosso território para todos os nossos vizinhos, arrancando pedaços da nossa nação e humilhando o povo boliviano. Tudo isso vai mudar: toda nação que tenha posto sequer um dedo em nosso país pagará com seu sangue e seus homens enquanto a humilhamos exatamente como fizeram conosco. Não seremos mais conhecidos como o fraco da América do Sul!"
 BOL_make_FROM_pay_for_taking_our_land:0 "Fazer [FROM.GetName] pagar por tomar nossas terras"
 BOL_build_up_the_province_of_FROM:0 "Desenvolver a província de [FROM.GetName]"
 BOL_integrate_the_province_of_FROM:0 "Integrar a província de [FROM.GetName]"
 BOL_foreign_arms_purchasing:0 "Comprando armamentos estrangeiros"
 BOL_foreign_arms_purchasing_desc:0 "As potências estrangeiras têm armamento muito moderno, e adquiri-lo nos dará vantagem em qualquer conflito em que possamos nos envolver."
 BOL_tejadas_incompetence:0 "A incompetência de Tejada"
 BOL_tejadas_incompetence_desc:0 "Muitos consideram Tejada um líder incompetente, que não está apto a liderar a Bolívia, especialmente em seu estado atual. Precisamos provar que o povo está errado e ajudar Tejada a se tornar o líder que todos querem ver!"
