 CHL_march_to_argentina_capital:0 "Marchar sobre Buenos Aires"
 CHL_march_to_argentina_capital_desc:0 "Buenos Aires é o coração do país, é o que mantém a nação à tona. Se conseguirmos capturá-la em pouco tempo, os argentinos ficarão arrasados e a vitória estará garantida."
 CHL_capture_buenos_aires:0 "Capturar Buenos Aires"
 CHL_capture_buenos_aires_desc:0 "A capital está à vista! Uma boa ofensiva e ela estará sob nosso controle em pouco tempo."
 
 form_rioplatense_empire_category:0 "Concretizar as ambições rio-platenses"
 form_rioplatense_empire_category_desc:0 "Com a vontade de unir todo o povo rio-platense sob um único país, assim faremos. Todos os rio-platenses serão unidos e enfrentaremos juntos qualquer ameaça."
 form_rioplatense_empire:0 "Formar o Império Rio-Platense"

 form_natural_borders:0 "Nossas fronteiras naturais"
 form_natural_borders_desc:0 "Ao longo de toda a nossa história, nossos vizinhos abusaram da nossa posição bastante central na América do Sul e, pouco a pouco, tomaram pedaços das nossas terras, mas isso não durará mais, pois eles verão o nosso verdadeiro poder e tremerão de medo quando alcançarmos nosso verdadeiro potencial!"
 BOL_our_natural_borders:0 "Restaurar nossas fronteiras legítimas"

 EUYL_prospect_for_resources:0 "Prospectar recursos na América Latina"
 EUYL_prospect_for_resources_desc:0 "Há muitos recursos no continente latino-americano, e devemos garantir que os exploremos ao máximo. Esses recursos podem ser usados em benefício próprio ou para comerciar no mercado global."
