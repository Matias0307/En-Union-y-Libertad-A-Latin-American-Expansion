 PRU_invite_others_tt:0 "Se você for §YLíder de uma Facção§!, desbloqueará decisões que permitem §GConvidar§! outros países que tenham apoio §YComunista§! suficiente"
 PRU_porque_of_promise_civil_war_tt:0 "\n§RDevido às nossas promessas de paz que fizemos com os social-democratas depois de nos unificarmos com eles, seguir um caminho expansionista fará com que eles se revoltem e uma Guerra Civil ocorrerá!§!"
