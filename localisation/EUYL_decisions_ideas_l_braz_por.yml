 ECU_la_gloriosa:0 "La Gloriosa"
 ECU_la_gloriosa_desc:0 "Apesar de sua presidência bastante curta, o impacto que Velasco teve sobre os equatorianos foi simplesmente enorme. Caso ocorra algum infortúnio no país, é quase certo que Velasco aproveitará a oportunidade e tentará tomar o poder por meio de um golpe de Estado ou de uma revolução em grande escala."
 ECU_if_stability_or_lose_war_with_peru_tt:0 "\n§RSe a§! §YEstabilidade§! §Rcair abaixo de 10% ou você perder a guerra contra §Y[PRU.GetName]§!§R, Velasco exigirá o controle da nação!§! \n\n§RNão permitir que ele assuma o controle desencadeará uma guerra civil!§!"
 ECU_siding_too_much_with_liberals_will_cause_conservative_insurrection_tt:0 "\n§RAlinhar-se demais com os§! £ECU_liberal_texticon §YLiberais§! §Rresultará em uma§! £ECU_conservative_texticon §YInsurreição§! §Rconservadora.§!\n\nIsso pode ser §GEvitado§! se você §YMelhorar§! as relações com os £ECU_conservative_texticon §YConservadores§!, mas não exagere, pois isso também pode causar uma £ECU_liberal_texticon §YInsurreição§! §Rliberal.§!"
 ECU_aftermath_of_4_day_civil_war:0 "Consequências da guerra civil de 4 dias"
 ECU_aftermath_of_4_day_civil_war_desc:0 "Após a renúncia repentina de Isidro Ayora, foram convocadas eleições imediatas para escolher o próximo líder o mais rápido possível. As eleições foram realizadas em 1932 e Neptalí Bonifaz venceu. No entanto, essa vitória foi anulada quando o Congresso equatoriano o impediu de assumir o poder por causa de suas raízes peruanas. Por isso, milícias pró-conservadoras pegaram em armas na capital e lutaram para protestar contra o impedimento de sua presidência. Os liberais responderam com fogo, e o resultado foi uma sangrenta guerra civil que custou a vida de mais de 2000 equatorianos. Embora tenham se passado quase 4 anos desde então, os sangrentos acontecimentos continuam vivos na mente de ambos os lados, e alinhar-se demais com qualquer um deles terá consequências."
 ECU_rural_state:0 "Estado rural"
 ECU_rural_state_desc:0 "Este estado é composto em sua maioria por população rural, com pouquíssimos equatorianos vivendo em ambiente urbanizado."
 ECU_economic_reignition:0 "Reativação econômica"
 ECU_economic_reignition_desc:0 "A economia equatoriana foi muito afetada pela Grande Depressão, principalmente em cinco macrovariáveis distintas: comércio exterior, receitas do governo, reservas de ouro, inflação e PIB. Devido à rejeição do padrão-ouro imposto pela missão Kemmerer, a economia equatoriana sofreu com instabilidade e inconversibilidade. Também não ajuda que a maioria dos equatorianos viva em áreas rurais, o que dificulta a industrialização."
 ECU_economic_reignition_cat:0 "Reativando a economia"
 ECU_economic_reignition_cat_desc:0 "A economia equatoriana tem enfrentado dificuldades ultimamente, principalmente devido à Grande Depressão e à rejeição do padrão-ouro. Várias mudanças precisarão ser feitas para reativar a economia!"
 ECU_liberal_conservative_conflict:0 "Conflito liberal-conservador"
 ECU_liberal_conservative_conflict_desc:0 "A política equatoriana sempre foi definida por um feroz cabo de guerra entre liberais e conservadores. Essa divisão só piorou após a guerra civil de 4 dias de 1932, fazendo com que os £ECU_conservative_texticon §YConservadores§! fossem antagonizados desde então. Essa divisão pode se intensificar se não mantivermos os partidos sob controle, e uma insurreição pode ocorrer se não tivermos cuidado. \n\nNosso §YLíder§! atual representa [ROOT.GetLeaderParty]"
 ECU_rural_provinces_tt:0 "Províncias §Yrurais§!"
