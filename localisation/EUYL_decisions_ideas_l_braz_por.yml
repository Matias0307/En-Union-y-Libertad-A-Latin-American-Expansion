 PRU_army_navy_rivalry:0 "Rivalidade Exército-Marinha"
 PRU_army_navy_rivalry_desc:0 "Muitos setores do nosso exército têm ligações com o fascismo, enquanto muitos setores da nossa marinha têm ligações democráticas. Quanto mais fortes os alemães ficam, mais fascistas surgem no exército, e conforme isso acontece muitos de nossos comandantes e oficiais navais se voltam ainda mais para a democracia e os ideais ocidentais, o que causa não só uma divisão entre o exército e a marinha, mas também uma divisão ideológica entre os dois ramos das forças armadas. Essa enorme divisão está partindo nossa nação ao meio e, por causa disso, ambos competem continuamente para ter o maior domínio nas forças armadas. Se um obtiver poder demais, o outro pode fomentar uma rebelião.\n\nO sentimento ideológico atual do §YExército§! é: [ROOT.GetIdeologyArmy] \n\nO sentimento ideológico atual da §YMarinha§! é: [ROOT.GetIdeologyNavy] \n\n§RSe o seu exército e a sua marinha coincidirem ideologicamente, e nenhum dos dois estiver se rebelando, este sistema e este espírito nacional serão removidos junto com as penalidades.§!"
