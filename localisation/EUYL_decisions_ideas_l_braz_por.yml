 COS_conservative_coffee_oligarchy_support:0 "Apoio da Oligarquia Cafeeira Conservadora"
 COS_conservative_coffee_oligarchy_support_desc:0 "A oligarquia cafeeira conservadora há muito tempo é uma força poderosa na política costarriquenha, exercendo grande influência sobre o governo e a economia. Seu apoio é crucial para contribuir com a economia costarriquenha. No entanto, sua influência também pode levar a políticas que priorizam seus interesses em detrimento dos da população em geral, gerando tensão e potencial para distúrbios."
