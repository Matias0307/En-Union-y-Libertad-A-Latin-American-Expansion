 PRU_civil_war:0 "A Guerra Civil Peruana"
 PRU_civil_war_desc:0 "Nosso país mergulhou em uma guerra civil. O número de mortos aumenta em ambos os lados e nossa nação desmorona sobre si mesma. Se não conseguirmos encerrar esta guerra civil rapidamente, haverá graves consequências no futuro."
 PRU_focus_on_attack:0 "Concentrar-se no ataque"
 PRU_focus_on_defense:0 "Concentrar-se na defesa"
 PRU_aftermath_of_coup:0 "Recuperando-se do golpe"
 PRU_aftermath_of_coup_desc:0 "Após o golpe e a tomada do país, nosso país ficou em frangalhos e um longo processo de reconstrução nos aguarda."
 PRU_recover_from_coup:0 "Recuperando-se do golpe"
