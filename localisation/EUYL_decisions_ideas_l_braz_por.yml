 col_pugna_religiosa:0 "Ingerência religiosa"
 col_pugna_religiosa_desc:2 "Embora a constituição de 1886 tenha estabelecido um Estado unitário e confessional, as reformas liberais dos últimos anos reduziram consideravelmente a participação da Igreja. Como resultado, estourou um acalorado debate entre os homens de Estado e os diferentes §Ygrupos religiosos§! que buscam impor seus ideais nas decisões do governo. \n\nOs £col_cat §YCatólicos§! afetam a §Gestabilidade§! e o §Gganho de poder político§!.\nOs £col_crist §YCristãos§! afetam a §Gestabilidade§! e a §Gprodução das fábricas§!.\nOs £col_athe §YAteus§! afetam o §Gganho de poder político§! e a §Gprodução das fábricas§!.\n\n§ROs status político dos diferentes grupos religiosos pode afetar a oposição política interna.§!"

 col_ui_status_header:0 "Status político"
 COL_STATUS_TOOLTIP:0 "O §Ystatus político§! determina o quão presentes os grupos religiosos estão na administração pública.\n\nOs grupos §Gdominantes§! e §Ginfluentes§! concedem bônus em seus respectivos aspectos, enquanto os grupos §Rexcluídos§! concedem penalidades e os §gimparciais§! não oferecem bônus nem penalidades.\n\nOs grupos religiosos podem exigir maior participação, o que afetará seu status e o de outros grupos."
