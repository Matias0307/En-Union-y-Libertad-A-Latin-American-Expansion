 PRU_gain_2_generals:0 "Você §Gganhará§! §Y2§! novos generais"
 PRU_army_rebellious:0 "\n§RTrabalhar com um estado democrático fará os fascistas restantes do Exército se rebelarem contra você, e levará um tempo para trazê-los de volta ao seu controle total. Se você trabalhou com um estado fascista com o Exército, receberá uma versão pior do Exército rebelde, e custará mais tempo e recursos para se livrar dele.§!\n"
 PRU_fascist_army_rebellion:0 "\n§RSeguir pelo caminho democrático fará os fascistas do exército se rebelarem. Essa rebelião só piorará se você cooperou com um estado fascista. \nA marinha também se rebelará se você cooperar com um estado fascista§!. \n\n§GNada disso acontecerá se você tornar o exército democrático.§!"
 PRU_rebellious_democrats:0 "\n§RTrabalhar com um estado fascista fará os democratas restantes da Marinha se rebelarem contra você, e levará um tempo para trazê-los de volta ao seu controle total. Se você trabalhou com um estado democrático com o Exército, receberá uma versão pior da Marinha rebelde, e custará mais tempo e recursos para se livrar dela.§!\n"
 PRU_rebelling_of_navy:0 "\n§RTrabalhar com um estado fascista fará os democratas restantes da Marinha se rebelarem contra você, e levará um tempo para trazê-los de volta ao seu controle total. Se você trabalhou com um estado democrático com a Marinha, receberá uma versão pior da Marinha rebelde, e custará mais tempo e recursos para se livrar dela.§!\n"
 PRU_rebellious_army_fascist:0 "\n§RTrabalhar com um estado democrático fará os fascistas restantes do Exército se rebelarem contra você, e levará um tempo para trazê-los de volta ao seu controle total. Se você trabalhou com um estado democrático com a Marinha, receberá uma versão pior do Exército rebelde, e custará mais tempo e recursos para se livrar dele.§!\n"
