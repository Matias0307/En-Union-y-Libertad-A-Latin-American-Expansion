 COS_permanent_revolution_goes_against_the_views_of_manuel_mora_tt:0 "\n\n§RA Revolução Permanente vai contra as ideias de Manuel Mora§!\n\nManuel Mora foi um forte defensor de uma abordagem mais gradual e democrática para alcançar o socialismo, em vez de uma revolução repentina e violenta. Ele acreditava em trabalhar dentro do sistema político existente para promover mudanças, em vez de derrubá-lo por completo. Portanto, a ideia de revolução permanente, que exige ação revolucionária contínua e imediata, provavelmente estaria em desacordo com as crenças e estratégias de Manuel Mora para alcançar a mudança social na Costa Rica. Isso causará os seguintes §YEfeitos§!:\n\n"
 COS_has_formed_USC_UNIFIED_tt:0 "Formou §Y$USC_UNIFIED$§!"
 COS_capturing_capitals_increases_global_compliance_by_5_tt:0 "Capturar as §YCapitais§! de §Y[361.GetName]§!, §Y[126.GetName]§!, §Y[219.GetName]§! e §Y[282.GetName]§! aumentará a §YConformidade§! global em todos os seus §YEstados Não Núcleo§! em §G5%§! a cada vez, até um máximo de §G20%§!"
 COS_the_reichskommissariat:0 "O Reichskommissariat"
 COS_the_reichskommissariat_desc:0 "Após a ascensão do NSDAP/AO na Costa Rica e a subsequente tomada da administração costarriquenha, o país foi reorganizado como um Reichskommissariat. Essa nova estrutura administrativa foi concebida para facilitar a implementação das políticas e da ideologia nazistas em todo o país, com foco na promoção da cultura e dos valores alemães. O Reichskommissariat será responsável por supervisionar todos os aspectos da sociedade costarriquenha, incluindo educação, mídia e forças de segurança, a fim de garantir que o país permaneça alinhado aos objetivos do Terceiro Reich."
 COS_third_reich_will_seize_our_assets_periodically_to_fuel_the_german_war_machine_tt:0 "\n\n§ROs Terceiro Reich confiscará periodicamente nossos ativos para abastecer a máquina de guerra alemã§!"
 COS_the_reichskommissariat_dec_cat:0 "O Reichskommissariat"
 COS_the_reichskommissariat_dec_cat_desc:0 "Após a ascensão do NSDAP/AO na Costa Rica e a subsequente tomada da administração costarriquenha, o país foi reorganizado como um Reichskommissariat. Essa nova estrutura administrativa foi concebida para facilitar a implementação das políticas e da ideologia nazistas em todo o país, com foco na promoção da cultura e dos valores alemães. O Reichskommissariat será responsável por supervisionar todos os aspectos da sociedade costarriquenha, incluindo educação, mídia e forças de segurança, a fim de garantir que o país permaneça alinhado aos objetivos do Terceiro Reich.\n\nLimite atual de §GBônus§! do §YReichskommissariat§!: §G[?COS.COS_reichskommissariat_upper_limit|%G0]§!\n\nLimite atual de §RPenalidade§! do §YReichskommissariat§!: §R[?COS.COS_reichskommissariat_lower_limit|%R0]§!\n\nAos olhos do Terceiro Reich, atualmente somos [COS.GetReliability] para a causa.\n\nA §YConfiabilidade§! pode ser obtida §YCapitulando§! nações inimigas, §YConfiscar as Reservas de Ouro§! e §YConfiscando Ativos Estrangeiros§! de nações inimigas. \n\n§RTome cuidado: se sua confiabilidade cair demais, o Terceiro Reich confiscará nossos ativos e nos anexará.§!"
