 totalitarianism:0 "Totalitarismo"
 totalitarianism_desc:0 "O totalitarismo é um sistema de governo centralizado e ditatorial que exige total subserviência ao Estado."
 totalitarian_monarchism:0 "Monarquismo absoluto"
 totalitarian_monarchism_desc:0 "O monarquismo absoluto é uma forma de monarquismo em que o monarca absorve todo o poder de todos os aspectos da nação, seja do estado, de empresas privadas, do exército etc. O monarca ou imperador tem o poder de controlar tudo. O monarca ou imperador tem voz direta em todos os aspectos do país."
 democratic_monarchism:0 "Monarquismo constitucional"
 democratic_monarchism_desc:0 "O monarquismo constitucional é uma forma de monarquismo em que o monarca compartilha o poder com um governo organizado constitucionalmente."
 
 integralism:0 "Integralismo"
 integralism_desc:0 "Integralismo é o princípio de que a fé católica deve ser a base do direito público e das políticas públicas na sociedade civil, onde quer que a preponderância de católicos nessa sociedade torne isso possível."
 tenentism:0 "Tenentismo"
 tenentism_desc:0 "O Tenentismo foi uma filosofia política de oficiais subalternos do Exército que contribuíram significativamente para a Revolução Brasileira de 1930."
 peronism_ideology:0 "Justicialismo"
 peronism_ideology_noun:0 "Justicialistas"
 peronism_ideology_desc:0 "Um movimento político argentino fortemente inspirado no fascismo italiano, bem como em uma vaga mistura de nacionalismo e populismo. Caracterizado como uma ideologia de terceira posição, o que significa que rejeita tanto o capitalismo quanto o comunismo."
