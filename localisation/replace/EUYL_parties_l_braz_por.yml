 integralismo:0 "Integralismo"
 integralism_desc:0 "O integralismo é o princípio de que a fé católica deve ser a base do direito público e da política pública dentro da sociedade civil, onde quer que a preponderância dos católicos dentro dessa sociedade o torne possível."
 tenentismo:0 "Tenentismo"
 tenentism_desc:0 "O tenentismo foi uma filosofia política de oficiais subalternos do exército que contribuíram significativamente para a Revolução Brasileira de 1930."
 peronism_ideology:0 "Justicialismo"
 peronism_ideology_noun:0 "Justicialistas"
 peronism_ideology_desc:0 "Um movimento político argentino fortemente inspirado no fascismo italiano, bem como uma vaga mistura de nacionalismo e populismo. Caracterizado como uma ideologia de terceira posição, o que significa que rejeita tanto o capitalismo quanto o comunismo."
 military_socialism:0 "Socialismo Militar Boliviano"
 military_socialism_desc:0 "Assumindo o poder após o Golpe de Estado de 1936 na Bolívia, a Junta Civil-Militar assumiu o controle da nação. O Socialismo Militar Boliviano é uma mistura de socialismo e miliciano, misturando-se em políticas econômicas socialistas e políticas militaristas. A Junta quebrou o controle incontestável do poder do liberal e iniciou uma nova era na política boliviana até seu fim."
 ARG_peronist_party:0 "Partido Justicialista"
 ARG_peronist_party_long:0 "Partido Justicialista"
 ARG_CNU_party:0 "CNU"
 ARG_CNU_party_long:0 "Coalición de Nacionalistas Unidos"
 ARG_TNM_party:0 "MNT"
 ARG_TNM_party_long:0 "Movimiento Nacionalista Tacuara"
 teocracia:0 "Teocracia"
 theocracy_desc:0 "A teocracia é uma forma de governo em que uma divindade de algum tipo é reconhecida como a autoridade governante suprema, dando orientação divina aos intermediários humanos que administram os assuntos do dia-a-dia do governo."
 social_democracy:0 "Social-democracia"
 social_democracy_desc:0 "A social-democracia é uma filosofia política, social e econômica dentro da tradição socialista. Como uma ideologia econômica e regime político, é descrita pelos acadêmicos como advogando por intervenções econômicas e sociais para promover a justiça social dentro da estrutura de uma política liberal- política democrática e uma economia mista de orientação capitalista".
 BRA_estado_novo:0 "Estado Novo"
 BRA_estado_novo_long:0 "Estado Novo"
 monarquismo:0 "Monarquismo"
 monarchism_desc:0 "Monarquismo é a defesa do sistema de monarquia ou governo monárquico. Um monarquista é um indivíduo que apóia esta forma de governo independente de qualquer monarca específico, enquanto aquele que apóia um monarca em particular é um monarquista."
