 moderatism_desc:0 "Moderatismo é uma forma de governo que evita os extremismos de esquerda e direita tomando uma posição ou curso de ação moderados." # [LocEditor:AwaitingBatchUpdate]
 centrism:0 "Centrismo" # [LocEditor:AwaitingBatchUpdate]
