 military_socialism:0 "Socialismo Militar Boliviano"
 military_socialism_desc:0 "Assumindo o poder após o Golpe de Estado de 1936 na Bolívia, a Junta Civil-Militar assumiu o controle da nação. O Socialismo Militar Boliviano é uma mistura de socialismo e militarismo, combinando políticas econômicas socialistas e políticas militaristas. A Junta rompeu o domínio incontestado dos Liberais no poder e iniciou uma nova era na política boliviana até seu fim."
 theocracy:0 "Teocracia"
 theocracy_desc:0 "Teocracia é uma forma de governo na qual uma divindade de algum tipo é reconhecida como a autoridade suprema, fornecendo orientação divina a intermediários humanos que administram os assuntos cotidianos do governo."
 social_democracy:0 "Social-democracia"
 social_democracy_desc:0 "A social-democracia é uma filosofia política, social e econômica dentro da tradição socialista. Como ideologia econômica e regime político, é descrita por acadêmicos como defensora de intervenções econômicas e sociais para promover a justiça social dentro da estrutura de uma política liberal-democrática e de uma economia mista de orientação capitalista."
 BRA_estado_novo:0 "Estado Novo"
 BRA_estado_novo_long:0 "Estado Novo"
 monarchism:0 "Monarquismo"
 monarchism_desc:0 "Monarquismo é a defesa do sistema de monarquia ou governo monárquico. Um monarquista é um indivíduo que apoia essa forma de governo independentemente de qualquer monarca específico, enquanto aquele que apoia um monarca em particular é um monarquista."
 BRA_soc_dem:0 "PSB"
 BRA_soc_dem_long:0 "Partido Socialista Brasileiro"
 posadism:0 "Posadismo"
 posadism_desc:0 "O posadismo, uma ideologia de nicho, é um ramo do trotskismo criado por Juan Posadas, combinando os fundamentos dos princípios de Trotsky com o fascínio pela exploração espacial e o potencial contato com vida alienígena, nos ajudando muito e levando nossa tecnologia a patamares nunca antes vistos."
 fascism_by_name:0 "Fascismo Apenas de Nome"
 fascism_by_name_desc:0 "Este líder simpatiza com os ideais fascistas, mas não pratica ativamente o fascismo como ideologia."
 fascistic_militarism:0 "Militarismo Fascista"
 fascistic_militarism_desc:0 "Este líder não é um apoiador do fascismo, porém seus ideais e práticas assemelham-se aos de uma ditadura fascista."
 syndicalism:0 "Sindicalismo"
 syndicalism_desc:0 "O sindicalismo é uma corrente revolucionária dentro do movimento trabalhista que busca sindicalizar os trabalhadores de acordo com o setor e promover suas reivindicações por meio de greves, com o objetivo final de obter o controle dos meios de produção e da economia em geral."
 PRU_democratic_party_2:0 "PSP"
 PRU_democratic_party_2_long:0 "Partido Social Democrata"
 ECU_fascism_party:0 "CONDOR"
 ECU_fascism_party_long:0 "Companhias Organizadas Nacionais de Ofensivas Revolucionárias"
 anti_imperialism:0 "Anti-imperialismo"
 anti_imperialism_desc:0 "Anti-imperalismo é o profundo ressentimento contra a ideia e/ou prática de conquistar terras estrangeiras para o próprio bem e realização de um país, enquanto escraviza a população nativa e sofre maus-tratos."

 anarcho_capitalism:0 "Anarco-Capitalismo"
 anarcho_capitalism_desc:0 "Os anarcocapitalistas se opõem ao Estado e procuram privatizar qualquer serviço útil que o governo fornece atualmente, como educação, infraestrutura ou aplicação da lei. Eles vêem o capitalismo e o "mercado livre" como a base para um mundo livre e sociedade próspera."

