 integralism:0 "Integralism"
 integralism_desc:0 "Integralism is the principle that the Catholic faith should be the basis of public law and public policy within civil society, wherever the preponderance of Catholics within that society makes this possible."
 tenentism:0 "Tenentism"
 tenentism_desc:0 "Tenentism was a political philosophy of junior army officers who significantly contributed to the Brazilian Revolution of 1930."
 peronism_ideology:0 "Justicialismo"
 peronism_ideology_noun:0 "Justicialistas"
 peronism_ideology_desc:0 "An Argentine political movement heavily inspired on Italian Fascism as well as a vague blend of Nationalism and Populism. Characterized as a third position ideology, meaning it rejects both Capitalism and Communism."
 ARG_peronist_party:0 "Partido Justicialista"
 ARG_peronist_party_long:0 "Partido Justicialista"
 ARG_CNU_party:0 "CNU"
 ARG_CNU_party_long:0 "Coalición de Nacionalistas Unidos"
 ARG_TNM_party:0 "TNM"
 ARG_TNM_party_long:0 "Tacuara Nationalist Movement"
 military_socialism:0 "Bolivian Military Socialism"
 military_socialism_desc:0 "Taking power after the 1936 Coup d'etat in Bolivia, the Civil-Military Junta took control of the nation. Bolivian Military Socialism is a mix of socialism and miltiarism, blending in socialist economic policies and militarist political policies. The Junta broke down the Liberal's unchallanged grip of power and began a new era in Bolivian politics up until its demise."
 theocracy:0 "Theocracy"
 theocracy_desc:0 "Theocracy is a form of government in which a deity of some type is recognized as the supreme ruling authority, giving divine guidance to human intermediaries that manage the day-to-day affairs of the government."
 social_democracy:0 "Social Democracy"
 social_democracy_desc:0 "Social democracy is a political, social, and economic philosophy within the socialist tradition. As an economic ideology and policy regime, it is described by academics as advocating economic and social interventions to promote social justice within the framework of a liberal-democratic polity and a capitalist-oriented mixed economy."
 BRA_estado_novo:0 "Estado Novo"
 BRA_estado_novo_long:0 "Estado Novo"
 monarchism:0 "Monarchism"
 monarchism_desc:0 "Monarchism is the advocacy of the system of monarchy or monarchical rule. A monarchist is an individual who supports this form of government independent of any specific monarch, whereas one who supports a particular monarch is a royalist."
 BRA_soc_dem:0 "PSB"
 BRA_soc_dem_long:0 "Partido Socialista Brasileiro"
 posadism:0 "Posadism"
 posadism_desc:0 "Posadism, a rather niche ideology, is a branch of trotskyism created by Juan Posadas combining the foundations of Trotsky's principles intertwined with the fascination of space exploration and the potential contact of alien life, greatly helping us and advancing our technology to heights never before seen."
 fascism_by_name:0 "Fascism by Name Alone"
 fascism_by_name_desc:0 "This leader sympathizes with Fascist ideals, but does not actively practice Fascism as an ideology."
 fascistic_militarism:0 "Fascistic Militarism"
 fascistic_militarism_desc:0 "This leader is not a supporter of Fascism, however his ideals and practices akin to those of a fascist dictatorship."
 syndicalism:0 "Syndicalism"
 syndicalism_desc:0 "Syndicalism is a revolutionary current within the labor movement that seeks to unionize workers according to industry and advance their demands through strikes with the eventual goal of gaining control over the means of production and the economy at large."
 PRU_democratic_party_2:0 "PSP"
 PRU_democratic_party_2_long:0 "Partido Social Demócrata"
 ECU_fascism_party:0 "CONDOR"
 ECU_fascism_party_long:0 "Compañías Organizadas Nacionales de Ofensivas Revolucionarias"
 anti_imperialism:0 "Anti-Imperialism"
 anti_imperialism_desc:0 "Anti-Imperalism is the deep resentment towards the idea and/or practice of conquering foreing land for a country's own sake and fulfillment whilst enslaving the native population and being mistreated."
 
 totalitarianism:0 "Totalitarianism"
 totalitarianism_desc:0 "Totalitarianism is a system of government that is centralized and dictatorial and requires complete subservience to the state."
 totalitarian_monarchism:0 "Absolute Monarchism"
 totalitarian_monarchism_desc:0 "Absolute Monarchism is a form of Monarchism where the Monarch absorbs all power from every aspect of the nation, be it state, private enterprises, army, etc. The Monarch or Emperor has direct say in every aspect of the country."

