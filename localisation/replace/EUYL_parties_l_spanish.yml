 military_socialism:0 "Socialismo Militar Boliviano"
 military_socialism_desc:0 "Tomando el poder después del Golpe de Estado de 1936 en Bolivia, la Junta Cívico-Militar tomó el control de la nación. El Socialismo Militar Boliviano es una mezcla de socialismo y miltiarismo, mezclando políticas económicas socialistas y políticas políticas militaristas. La Junta rompió el dominio inalterable de los liberales en el poder e inició una nueva era en la política boliviana hasta su desaparición".
 theocracy:0 "Teocracia"
 theocracy_desc:0 "La teocracia es una forma de gobierno en la que se reconoce a una deidad de algún tipo como autoridad gobernante suprema, que da orientación divina a intermediarios humanos que gestionan los asuntos cotidianos del gobierno."
 teocracia:0 "Teocracia"
 theocracy_desc:0 "La teocracia es una forma de gobierno en la que se reconoce a una deidad como la autoridad suprema, brindando guía divina a los intermediarios humanos que gestionan los asuntos cotidianos del gobierno."
 social_democracia:0 "Socialdemocracia"
 social_democracia_desc:0 "La socialdemocracia es una filosofía política, social y económica dentro de la tradición socialista. Como ideología económica y régimen político, los académicos la describen como una defensa de las intervenciones económicas y sociales para promover la justicia social en el marco de una política liberal-democrática y una economía mixta de orientación capitalista." BRA_estado_novo:0 "Estado Novo"
 BRA_estado_novo_long:0 "Estado Novo"
 monarchism:0 "Monarquismo"
 monarchism_desc:0 "El monarquismo es la defensa del sistema de monarquía o gobierno monárquico. Un monárquico es quien apoya esta forma de gobierno independientemente de cualquier monarca específico, mientras que quien apoya a un monarca en  particular es un realista."
 BRA_soc_dem:0 "PSB"
 BRA_soc_dem_long:0 "Partido Socialista Brasileiro"
 posadism:0 "Posadismo"
 posadism_desc:0 "El posadismo, una ideología bastante específica, es una rama del trotskismo creada por Juan Posadas que combina los fundamentos de los principios de Trotsky con la fascinación por la exploración espacial y el posible contacto con vida extraterrestre, lo que nos ayuda enormemente y lleva nuestra tecnología a niveles nunca antes vistos." fascism_by_name:0 "Fascismo solo por nombre"
 fascism_by_name_desc:0 "Este líder simpatiza con los ideales fascistas, pero no practica activamente el fascismo como ideología."
 fascistic_militarism:0 "Militarismo fascista"
 fascistic_militarism_desc:0 "Este líder no es partidario del fascismo; sin embargo, sus ideales y prácticas son similares a los de una dictadura fascista."
 syndicalism:0 "Sindicalismo"
 syndicalism_desc:0 "El sindicalismo es una corriente revolucionaria dentro del movimiento obrero que busca sindicalizar a los trabajadores por industria y promover sus demandas mediante huelgas con el objetivo final de obtener el control de los medios de producción y de la economía en general." PRU_democratic_party_2:0 "PSP"
 PRU_democratic_party_2_long:0 "Partido Social Demócrata"
 ECU_fascism_party:0 "CONDOR"
 ECU_fascism_party_long:0 "Compañías Organizadas Nacionales de Ofensivas Revolucionarias"
 anti_imperialism:0 "Antiimperialismo"
 anti_imperialism_desc:0 "El antiimperalismo es el profundo resentimiento hacia la idea y/o práctica de conquistar territorios extranjeros para el propio beneficio y bienestar de un país, mientras se esclaviza y maltrata a la población nativa."
 integralism:0 "Integralismo"
 integralism_desc:0 "El integralismo es el principio según el cual la fe católica debe ser la base del derecho público y las políticas públicas en la sociedad civil, dondequiera que la preponderancia de católicos en dicha sociedad lo haga posible."
 tenentism:0 "Tenentismo"
 tenentism_desc:0 "El tenentismo fue una filosofía política de oficiales subalternos del ejército que contribuyeron significativamente a la Revolución Brasileña de 1930."
 totalitarianism:0 "Totalitarismo"
 totalitarianism_desc:0 "El totalitarismo es un sistema de gobierno centralizado y dictatorial que exige una completa sumisión al Estado." totalitarian_monarchism:0 "Monarquismo Absoluto"
 totalitarian_monarchism_desc:0 "El Monarquismo Absoluto es una forma de Monarquismo donde el Monarca absorbe todo el poder de todos los ámbitos de la nación, ya sea el Estado, las empresas privadas, el ejército, etc. El Monarca o Emperador tiene voz y voto directo en todos los aspectos del país."
