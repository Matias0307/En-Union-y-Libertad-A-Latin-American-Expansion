l_spanish:
 oligarchism:0 "Oligárquico"
 oligarchism_desc:0 "La oligarquía es una forma de gobierno en la que un grupo de personas ostentan un poder absoluto."
 moderatism:0 "Moderantismo" # [LocEditor:AwaitingBatchUpdate]
 moderatism_desc:0 "El moderantismo es una forma de gobierno que evita la izquierda y derecha extremas adoptando una posición o medidas moderadas." # [LocEditor:AwaitingBatchUpdate]
 centrism:0 "Centrismo" # [LocEditor:AwaitingBatchUpdate]
 centrism_desc:0 "El centrismo es una forma de gobierno que busca aplicar soluciones de sentido común que resuelven necesidades actuales y futuras, además de reforzar la confianza pública y servir al bien común teniendo en cuenta el riesgo y la capacidad en el contexto de dichas necesidades." # [LocEditor:AwaitingBatchUpdate]
 federalism:0 "Federalismo"
 federalism_desc:0 "El federalismo es un modo de gobierno mixto o compuesto que combina un gobierno general con gobiernos regionales en un solo sistema político".
