 COS_crackdown_on_fascism:0 "Mano Dura contra el Fascismo"
 COS_crackdown_on_fascism_desc:0 "Se ha vuelto evidente que el fascismo es una amenaza creciente para nuestra nación. Para proteger los derechos y libertades de nuestros ciudadanos, debemos adoptar una postura firme contra las ideologías y organizaciones fascistas. Esta ofensiva implicará mayor vigilancia, arrestos y deportaciones de quienes promuevan el fascismo, así como campañas de educación pública para concientizar sobre los peligros de esta ideología."
