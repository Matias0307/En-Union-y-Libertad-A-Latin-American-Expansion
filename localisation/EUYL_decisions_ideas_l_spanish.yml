 COL_confederation_war1:0 "Tanto [PRU.GetFlag]§YPerú§! como [BOL.GetFlag]§YBolivia§! fueron liberados conjuntamente por el general Bolívar, pero sus discrepancias impidieron la oportunidad real de consolidarse como una nación unificada.\n\nSi logramos evocar el sentimiento de sedición, quizás podamos aprovecharlo y restaurar la antigua §YConfederación Perú-Boliviana§!."
 COL_confederation_war2:0 "Ahora que los insurgentes han triunfado y se ha proclamado la nueva [PRU.GetFlag]§YConfederación Perú-Boliviana§!, es nuestro momento de actuar. Debemos consolidar nuestra superioridad sobre ellos antes de que nos vean como una amenaza. \n\nPoder sobre la §YConfederación§!: [?COL.COL_poder_confederacion|+0]\n\n§R¡Si no es posible convertir a la Confederación Perú-Boliviana en un títere tras su reunificación, podrían ir a la guerra contra nosotros!§!\n"
 COL_confederation_war3:0 "Apoyados por [COL.GetFlag]§YColombia§!, partidarios fascistas que buscan reunificar la antigua §YConfederación Perú-Boliviana§! se han armado y planean una insurrección. Debemos preparar al ejército para el levantamiento antes de que sea demasiado tarde."

