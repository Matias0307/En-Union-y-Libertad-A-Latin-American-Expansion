 PRU_take_control_of_natives_tt:0 "Dejaremos de controlar el §YGobierno Peruano§! y en su lugar tomaremos el control de los §YNativos§! para iniciar nuestra guerra de independencia y, finalmente, la §YRestauración del Imperio Inca§!"
