 PRU_unlock_cooperate_with_church:0 "Desbloquea las decisiones de §YCooperar con la Iglesia§!, que te permitirán §Gmejorar§! varios sectores de tu nación."
 PRU_cooperating_with_the_church:0 "Cooperar con la Iglesia"
 PRU_cooperating_with_the_church_desc:0 "El cristianismo y la religión en general siempre han sido muy influyentes en la historia y la cultura peruanas. Traído por los conquistadores originales hace siglos, el impacto del cristianismo sigue siendo muy fuerte en el país y la Iglesia tiene una cantidad significativa de poder en la nación. Podemos usar ese poder en nuestro beneficio y aceptar cooperar con la iglesia."
 PRU_encourage_weekly_church_sessions:0 "Fomentar las sesiones semanales de la Iglesia"
 PRU_praise_the_crusaders:0 "Elogiar a los cruzados"
 PRU_inspire_young_soldiers_with_the_power_of_christ:0 "Inspirar a los jóvenes soldados con el poder de Cristo"
 PRU_ask_the_church_for_loans:0 "Pedir préstamos a la Iglesia"
 PRU_ask_for_laborers_from_church:0 "Pedir trabajadores a la Iglesia"
 PRU_working_with_church:0 "Está trabajando actualmente con la Iglesia y/o sus miembros"
 PRU_social_democracy_investment:0 "Fortalecer los lazos con las socialdemocracias"
 PRU_social_democracy_investment_desc:0 "Tras tomar diversas medidas para acercarnos a las socialdemocracias del mundo, y ahora que tenemos relaciones positivas muy sólidas con ellas, es hora de aprovechar estas buenas relaciones y ayudarnos mutuamente como equipo, ¡por un mundo mejor!"
