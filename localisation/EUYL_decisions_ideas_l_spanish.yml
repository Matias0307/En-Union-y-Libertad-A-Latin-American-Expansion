 cupula_militar_col:0 "Alto Mando Militar"
 reintegrar_cobo:0 "Reintegrar a Vásquez Cobo"
 col_rebelion_rojas_pinilla:0 "La rebelión de Rojas Pinilla"
 col_rebelion_rojas_pinilla_desc:0 "La inestabilidad y la crisis institucional del gobierno laureanista parecen haber llevado a Colombia al límite. La oposición, liderada por Rojas Pinilla, ha ganado una fuerza peligrosa y ha llegado a un punto sin retorno. Si queremos evitar otra guerra civil, no tenemos más remedio que ceder a sus exigencias..."

 gestionar_bipartidismo_col:0 "Gestionar los conflictos bipartidistas"
 gestionar_bipartidismo_col_tt:0 "La operación comenzará, pero el éxito no está garantizado."
 bipartidismo_10_tt:0 "\n§RSi la operación fracasa, deberás esperar 10 días para volver a seleccionarla.§!\n"
 bipartidismo_20_tt:0 "\n§RSi la operación fracasa, deberás esperar 20 días para volver a seleccionarla.§!\n"
 gestionar_bipartidismo_col_desc:0 "Colombia ha atravesado una larga tradición de violencia política entre los partidos liberal y conservador. Durante las últimas décadas, el país ha sufrido un período particularmente violento, que ha dejado a la población cansada y sin esperanza. En este contexto, está claro que el gobierno es el único que podría hacer algo al respecto."
 gestionar_bipartidismo_la:0 "Integrar a los políticos liberales en Magdalena"
 gestionar_bipartidismo_la_desc:0 "La administración regional ha excluido a los políticos liberales de los cargos para los que han sido elegidos. Con la presión presidencial, los liberales por fin podrán obtener los empleos que merecen."
 gestionar_bipartidismo_ant:0 "Eliminar la prensa subversiva en Antioquia"
 gestionar_bipartidismo_ant_desc:0 "Grupos conservadores distribuyen periódicos que incitan a la violencia contra sus opositores políticos. Es hora de detener la circulación de este tipo de prensa."
 gestionar_bipartidismo_nar:0 "Desmantelar la policía conservadora en Nariño"
 gestionar_bipartidismo_nar_desc:0 "Los terratenientes conservadores financian milicias privadas encargadas de eliminar cualquier rastro de liberalismo en la zona. Estos círculos paramilitares deben ser desmantelados de inmediato."
 gestionar_bipartidismo_cun:0 "Eliminar a los favoritos de la capital"
 gestionar_bipartidismo_cun_desc:0 "Los comercios liberales de Bogotá se han negado con firmeza a negociar con simpatizantes conservadores. Al motivarlos, la capital podrá desarrollarse política y económicamente."
 gestionar_bipartidismo_met:0 "Proteger a los líderes liberales del Meta"
 gestionar_bipartidismo_met_desc:0 "Los caudillos liberales son atacados constantemente en el Meta, y algunos incluso son asesinados. Deberíamos apostar una pequeña guardia para su defensa."
 gestionar_bipartidismo_caq:0 "Arrestar a los extremistas conservadores del Caquetá"
 gestionar_bipartidismo_caq_desc:0 "Las sociedades conservadoras del sur del país están sembrando terror en la población con sus amenazas. Está claro que no podemos negociar con ellas. Una operación rápida y precisa bastará para arrestar a sus líderes y procesarlos por sus actos."

 oposicion_politica_col:0 "Oposición política interna"
 oposicion_politica_col_map_name:0 "Acciones para eliminar la oposición"
 oposicion_politica_col_desc:0 "La severa tensión política no solo ha dividido a Colombia socialmente, sino también orgánicamente. Por un lado están el [GetLiberalName] y el [GetConservativeName], los partidos tradicionales que se disputan el poder y a menudo se reprochan mutuamente. Por otro, está el [GetMilitaryName], cuyo liderazgo está formado por dirigentes politizados que podrían estar insatisfechos con la administración de los partidos. \n\nCada grupo aumenta continuamente su §YInfluencia subversiva§!, lo que podría causar una guerra civil en caso de llegar a §R100§!. \n\n[GetRuilingLeader] \n[GetConservativeValues] [GetLiberalValues] [GetMilitaryValues]"
