 PRU_army_navy_rivalry:0 "Rivalidad Ejército-Armada"
 PRU_army_navy_rivalry_desc:0 "Muchos sectores de nuestro ejército tienen vínculos con el fascismo, mientras que muchos sectores de nuestra armada tienen vínculos democráticos. Cuanto más fuertes se vuelven los alemanes, más fascistas aparecen en el ejército, y a medida que eso ocurre muchos de nuestros comandantes y oficiales navales se inclinan aún más hacia la democracia y los ideales occidentales, lo que causa no solo una división entre nuestro ejército y nuestra armada, sino también una división ideológica entre ambas ramas de las fuerzas armadas. Esta enorme división está partiendo nuestra nación en dos y, por eso, ambas compiten continuamente por tener el mayor dominio sobre las fuerzas armadas. Si una obtiene demasiado poder, la otra podría fomentar una rebelión.\n\nEl sentir ideológico actual del §YEjército§! es: [ROOT.GetIdeologyArmy] \n\nEl sentir ideológico actual de la §YArmada§! es: [ROOT.GetIdeologyNavy] \n\n§RSi tu ejército y tu armada coinciden ideológicamente, y ninguno de los dos se está rebelando, este sistema y este espíritu nacional serán eliminados junto con las penalizaciones.§!"
 PRU_fascist_tt:0 "§OFascista§!"
