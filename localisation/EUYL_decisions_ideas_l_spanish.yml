 PRU_united_for_the_revolution:0 "Unidos por la Revolución"
 PRU_united_for_the_revolution_desc:0 "Desde el ascenso al poder de los recientes dictadores, su reinado de terror se ha sentido en todo el país, especialmente entre quienes simpatizan con los ideales del comunismo. Hemos sido oprimidos, maltratados y humillados por creer en lo que consideramos correcto para el país. Estos retorcidos degenerados de mente enferma pronto comprenderán el terrible error que han cometido, y nos aseguraremos de ondear la bandera roja en alto y con orgullo sobre sus cuerpos. ¡Viva la Revolución! \n\nApoyo actual a la £arg_marxist_texticon  §YRevolución§!: [?PRU_support_for_the_revolution|G0]/[?PRU_100|Y0]"
 PRU_adopting_an_expansionist_policy_will_cause_social_democrat_uprising_tt:0 "\n§R¡Adoptar una política expansionista traicionará nuestras promesas con el Partido Socialista, y los socialdemócratas se rebelarán contra nosotros!§!"
 PRU_government_persecutions_becomes_significantly_less_common_tt:0 "Las persecuciones del gobierno serán §GMucho menos comunes§!"
 PRU_depending_on_communist_support_tt:0 "Los efectos de esta decisión dependen de tu apoyo §YComunista§! actual: cuanto más §YComunista§! seas, más §Gfuertes§! serán estos efectos.\nDebido a nuestro apoyo §YComunista§! actual, estos son los efectos:"
 PRU_government_periodically_will_brutally_opress_us_tt:0 "\n§R¡El gobierno cazará periódicamente a nuestros partidarios y los perseguirá, reduciendo nuestro apoyo a la Revolución!§!"
