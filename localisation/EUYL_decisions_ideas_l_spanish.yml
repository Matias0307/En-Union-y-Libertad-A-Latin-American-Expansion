 ARG_POLITICAL_TENSION_TOOLTIP:0 "La §YTensión política§! representa la tensión actual en la esfera política argentina, e incluye los problemas, las protestas, las cuestiones políticas y mucho más. Ten mucho cuidado con esto, porque si dejas que la tensión suba demasiado, los §YMilitares§! pueden §RIntervenir§!. \nTen en cuenta también que cuanto mayor sea la §YTensión política§!, más §Rfrecuentes§! serán las §Yprotestas§! y, en general, será §Rmás difícil§! gestionar la nación."
 ARG_CORRUPTION_TOOLTIP:0 "El §YGrado de corrupción§! mide cuán corrupta es tu nación. Cuanto §Ymás alto§! sea el nivel, más §Ycorrupto§! es tu país, y viceversa. El grado de corrupción varía entre §G1§! y §R8§!. \n\nLa §YCorrupción§! también puede ser §Ga tu favor§! o §Ren tu contra§!. Cualquiera de las dos opciones tendrá ventajas y desventajas, así que ten cuidado con la opción que elijas."
