 ARG_1937_elections:0 "Las Elecciones de 1937"
 ARG_1937_elections_desc:0 "Nuestra agitación política aún no ha cesado y lo más probable es que no desaparezca durante mucho tiempo. Las tensiones entre los partidos aumentan y el espectro político en su conjunto se va volviendo, lenta pero seguramente, desagradable. Lo único que realmente podemos hacer es esperar que no se derrame sangre y que todo se resuelva pacíficamente.\n\n             ~~~~ §YVotos electorales previstos§! ~~~~ \n  £ucr_a_texticon §CUnión Cívica Radical Antipersonalista§!:  [?ARG_predicted_UCRA_electoral_votes|Y0]\n  £ucr_texticon §RUnión Cívica Radical§!:  [?ARG_predicted_UCR_electoral_votes|Y0]\n  £partido_socialista_texticon §OPartido Socialista§!:  [?ARG_predicted_PS_electoral_votes|Y0]\n\n§REl ganador se determinará según los§! §YVotos electorales§!§R. El partido con más votos electorales ganará las elecciones, sin importar la popularidad de dicho partido.§!"
 ARG_the_1937_elections:0 "Las Elecciones de 1937"
