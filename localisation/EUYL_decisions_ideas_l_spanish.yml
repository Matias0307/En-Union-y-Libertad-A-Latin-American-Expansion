 COS_looming_communist_revolution_desc:0 "Tras descubrir actividades bastante sospechosas provenientes del Partido Comunista de Costa Rica, ha quedado claro que planean una revolución a gran escala para derrocar a nuestro gobierno. Con el apoyo de Carmen Lyra y sus seguidores, han logrado ganar un apoyo considerable entre la clase trabajadora y las comunidades marginadas. Es imperativo que actuemos con rapidez para evitar que esta revolución se concrete, pues conduciría al caos y la inestabilidad en nuestra nación."
