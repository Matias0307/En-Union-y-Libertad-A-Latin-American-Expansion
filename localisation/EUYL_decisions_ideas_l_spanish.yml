 BRA_ui_opinion_header:0 "Opinión"
 BRA_OPINION_TOOLTIP:0 "La §YOpinión§! representa cómo ve un partido político de nuestra nación a nuestro régimen/gobierno actual. \n\nLos partidos §GAmistosos§! no se interpondrán en tu camino e incluso pueden ofrecer apoyo en diversas ocasiones. \n\nLos partidos §gNeutrales§! ni ayudarán ni interferirán. \n\nLos partidos §RHostiles§! se interpondrán activamente en tu camino e intentarán detener tus planes."
 BRA_ui_influence_header:0 "Influencia"
 BRA_INFLUENCE_TOOLTIP:0 "La §YInfluencia§! representa el poder actual que tiene un partido político sobre la nación y su gente. Cuanto mayor sea la influencia, más poderoso es dicho partido. \n\n§RMáximo 100, mínimo 0§!"
