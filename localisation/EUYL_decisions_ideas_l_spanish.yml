 EUYL_1936_status_quo:0 "Statu quo de 1936"
 EUYL_1936_status_quo_desc:0 "El statu quo de 1936 fue acordado por Perú y Ecuador tras la intervención de Washington. Sin embargo, esta paz temporal es muy frágil, ya que ambos bandos guardan importantes rencores contra el otro, y una guerra entre los dos es simplemente inevitable."
 EUYL_tension_will_increase_tt:0 "La §RTensión fronteriza§! §RAumentará§! en §Y1§! nivel"
 EUYL_peru_ecuador_rising_tensions:0 "Tensiones crecientes entre Perú y Ecuador"
 EUYL_peru_ecuador_rising_tensions_desc:0 "Perú y Ecuador han tenido una historia complicada entre sí. Fronteras sin resolver en la región de Pastaza han terminado en múltiples conflictos sangrientos que no condujeron a nada, y ahora no es diferente. Hubo un esfuerzo por sofocar las tensiones con una línea de statu quo propuesta, y aunque se acordó, no hay duda de que no durará. El tiempo dirá cómo se resuelve esta situación, pero hasta ahora no pinta nada bien."
