 EUYL_latin_american_isolationism:0 "Aislacionismo latinoamericano"
 EUYL_latin_american_isolationism_desc:0 "A lo largo de la historia de Latinoamérica, con varias excepciones importantes, la gran mayoría de nuestra historia y de nuestros conflictos se han mantenido localizados dentro de nuestra región del mundo. Esto ha generado una mentalidad subconsciente de aislacionismo en nuestro pueblo, que nos ha hecho evitar involucrarnos en conflictos extranjeros que no nos afectan directamente. Esta mentalidad nos ha mantenido a salvo en su mayor parte, pero como el mundo se desmorona a nuestro alrededor, debemos ser extremadamente cuidadosos con aquello en lo que nos involucramos."
