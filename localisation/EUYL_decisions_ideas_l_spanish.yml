 PRU_restabalizing_our_currency:0 "Reestabilizar nuestra moneda"
 PRU_restabalizing_our_currency_desc:0 "Ahora que hemos preparado el camino para lidiar con nuestros problemas económicos, podemos empezar a lidiar con nuestra débil moneda. Si jugamos bien nuestras cartas, esto no debería tomar mucho tiempo y podremos estabilizar por completo nuestra moneda y encaminarnos por el rumbo correcto. ¡Por un Perú poderoso!"
