 HON_memory_of_the_second_civil_war:0 "Memoria de la Segunda Guerra Civil"
 HON_memory_of_the_second_civil_war_desc:0 "La Segunda Guerra Civil Hondureña, también conocida como la 'Revolución Reivindicatoria', fue un conflicto interno entre el entonces presidente Rafael López Gutiérrez y el ejército constitucionalista, en un intento de evitar que el presidente tomara el control total del país y se volviera dictador. Hasta el día de hoy, sigue siendo el conflicto más sangriento y destructivo que Honduras ha enfrentado. En caso de que otro líder intente seguir los pasos de López Gutiérrez, el pueblo se levantará nuevamente para evitarlo."
 CEA_mal_de_panama:0 "Mal de Panamá"
 CEA_mal_de_panama_desc:0 "El Mal de Panamá, o Enfermedad de Panamá, es una enfermedad fúngica que afecta a las plantas de banano. Se ha estado propagando por toda Centroamérica y ha afectado las plantaciones bananeras de [ROOT.GetName]. Si no hacemos algo pronto, destruirá nuestra economía."
