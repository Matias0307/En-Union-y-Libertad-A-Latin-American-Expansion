 #### Bolivia ####
 
 
 BOL_create_2_guardia_nacional_units_tt:0 "Aparecerán §G2§! unidades de la §YGuardia Nacional§!"
 BOL_lead_to_civil_war:0 "\n§REste camino LLEVARÁ a una guerra civil, pero los efectos secundarios posteriores no serán tan graves.§!"
 BOL_avoid_civil_war:0 "\n§REste camino EVITARÁ una guerra civil, pero los efectos secundarios que recibiremos serán muy severos.§!"
 BOL_the_1936_coup_d_etat:0 "El Golpe de Estado de 1936"
 BOL_the_1936_coup_d_etat_desc:0 "Tras el catastrófico fracaso que fue la guerra del Chaco, muchos en el ejército han comenzado a perder la confianza en el gobierno y a volverse contra Sorzano. Los militares planean algo, y sea lo que sea, no puede ser nada bueno."
 BOL_civil_civil_war_divisions_counter_full_breakdown:0 "El Gobierno Boliviano comenzaría actualmente con [?BOL.BOL_civilian_army_divisions|+0] §HDivisiones§!, si la Guerra Civil empezara ahora.\n"
 BOL_civil_civil_war_divisions_counter_icon_value:0 "[?BOL.BOL_civilian_army_divisions|0H]"
 BOL_military_civil_war_divisions_counter_full_breakdown:0 "Las Fuerzas Armadas Bolivianas comenzarían actualmente con [?BOL.BOL_military_divisions|+0] §HDivisiones§!, si la Guerra Civil empezara ahora.\n"
 BOL_military_civil_war_divisions_counter_icon_value:0 "[?BOL.BOL_military_divisions|0H]"
 BOL_the_great_coup:0 "El Gran Golpe"
 BOL_the_great_coup_desc:0 "Los oficiales de nuestro Ejército están hartos de la inestabilidad política y de un gobierno fallido, y han decidido tomar el asunto en sus propias manos. Para bien o para mal, uno solo puede imaginar a dónde puede conducir este suceso."
 BOL_arrest_army_officers:0 "Arrestar a oficiales del Ejército"
 BOL_gain_the_trust_of_the_people:0 "Ganarse la confianza del pueblo"
 BOL_challenge_the_militarys_authority:0 "Desafiar la autoridad de los militares"
 BOL_conscript_a_militia_regiment_in_FROM:0 "Reclutar un regimiento de milicia en [FROM.GetName]"
 BOL_regaining_the_trust_of_the_people:0 "Recuperar la confianza del pueblo"
 BOL_regaining_the_trust_of_the_people_desc:0 "Nuestra población se ha enfurecido mucho con nuestro ejército y con el gobierno en su conjunto, sintiendo que los 'abandonamos', lo cual no es en absoluto el caso. Sin importar qué anuncio hagamos a nivel nacional, el pueblo simplemente no confiará en nosotros. Por eso haremos acciones en lugar de palabras, para recuperar la confianza del pueblo y hacerle ver que no somos los malos de este escenario."
 BOL_restructure_the_parliament:0 "Reestructurar el Parlamento"
 BOL_kickstart_our_economy:0 "Reactivar la economía"
