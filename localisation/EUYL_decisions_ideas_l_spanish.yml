 ECU_TENSION_ZERO_TT:0 "Para [PRU.GetFlag] §Y[PRU.GetName]§!:\n - No ocurrirá nada\n\nPara [ECU.GetFlag] §Y[ECU.GetName]§!:\n - Puede §YMarchar§! hacia §Y[1117.GetName]§!"
