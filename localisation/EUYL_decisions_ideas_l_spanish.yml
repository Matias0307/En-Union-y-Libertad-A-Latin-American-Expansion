 COL_form_nueva_granada_desc:0 "La República de Nueva Granada fue una república unitaria centralista formada principalmente por la actual Colombia y Panamá, con porciones menores de los actuales Costa Rica, Ecuador, Venezuela, Perú y Brasil, que existió de 1831 a 1858. El estado se creó tras la disolución de la Gran Colombia en 1830 mediante la secesión de Ecuador y Venezuela."
 form_nueva_granada_desc:0 "La República de Nueva Granada fue una república unitaria centralista formada principalmente por la actual Colombia y Panamá, con porciones menores de los actuales Costa Rica, Ecuador, Venezuela, Perú y Brasil, que existió de 1831 a 1858. El estado se creó tras la disolución de la Gran Colombia en 1830 mediante la secesión de Ecuador y Venezuela."
