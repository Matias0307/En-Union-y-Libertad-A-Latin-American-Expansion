 COS_max_effinger_administration:0 "Administración de Max Effinger"
 COS_max_effinger_administration_desc:0 "Recientemente encargado de administrar la entrada y salida de personas dentro de las fronteras de nuestra nación, Max Effinger se hará cargo tanto de promover la inmigración al país como de deportar a quienes consideremos 'indeseables'. Su afiliación política con la Alemania nazi también podría plantear dudas, pero esas son cuestiones pueriles que deben dejarse de lado."
