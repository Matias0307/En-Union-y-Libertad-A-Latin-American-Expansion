 COS_ccss:0 "CCSS"
 COS_ccss_desc:0 "La Caja Costarricense de Seguro Social (CCSS) es una institución gubernamental encargada de brindar servicios de seguridad social a los ciudadanos de Costa Rica. Fue establecida en 1941 y desde entonces se ha convertido en una parte vital del sistema de salud del país, ofreciendo atención médica, pensiones y otros beneficios sociales a sus afiliados. La CCSS se financia con aportes de empleadores, trabajadores y el gobierno, y desempeña un papel crucial para garantizar el bienestar de la población costarricense."
