 PBC_maneging_the_confederation_desc:0 "Siendo nuestra nación muy nueva, todavía es muy inestable. Nuestra nación necesita ser reorganizada y rápido si queremos conservar nuestra soberanía. Nuestro primer y más importante objetivo es nombrar varios ministerios para organizar adecuadamente nuestra nueva nación."
