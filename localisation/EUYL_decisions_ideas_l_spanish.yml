 HON_re_election_of_tiburicio:0 "Re-Elección de Tiburcio"
 HON_re_election_of_tiburicio_desc:0 "Tiburcio Carías Andino ha estado en el poder por mucho tiempo, y muchos empiezan a cuestionar su liderazgo. Si bien ha logrado mantener el control del país, existen quienes creen que debería renunciar y permitir que un nuevo liderazgo tome el mando. Sin embargo, él no está dispuesto a hacerlo y hará lo que sea necesario para permanecer en el poder, llegando incluso a cambiar la constitución para permitir su re-elección mediante la asamblea constituyente."
 
