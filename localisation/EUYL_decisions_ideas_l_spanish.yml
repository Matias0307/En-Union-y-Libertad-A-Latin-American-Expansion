 PBC_nationalism_rising:0 "Nacionalismo en ascenso"
 PBC_nationalism_rising_desc:0 "Con nuestra guerra de independencia ya superada, muchos en nuestra recién formada unión están descontentos con ella y aún conservan sentimientos nacionalistas hacia sus países originales. Estos nacionalistas ya han acumulado una enorme popularidad en toda la nación y, si no los mantenemos bajo control, nuestra soberanía se pondrá seriamente en duda. \n\nCantidad de estados que controlan los £BOL_bolivia_flag  §YNacionalistas bolivianos§!: §R[?PBC_BOL_states_controlled_by_nationalists|R0]§! \n\nCantidad de estados que controlan los £PRU_peru_flag  §YNacionalistas peruanos§!: §R[?PBC_PRU_states_controlled_by_nationalists|R0]§! \n\n\n§RSi cualquiera de los bandos controla al menos§! §Yla mitad§!§R de sus respectivos estados, ¡ese bando lanzará un levantamiento!§!"
 PBC_nationalism_rising_in_bolivia:0 "Nacionalismo en ascenso en £BOL_bolivia_flag  Bolivia"
 PBC_nationalism_rising_in_peru:0 "Nacionalismo en ascenso en £PRU_peru_flag  Perú"
 PBC_retake_control_of_FROM:0 "Recuperar el control de [FROM.GetName]"
