 CHL_so_long_as_this_national_spirit_is_active_a_balance_of_power_between_nacistas_and_communists_will_exist_tt:0 "\n\n§RMientras este espíritu nacional esté activo, existirá un equilibrio de poder entre§! §YNacistas§! §Ry§! §YComunistas§! §R§!§R§!§R.§!"
 CHL_political_instability_desc:0 "Con la creciente popularidad de un partido de extrema derecha conocido como los Nacistas, y un creciente sentimiento comunista debido a las dificultades económicas enfrentadas por muchos chilenos, el panorama político de Chile se vuelve cada vez más inestable. El gobierno debe navegar este delicado equilibrio de poder entre ambas facciones, mientras también aborda los problemas que han llevado a su auge."
