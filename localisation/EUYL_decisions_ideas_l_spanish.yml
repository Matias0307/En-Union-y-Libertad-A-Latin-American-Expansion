 PAR_guarani_communications:0 "Comunicaciones confidenciales en guaraní"
 PAR_guarani_communications_desc:0 "Cuando comenzó el conflicto del Chaco, la Orden n.º 51 del general José Félix Estigarribia estableció el guaraní como lengua militar, ordenando que las comunicaciones y los códigos secretos se hicieran exclusivamente en ese idioma. El guaraní ayuda a los paraguayos a identificarse entre sí, evita casos de fuego amigo e incluso ayudará en comunicaciones sensibles."
