 PRU_impending_navy_rebellion:0 "Rebelión naval inminente"
 PRU_impending_navy_rebellion_desc:0 "Sectores de nuestra Armada planean un golpe contra nuestro gobierno porque hemos dado demasiado poder al Ejército. Exigen que reduzcamos el poder otorgado al ejército o habrá graves consecuencias."
 PRU_impending_army_rebellion:0 "Rebelión del Ejército inminente"
 PRU_impending_army_rebellion_desc:0 "Sectores de nuestro Ejército planean un golpe contra nuestro gobierno porque hemos dado demasiado poder a la Armada. Exigen que reduzcamos el poder otorgado a la armada o habrá graves consecuencias."
