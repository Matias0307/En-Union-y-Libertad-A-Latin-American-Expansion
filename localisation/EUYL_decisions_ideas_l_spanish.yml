 CEA_stability_drops_before_50_strike_tt:0 "\n\n§RSi la estabilidad cae por debajo del 40% mientras este espíritu nacional esté activo, los trabajadores de las plantaciones se irán a huelga si la situación no se soluciona dentro de 240 días.\n\n¡Los estadounidenses pueden exigir ocasionalmente parte de nuestras ganancias de las plantaciones bananeras!§!"
