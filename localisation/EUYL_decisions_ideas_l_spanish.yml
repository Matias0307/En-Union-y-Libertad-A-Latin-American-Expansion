 COS_carmen_lyra_will_take_charge_of_the_revolution_tt:0 "§YCarmen Lyra§! se pondrá al frente de la §YRevolución§!\n\nComo §YCarmen Lyra§!, tu objetivo principal es difundir la palabra de la §YRevolución§! y ganar apoyo entre la población. Deberás alcanzar el §G100%§! de §YApoyo a la Revolución§! para derrocar con éxito al gobierno y establecer un nuevo régimen. No llegar al §G100%§! a tiempo desencadenará una §RGuerra Civil§!\n\n"
