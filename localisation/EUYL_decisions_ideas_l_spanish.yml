 ##Venezuela##
 VEN_firm_believer_of_democracy:0 "Firme creyente en la democracia"
 VEN_military_officer:0 "Oficial militar"
 VEN_transition_to_democracy:0 "Transición a la democracia"
 VEN_transition_to_democracy_desc:0 "Eleazar López Contreras siempre ha sido un firme creyente de la libertad de expresión y de los ideales de libertad y democracia, y quiere replicarlo en su país. Tras más de 3 décadas de brutal dictadura, hará todo lo que esté en su poder para ir transformando poco a poco su país en un estado libre y democrático."
 VEN_democracy_trait_tt:0 "Mientras este espíritu nacional esté activo, §Y[ROOT.GetLeader]§! tendrá el rasgo §YFirme creyente en la democracia§!"
 VEN_periodic_protests_will_occur_tt:0 "¡Ocurrirán §RProtestas§! periódicas en todo el país!"
 VEN_abrupt_government_transition:0 "Transición abrupta de gobierno"
 VEN_abrupt_government_transition_desc:0 "Juan Vicente Gómez, el anterior gobernante y dictador de Venezuela, falleció hace apenas unos días, y en su lugar tomó el poder Eleazar López Contreras. Vicente fue dictador de Venezuela durante más de 3 décadas, y ahora, con el repentino cambio de líder y de gobierno, la gente está muy insegura sobre la estabilidad de su propio país y muchos no confían en el nuevo gobernante. [ROOT.GetLeader] tendrá que demostrar que es capaz de gobernar el país como corresponde y de llevar a cabo las reformas necesarias para sacar adelante a esta nación."
 VEN_dependent_on_oil_extraction:0 "Dependiente de la extracción de petróleo"
 VEN_dependent_on_oil_extraction_desc:0 "A diferencia de las economías de nuestros países vecinos en Latinoamérica, pudimos afrontar la Gran Depresión de forma rápida y eficiente. Sin embargo, esto nos hizo depender más de nuestra producción petrolera, lo que no ha permitido que otros sectores de la industria se desarrollen como corresponde."
 VEN_underground_communist_movement:0 "Movimiento comunista clandestino"
 VEN_underground_communist_movement_desc:0 "Bajo la reforma más reciente de la constitución, los partidos Comunista y Anarquista se consideran 'contrarios a la independencia de este país' y, por tanto, son ilegales. Debido a esto, muchos militantes y simpatizantes comunistas han comenzado a trabajar en la clandestinidad, bajo la mirada del gobierno. Debemos desconfiar de sus acciones e intentar evitar que intenten cualquier cosa que pueda desestabilizar el país."
 VEN_possibility_of_worker_strikes_occuring_tt:0 "¡Pueden ocurrir al azar §RHuelgas de trabajadores§! de varios sectores de la §YIndustria§! mientras este espíritu nacional esté activo!"
 VEN_german_infleunce_in_venezuela:0 "Influencia alemana en Venezuela"
 VEN_german_infleunce_in_venezuela_desc:0 "Desde 1933, nazis clandestinos han estado presentes en Venezuela, tratando de aumentar la influencia alemana en el país y de asegurar el comercio de petróleo con nosotros."
 VEN_america_and_allied_nations_will_become_concerned_tt:0 "\n§RMantener este espíritu nacional por demasiado tiempo hará que Estados Unidos y otras potencias aliadas se preocupen por una posible potencia del Eje que amenace su petróleo, y podría escalar a una intervención armada si no se maneja adecuadamente.§!"
 VEN_fascist_nations_will_become_concerned_tt:0 "\n§RMantener este espíritu nacional por demasiado tiempo hará que las principales potencias fascistas se preocupen por la amenaza a su comercio de petróleo, y podría escalar a una intervención armada si no se maneja adecuadamente.§!"
 VEN_inefficient_oil_extraction_1:0 "Extracción de petróleo ineficiente"
 VEN_inefficient_oil_extraction_2:0 "Extracción de petróleo ineficiente"
 VEN_inefficient_oil_extraction_3:0 "Extracción de petróleo ineficiente"
 VEN_advanced_oil_extraction:0 "Extracción de petróleo avanzada"
 VEN_inefficient_oil_extraction_desc_tt:0 "\n§LLa tecnología disponible para extraer el petróleo de este estado simplemente no basta para extraer todo su potencial petrolero. Por lo tanto, estamos limitados en cuánto petróleo podemos extraer y vender.§!"
 VEN_looming_oil_strike_cat:0 "Inminente huelga petrolera"
 VEN_looming_oil_strike_cat_desc:0 "Los trabajadores petroleros están insatisfechos con las condiciones laborales y los bajos salarios, y es probable que su insatisfacción se convierta en un descontento total, lo que llevaría a una posible huelga en el futuro. No atender sus exigencias podría derivar en una revolución a gran escala si no se maneja adecuadamente."
