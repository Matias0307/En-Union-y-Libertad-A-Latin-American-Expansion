 PRU_the_peruvian_civil_war:0 "El Golpe Peruano"
 PRU_the_peruvian_civil_war_desc:0 "Tras la desgracia que fueron las elecciones de 1936 y la absoluta corrupción que ha mostrado el gobierno de Óscar al anular los resultados electorales. Como si eso no fuera ya bastante malo, Óscar fue más allá y arrestó a la mayoría de los simpatizantes y políticos fascistas. También deportó a algunos a Chile y prohibió por completo la UR. Son actos que no podemos perdonar, y Óscar pagará por esto, y pagará con todo lo que tiene. \n\nActualmente, las probabilidades de que tengamos una §RGuerra Civil§! son de §R[?PRU_chance_of_civil_war|R0]%§! \n\nActualmente, las probabilidades de que tengamos un §GGolpe Pacífico§! son de §G[?PRU_chance_of_peaceful_coup|G0]%§!"
 PRU_overthrow_oscars_government:0 "Derrocar el gobierno de Óscar"
 PRU_overthrow_oscars_government_desc:0 "Actualmente estamos planeando un golpe para derrocar al gobierno de Óscar. Que encontremos resistencia o no dependerá de muchos factores, pero una cosa es segura: los partidarios de Óscar no cooperarán de inmediato con nosotros pase lo que pase, así que debemos estar preparados."
 PRU_talk_with_opposition_members:0 "Hablar con miembros de la oposición"
 PRU_set_free_fascist_politicians:0 "Liberar a los políticos fascistas"
 PRU_spread_mass_propaganda:0 "Difundir propaganda masiva"
 PRU_opposition_arresting_our_supporters:0 "La Guardia Civil arresta a nuestros partidarios"
 PRU_opposition_arresting_our_supporters_desc:0 "La Guardia Civil está arrestando a muchos de nuestros partidarios en respuesta al aumento repentino de nuestra popularidad y a la planificación del golpe. ¡Hay que detenerla!"
 PRU_secure_FROM:0 "Asegurar la provincia de [FROM.GetName]"
