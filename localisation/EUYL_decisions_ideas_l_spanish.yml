 ARG_the_great_revolution_desc:0 "Tras negarse a celebrar las próximas elecciones, muchos argentinos de todo el país han dicho basta. Basta de gobiernos corruptos, basta de líderes incompetentes, basta de dictaduras militares, basta de golpes, basta de infortunio económico, y han decidido reunirse colectivamente para intentar derrocar por completo al gobierno, exclamando '¡La Argentina es del pueblo!'. El país, como resultado de esta revolución a gran escala, se está desestabilizando rápidamente, y solo será cuestión de tiempo que estalle.\n\n£infantry_equipment_text_icon  Armas almacenadas: [?ARG_stockpiled_guns|0Y] \n\n£arg_socialist_texticon  Influencia subversiva §YSocialista§!: [?ARG_ps_subversive_influence|0Y]\n£arg_marxist_texticon  Influencia subversiva §YMarxista§!: [?ARG_marxist_subversive_influence|0Y]\n£arg_anarchist_texticon  Influencia subversiva §YAnarquista§!: [?ARG_anarchist_subversive_influence|0Y]\n£arg_posadist_texticon  Influencia subversiva §YPosadista§!: [?ARG_posadist_subversive_influence|0Y] \n\n§R¡La facción con más §!§YInfluencia subversiva§!§R tomará el poder!\n¡Cuanto mayor sea la §!§YTensión política§!§R, más fuertes seremos!§!"
