 BRA_patrianovism_on_the_rise:0 "El patrianovismo en ascenso"
 BRA_patrianovism_on_the_rise_desc:0 "Desde la abolición del Imperio en 1889, ha habido muchos intentos fallidos de restaurar la monarquía, como la Guerra de Canudos o la Revuelta de Ribeirãozinho. Sin embargo, todos estos intentos fracasaron y fueron aplastados rápidamente, y aun así hay muchos brasileños que todavía anhelan el regreso de la monarquía y la restauración del Imperio. Los Patrianovistas, liderados por Arlindo Veiga dos Santos, ofrecen un nuevo enfoque del Imperio, uno más autoritario y que cree firmemente en la igualdad de derechos entre brasileños negros y blancos. Los Patrianovistas ofrecen una renovada esperanza de restaurar la monarquía para quienes aún añoran los días imperiales, y con un esfuerzo conjunto podemos seguir adelante y hacerlo realidad. \n\nSerá difícil y tendremos muchos obstáculos por delante, pero seguiremos adelante, ¡sea cual sea el camino que tomemos!"
