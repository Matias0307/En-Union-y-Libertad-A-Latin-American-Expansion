 PBC_pru_control_less_than_4_tt:0 "Los £PRU_peru_flag  §YNacionalistas peruanos§! controlan §Y4§! estados o §Ymenos§!"
 ARG_sharpen_air_safety_regulations:0 "Endurecer las normas de seguridad aérea"
 ARG_sharpen_air_safety_regulations_desc:0 "Con normas de seguridad más rígidas, podemos prevenir algunas de las causas más comunes de accidentes catastróficos, incluidos los de los dirigibles. \n\n§RNo endurecer las normas de seguridad puede provocar un accidente en un futuro cercano.§!"
 ARG_sharpen_our_air_safety:0 "Endurecer nuestras normas de seguridad aérea"
 ARG_not_suffering_inflation:0 "NO: Sufre inflación"
 PBC_advocated_public_works:0 "Obras públicas promovidas"
 PBC_will_protect_us_tt:0 "¡La §YConfederación Perú-Boliviana§! nos §Gprotegerá§! en caso de conflicto!"
 EUYL_defense_pact:0 "El Pacto de Defensa"
 EUYL_defense_pact_desc:0 "Un Pacto de Defensa formado por la Confederación Perú-Boliviana. Ellos nos protegerán si alguna vez nos vemos en un conflicto."
 EUYL_defense_pact_call_refused:0 "¡Llamado del Pacto de Defensa rechazado!"
 PBC_cooperating_with_french_resistance:0 "Cooperar con la Resistencia Francesa"
 PBC_reforming_lost_unions:0 "Reformar las uniones perdidas"
 PBC_reforming_lost_unions_desc:0 "El panorama actual del continente es demasiado... compacto. Hay demasiadas naciones, y eso causa conflictos innecesarios, así que empecemos a resolver esos conflictos. Podemos restaurar por la fuerza estas antiguas uniones, como la nuestra. Pueden ser nuestros títeres y convertirse en potencias como nosotros. Al hacerlo, no solo podremos mediar en la mayoría de los conflictos de la región, sino también llevar paz y prosperidad a un lugar que alguna vez estuvo lleno de caos."
 PBC_reform_gran_colombia:0 "Reformar la Gran Colombia"
 PBC_reform_viceroyalty_of_rio_de_la_plata:0 "Reformar el Virreinato del Río de la Plata"
 PBC_reform_the_republic_of_central_america:0 "Reformar la República de Centroamérica"
 PBC_unlock_democratic_reformer_tt:0 "Desbloquea al §YReformista Democrático§! como consejero político"


 ARG_the_argentine_civil_war:0 "La Guerra Civil Argentina"
 ARG_the_argentine_civil_war_desc:0 "Con la guerra civil en pleno apogeo, debemos aprovechar el apoyo de los militares para obtener mejoras temporales en nuestro ataque, defensa, organización y velocidad. Es una verdadera lástima que nuestro país tenga que pasar por semejante desgracia, pero es necesario para sacar adelante a esta nación."
 ARG_purchase_FROM_weapons:0 "Comprar armas [FROM.GetAdjective]"
 ARG_division_movement:0 "Mejorar la velocidad de movimiento de las divisiones"
 ARG_division_organization:0 "Mejorar la organización de las divisiones"
 ARG_division_attack:0 "Mejorar el ataque de las divisiones"
 ARG_division_defense:0 "Mejorar la defensa de las divisiones"
 ARG_robertos_deteriorating_health_condition:0 "El deterioro de la salud de Roberto"
 ARG_robertos_deteriorating_health_condition_desc:0 "Tras un reciente chequeo con un médico, se ha descubierto que Roberto tiene diabetes avanzada y que la enfermedad solo empeorará con el tiempo. Se desconoce cuánto tiempo le queda a Roberto, pero podemos tomar medidas para mejorar su condición. \n\n£arg_medicien_texticon  §YEquipo médico§!: [?ARG_medical_Equipment]/[?ARG_medical_equipment_upper_limit]\n[ROOT.GetCure]"
 ARG_robertos_renounce:0 "La inevitable renuncia de Roberto"
 ARG_robertos_renounce_desc:0 "La salud de Roberto empeorará con el tiempo; en algún momento será tan mala que el presidente ya no podrá dirigir la nación como corresponde y tendrá que renunciar."
 ARG_give_proper_treatment:0 "Dar a Roberto el tratamiento adecuado"
 ARG_give_proper_treatment_desc:0 "Darle a Roberto el tratamiento adecuado nos dará tiempo y le permitirá continuar en el cargo por más tiempo."
 ARG_pay_for_better_doctors:0 "Pagar mejores médicos"
 ARG_pay_for_better_doctors_desc:0 "Pagar mejores médicos mejorará levemente su condición y le permitirá continuar en el cargo por más tiempo."
 ARG_give_proper_medicine:0 "Dar a Roberto la medicina adecuada"
 ARG_give_proper_medicine_desc:0 "Darle a Roberto la medicina adecuada nos dará bastante tiempo y le permitirá continuar en el cargo por más tiempo."
 ARG_allow_roberto_to_rest:0 "Permitir que Roberto descanse"
 ARG_allow_roberto_to_rest_desc:0 "Permitir que Roberto se tome un descanso de la conducción directa del país nos dará muchísimo tiempo, a costa de no tener un líder central como corresponde por el momento."
 ARG_convince_roberto_to_work_harder:0 "Convencer a Roberto de trabajar más duro"
 ARG_convince_roberto_to_work_harder_desc:0 "Convencer a Roberto de trabajar más duro hará que la enfermedad avance más rápido y que su renuncia llegue antes."
 ARG_give_him_improper_treatment:0 "Dar a Roberto un tratamiento inadecuado"
 ARG_give_him_improper_treatment_desc:0 "Darle a Roberto un tratamiento equivocado hará que la enfermedad avance más rápido y que su renuncia llegue antes."
 ARG_fake_his_test_results:0 "Falsificar los resultados de sus exámenes"
 ARG_fake_his_test_results_desc:0 "Falsificar los resultados de sus exámenes hará parecer que su condición está mejorando, cuando en realidad ocurre lo contrario."
 ARG_give_roberto_the_wrong_medicine:0 "Dar a Roberto la medicina equivocada"
 ARG_give_roberto_the_wrong_medicine_desc:0 "Darle a Roberto la medicina equivocada empeorará gravemente su condición, con el costo temporal de un liderazgo aún más débil, como si el liderazgo no fuera ya bastante malo."
 ARG_peron_left_argentina:0 "La partida de Perón a Italia"
 ARG_peron_left_argentina_desc:0 "Perón ha dejado Argentina hace poco por orden del Ministerio de Guerra para estudiar la guerra de montaña en los Alpes italianos. Muchos especulan que estudiar las tácticas de Italia también podría afectar los ideales y creencias de Perón, aunque son solo especulaciones."
 ARG_perons_return:0 "El regreso de Perón a Argentina"
 ARG_perons_return_desc:0 "Perón volverá dentro de unos 2 años. Sin embargo, parece poco probable que esto esté escrito en piedra."
 ARG_demand_peron_to_report_back:0 "Exigir a Perón que presente sus hallazgos"
 ARG_the_great_coup:0 "El Gran Golpe"
 ARG_the_great_coup_desc:0 "Facciones del ejército están descontentas con el gobierno actual y planean orquestar un golpe contra el actual líder, apuntando sobre todo a Ramón Castillo."
 ARG_the_coup:0 "El Golpe"
 ARG_the_coup_desc:0 "Estamos preparando el golpe y procurando que Roberto renuncie antes de que lo ejecutemos; de lo contrario, el pueblo se enfurecerá y lo más probable es que no acepte a Perón como su nuevo líder."
 ARG_slight_concessions:0 "Pequeñas concesiones"
 ARG_moderate_concessions:0 "Concesiones moderadas"
 ARG_large_concessions:0 "Grandes concesiones"
 ARG_foreign_investments:0 "Oportunidades de inversión extranjera"
 ARG_foreign_investments_desc:0 "Muchas grandes potencias del mundo han abierto sus economías para que invirtamos en ellas. Aunque al principio resulten costosas, estas inversiones pueden dar enormes recompensas en un futuro cercano."
 ARG_invest_in_FROM:0 "Invertir en la economía de [FROM.GetName]"
 invested_in_ARG:0 "Ya has invertido en la economía de esta nación"
 ARG_invest_in_countries_economy_tt:0 "§GInvertiremos§! en la §Yeconomía§! de esta nación"
 ARG_debt_repayments:0 "Opciones de pago de la deuda"
 ARG_debt_repayments_desc:0 "Los senadores han votado: debemos pagar nuestra 'deuda'. Que estemos realmente obligados a pagar o no, ese no es el asunto. Debemos saldar la deuda que tenemos actualmente con varios grupos de nuestra nación. Incluso podríamos recibir una bonificación por cumplir con ellos."
 ARG_repay_our_debt_to_the_senators:0 "Pagar la deuda a los senadores"
 ARG_repay_our_debt_to_the_deputies:0 "Pagar la deuda a los diputados"
 ARG_repay_debt_to_the_chamber_of_deputies:0 "Pagar la deuda a la Cámara de Diputados"
 ARG_repay_debt_to_the_employees:0 "Pagar la deuda a los empleados"
 ARG_repay_debt_to_war_ministry_officials:0 "Pagar la deuda a los funcionarios del Ministerio de Guerra"
 ARG_ramon_military_coup:0 "¿Complot militar?"
 ARG_ramon_military_coup_desc:0 "Sectores del ejército están descontentos con el sucesor de [Root.GetLeader] y planean derrocar por completo al gobierno. Parecen dispuestos a usar la fuerza bruta si se ven obligados."
 ARG_the_possible_coup:0 "El posible golpe"
 ARG_five_year_plan:0 "El Plan Quinquenal"
 ARG_five_year_plan_desc:0 "Con nuestra posición plenamente asegurada, ahora debemos concentrarnos en la economía y asegurarnos de que alcance un nivel satisfactorio. Los países que nos rodean se están industrializando rápidamente y no podemos quedarnos atrás."
 ARG_invest_in_the_civilian_economy:0 "Invertir en la economía civil"
 ARG_invest_in_the_military:0 "Invertir en las fuerzas armadas"
 ARG_nationalize_the_road_industry:0 "Nacionalizar la industria vial"
 ARG_nationalize_the_steel_mines:0 "Nacionalizar las minas de acero"
 ARG_nationalize_the_tungsten_mines:0 "Nacionalizar las minas de tungsteno"
 ARG_nationalize_the_oil_fields:0 "Nacionalizar los yacimientos petrolíferos"
 ARG_integrate_our_territories:0 "Integrar nuestros territorios"
 ARG_integrate_our_territories_desc:0 "Con nuestra abrupta expansión por todos los rincones de Sudamérica, los pueblos de estos países están lejos de estar contentos con nuestro dominio sobre ellos. Debemos someterlos e integrarlos a nuestra nación, aunque eso signifique perder hombres y poder político. \n\n§R¡Solo puedes anexar estados que limiten con tus estados núcleo!§!"
 ARG_integrating_territories:0 "Integrar la provincia de [FROM.GetName]"
 develop_catamarca_iron_ore_deposits:0 "Desarrollar los yacimientos de hierro de Catamarca"
 exploit_the_rio_negro_oil_field:0 "Explotar el yacimiento petrolífero de Río Negro"
 develop_cordoba_aluminium_deposits:0 "Desarrollar los yacimientos de aluminio de Córdoba"
 develop_chaco_tungsten_deposits:0 "Desarrollar los yacimientos de tungsteno del Chaco"
 develop_buenos_aires_chromium_deposits:0 "Desarrollar los yacimientos de cromo de Buenos Aires"
 develop_neuquen_rubber_plantations:0 "Desarrollar las plantaciones de caucho de Neuquén"
 develop_misiones_steel_deposits:0 "Desarrollar los yacimientos de acero de Misiones"
 drill_the_chubut_oil_field:0 "Perforar el petróleo de Chubut"
 develop_arica_chromium_mines:0 "Desarrollar las minas de cromo de Arica"
 develop_antofagasta_steel_deposits:0 "Desarrollar los yacimientos de acero de Antofagasta"
 develop_magallanes_aluminium_deposits:0 "Desarrollar los yacimientos de aluminio de Magallanes"
 ARG_inflation:0 "Combatir la inflación"
 ARG_inflation_desc:0 "Argentina ha tenido una historia tan larga con la inflación que ambas son casi sinónimos. Debemos frenar nuestra inflación tan rápida y eficazmente como sea posible, o nuestro país se derrumbará sobre sí mismo, literalmente. La inflación es muy impredecible y debemos estar atentos, de modo que cualquier contratiempo o problema que encontremos debemos enfrentarlo con eficacia. Tenemos varias formas de lidiar con la inflación y necesitaremos usarlas todas para librarnos de esta desgracia."
 ARG_inflationary_crisis:0 "Crisis inflacionaria"
 ARG_inflationary_crisis_desc:0 "La delicada situación de nuestra moneda hace que su valor caiga de forma constante con el tiempo. Esto puede evitarse en cierta medida tomando diversas medidas para combatir la inflación y detenerla en seco. Buena suerte, la vas a necesitar."
 ARG_emit_pesos_to_control_inflation:0 "Establecer controles de salarios y precios"
 ARG_emit_pesos_to_control_inflation_desc:0 "Si queremos asegurarnos de que la inflación no se salga de control, debemos implementar controles de salarios y precios. Debido a la naturaleza socialista de tal medida, el partido comunista ganará poder con esto."
 ARG_employ_a_contractionary_monetary_policy:0 "Aplicar una política monetaria contractiva"
 ARG_employ_a_contractionary_monetary_policy_desc:0 "Un poco más costosa que los controles de salarios y precios, pero da el mismo efecto e impide que los comunistas ganen poder."
 ARG_force_companies_to_lower_prices:0 "Obligar a las empresas a bajar los precios al consumidor"
 ARG_force_companies_to_lower_prices_desc:0 "Nuestra opción más cara, pero también la más eficaz: reduce significativamente nuestra inflación una vez que sigue su curso."
 ARG_temporarily_slow_down_the_inflation:0 "Frenar temporalmente la inflación"
 ARG_temporarily_slow_down_the_inflation_desc:0 "Con algunos trucos bajo la manga, podemos detener temporalmente la crisis inflacionaria. Por desgracia, no es infinito."
 ARG_end_the_inflation:0 "Terminar con la inflación"
 ARG_end_the_inflation_desc:0 "Tras muchas reformas, ahora podemos poner oficialmente el último clavo en el ataúd y establecer una moneda estable."
 ARG_mobilize_elite_militia_in_FROM:0 "Movilizar una milicia de élite en [FROM.GetName]"
 ARG_integration_of_the_falklands:0 "Integrar las Malvinas"
 ARG_integration_of_the_falklands_desc:0 "La cercanía de las Islas Malvinas a nuestro territorio continental, junto con un reclamo que mantenemos desde hace más de 100 años, hace que sean y siempre serán parte integral de Argentina. Los británicos serán expulsados de las islas tarde o temprano, y seremos nosotros quienes logremos tal hazaña, a menos que estén dispuestos a cooperar y entregarnos las islas, en cuyo caso las aceptaremos con gusto. En cualquiera de los dos casos, las Malvinas serán plenamente integradas a nuestro territorio y consideradas verdaderamente argentinas."
 ARG_integrate_the_falklands:0 "Integrar las Malvinas"
 ARG_integrate_the_falklands_desc:0 "Ahora que las Malvinas por fin están bajo nuestro control, podemos 'argentinizarlas' de verdad."
 ARG_1937_elections:0 "Las Elecciones de 1937"
 ARG_1937_elections_desc:0 "Nuestra agitación política aún no ha cesado y lo más probable es que no desaparezca durante mucho tiempo. Las tensiones entre los partidos aumentan y el espectro político en su conjunto se va volviendo, lenta pero seguramente, desagradable. Lo único que realmente podemos hacer es esperar que no se derrame sangre y que todo se resuelva pacíficamente.\n\n             ~~~~ §YVotos electorales previstos§! ~~~~ \n  £ucr_a_texticon §CUnión Cívica Radical Antipersonalista§!:  [?ARG_predicted_UCRA_electoral_votes|Y0]\n  £ucr_texticon §RUnión Cívica Radical§!:  [?ARG_predicted_UCR_electoral_votes|Y0]\n  £partido_socialista_texticon §OPartido Socialista§!:  [?ARG_predicted_PS_electoral_votes|Y0]\n\n§REl ganador se determinará según los§! §YVotos electorales§!§R. El partido con más votos electorales ganará las elecciones, sin importar la popularidad de dicho partido.§!"
 ARG_the_1937_elections:0 "Las Elecciones de 1937"
 ARG_elections_called_off_tt:0 "Las §YElecciones de 1937§! serán §Gsuspendidas§!\n\n"
 ARG_pressure_the_parties_for_faster_elections:0 "Presionar a los partidos para adelantar las elecciones"
 ARG_coup_will_be_shut_down_tt:0 "Los §YMilitares§! serán §Gdisueltos§! y el golpe será §Gcancelado§!"
 ARG_state_will_be_dealt_with_tt:0 "Los §YMilitares§! en este estado serán §Gdisueltos§!"
 ARG_shut_down_the_coup:0 "Detener el golpe"
 ARG_march_in_the_province_of_FROM:0 "Marchar sobre la provincia de [FROM.GetName]"
 ARG_all_states_were_dealt_with_tt:0 "Se ha lidiado con los militares en las provincias de §YTierra del Fuego, Santa Cruz, Chubut, Neuquén y Río Negro§! \n\n§RSi no se logra lidiar con las 5 provincias, igualmente estallará una guerra civil con los militares controlando las 5 provincias.§!"
 ARG_states_military_have_influence_over_tt:0 "Estas son las provincias que controlan los militares"
 ARG_unlock_march_decisions_tt:0 "Desbloquea la decisión §YDetener el golpe§!, que te permitirá §Gdetener§! el golpe y §Gevitar§! una §Rguerra civil§! al lidiar con todas las provincias que controlan los militares."
 ARG_fm_is_a_monopoly_tt:0 "Se ha otorgado a §YFabricaciones Militares§! el estatus de monopolio sobre nuestra producción militar."
 ARG_huemul_reactor:0 "Reactor Huemul"
 ARG_peron_returned_from_italy:0 "Perón ha regresado de su misión en Italia"
 ARG_if_communism_less_than_45_civil_war_tt:0 "Si el §YComunismo§! es §Rinferior al§! §Y45%§!, ¡estallará una §RGuerra Civil§! \n\nSi el apoyo es §Gsuperior al§! §Y45%§!, ocurrirá un golpe pacífico."
 form_commune_of_la_plata:0 "Formar la Comuna de La Plata"
 form_commune_of_la_plata_desc:0 "La región del Plata siempre estuvo unida culturalmente. Su gente es una sola, y es hora de oficializar la unificación."
 ARG_form_commune_of_la_plata:0 "Unificar La Plata"
 ARG_controls_all_uruguayan_states_tt:0 "Controla todos los estados §Yuruguayos§!"
 ARG_controls_all_paraguayan_states_tt:0 "Controla todos los estados §Yparaguayos§!"
 ARG_formed_la_plata_tt:0 "Se formó §YLa Plata§!"
 ARG_gain_cores_on_urg_and_par_tt:0 "Obtendrás §Gnúcleos§! en todos los estados §Yparaguayos§! y §Yuruguayos§!"
 ARG_brazil_may_intervene_tt:0 "§RBrasil podría intervenir si invadimos Uruguay sin previo aviso§!"
 BRA_reestablish_the_police_force:0 "Restablecer la fuerza policial"
 
 
 expand_slightly_our_population:0 "Expandír Ligeramente Nuestra Población"
 expand_our_population:0 "Expandír Nuestra Población"
 expand_massively_our_population:0 "Expandír Mucho Nuestra Población"
 URG_prisoners_of_the_terra_dictatorship:0 "La Dictadura de Terra"
 URG_prisoners_of_the_terra_dictatorship_desc:0 "Desde que Gabriel Terra asumió el poder en Uruguay, ha gobernado el país con mano de hierro. Con el paso de los años, Terra fue ganándose muchos enemigos en el ámbito político y social, hasta el punto de que se hicieron intentos de golpe para derribarlo del poder. Por ello, Terra comenzó a arrestar a muchos políticos, médicos, escritores e incluso al vicepresidente. La delicada situación de la dictadura de Terra lo obliga ahora a arrestar a esas personas, porque si no lo hace, los partidos opositores se levantarán y aplastarán al dictador. \n\nCantidad de personas importantes arrestadas por el régimen de Terra: [?URG_politicians_arrested|R0] \n\n£stability_texticon  §YEstabilidad: §! [?URG_terra_stability|+%]§!\n\n£occupation_costs  §YDeriva democrática diaria: §! [?URG_democracy_from_terra|Y]§Y%§!\n\n£pol_power  §YDeriva neutral diaria: §! [?URG_terra_support|Y]§Y%§!\n\n"
 URG_arrest_politicians:0 "Arrestar a personas que parezcan sospechosas"
 URG_set_free_politicians:0 "Liberar a algunos de los arrestados"
 URG_repaying_the_debt_to_britain:0 "Pagar nuestra deuda con los británicos"
 URG_repaying_the_debt_to_britain_desc:0 "Los británicos no han estado contentos con nuestra reticencia a pagar la deuda que tenemos con ellos, pero eso cambiará a partir de hoy. Nuestra industria ya es lo bastante fuerte como para poder permitirnos pagarla, y además nos convendrá tener a los británicos como aliados en lugar de enemigos. \n\nPorcentaje actual de nuestra deuda que hemos pagado:  [?URG_debt_to_britain|G0]§G%§!"
 URG_small_debt_repayment:0 "Pequeño pago de la deuda"
 URG_medium_debt_repayment:0 "Pago mediano de la deuda"
 URG_large_debt_repayment:0 "Gran pago de la deuda"
 URG_dealing_with_the_protestors:0 "Lidiar con los manifestantes"
 URG_dealing_with_the_protestors_desc:0 "Ahora que podemos gobernar la nación con mano de hierro, podemos empezar a lidiar con los manifestantes que se atreven a arruinar cualquier parte de nuestra nación. Nadie los obligó a salir a protestar violentamente, y nadie los defenderá cuando llegue su inevitable destino."
 URG_stomp_out_the_loyalists_in_FROM:0 "Aplastar a los leales en [FROM.GetName]"
 URG_guide_the_companies:0 "Guiar a las empresas"
 URG_guide_the_companies_desc:0 "Como privatizamos la gran mayoría de nuestra industria, ya no podemos intervenir directamente en el desarrollo industrial ni militar, al menos no con la misma eficacia. Lo que sí podemos hacer es decirles a las empresas, o al menos guiarlas, para que hagan lo que queremos. Muchos de nuestros inversionistas nos han dicho que este método es mucho más eficiente que la intervención directa del gobierno, pero solo el tiempo lo dirá."
 URG_ask_companies_to_invest_slightly_in_the_industry:0 "Pedir a las empresas que inviertan un poco en la industria"
 URG_ask_companies_to_invest_heavily_in_the_industry:0 "Pedir a las empresas que inviertan mucho en la industria"
 URG_ask_companies_to_invest_slightly_in_the_military:0 "Pedir a las empresas que inviertan un poco en las fuerzas armadas"
 URG_ask_companies_to_invest_heavily_in_the_military:0 "Pedir a las empresas que inviertan mucho en las fuerzas armadas"
 URG_ask_companies_to_invest_dockyard_expansion:0 "Pedir a las empresas que inviertan en la expansión de los astilleros"
 URG_ask_companies_to_invest_in_the_infrastructure:0 "Pedir a las empresas que inviertan en infraestructura"
 URG_march_to_argentina_capital:0 "Marchar sobre Buenos Aires"
 URG_march_to_argentina_capital_desc:0 "Buenos Aires es el corazón del país, lo que mantiene a flote a la nación. Si logramos capturarla en poco tiempo, los argentinos quedarán destrozados y la victoria estará garantizada."
 URG_capture_buenos_aires:0 "Capturar Buenos Aires"
 URG_capture_buenos_aires_desc:0 "¡La capital está a la vista! Una buena ofensiva y estará bajo nuestro control en poco tiempo."
 URG_work_with_the_PCU:0 "Concesiones al PCU"
 URG_work_with_the_PCU_desc:0 "Emilio Frugoni tiene mucha historia con el PCU. Antiguo miembro del Partido Socialista, el partido se dividió en dos tras la Revolución de Octubre en la Unión Soviética, pues la postura de Frugoni siempre había sido la del reformismo pacífico y contraria a las revoluciones sangrientas, algo con lo que la mayoría de los miembros de su antiguo partido no estaba de acuerdo. Esa mayoría quería que el PSU se uniera a la recién formada Internacional Comunista y ayudara a liberar a los trabajadores. Todo esto condujo a la escisión del partido en 1920, con Frugoni y sus seguidores expulsados del nuevo Partido Comunista. \n\nPero a pesar de todo, ambos partidos comparten un objetivo similar, y con la reciente crisis política en Uruguay tras el sangriento derrocamiento de Gabriel Terra, Frugoni podría hacer concesiones a los comunistas para crear una coalición que estabilice su inestable posición como presidente."
 URG_undermine_berres:0 "Socavar al presidente Berres"
 URG_undermine_berres_desc:0 "A pesar de haber dirigido la nación solo por un breve tiempo, el apoyo de Batlle Berres dentro y fuera del partido sigue creciendo, lo que vuelve paranoicos a sus opositores políticos. \n\nSin embargo, uno de sus opositores políticos, Andrés Martínez Trueba, ve una oportunidad de ganar poder para sí mismo, enfrentando a los demás opositores entre sí y contra Batlle."
 URG_support_berres:0 "Apoyar al presidente Berres"
 URG_support_berres_desc:0 "Tras ganar recientemente la elección extraordinaria, Batlle Berres ya ha causado muy buena impresión tanto en las masas como en los miembros de su partido, e incluso ha creado su propia corriente política basada en el batllismo, llamada neobatllismo. \n\nPero a pesar de todo, aún hay políticos empeñados en dificultar su presidencia, que se sienten amenazados por su creciente poder y apoyo. Sin embargo, gracias a sus conexiones dentro y fuera del partido, Batlle ha sido informado de la situación, y solo le queda actuar contra sus adversarios."
 URG_extraordinary_elections_tt:0 "Celebraremos elecciones en §Y30§! días\n\n"
 URG_consequences_tt:0 "§R¡Podría haber consecuencias inesperadas al tomar esta decisión!§!"
 
 form_rioplatense_empire_category:0 "Hacer realidad las ambiciones rioplatenses"
 form_rioplatense_empire_category_desc:0 "Con la voluntad de unir a todo el pueblo rioplatense bajo un solo país, así lo haremos. Todos los rioplatenses serán unidos y enfrentaremos juntos cualquier amenaza."
 form_rioplatense_empire:0 "Formar el Imperio Rioplatense"

 EUYL_prospect_for_resources:0 "Prospección de recursos en Latinoamérica"
 EUYL_prospect_for_resources_desc:0 "Hay muchos recursos en el continente latinoamericano, y debemos asegurarnos de explotarlos al máximo. Estos recursos pueden usarse en nuestro propio beneficio o para comerciar en el mercado global."
