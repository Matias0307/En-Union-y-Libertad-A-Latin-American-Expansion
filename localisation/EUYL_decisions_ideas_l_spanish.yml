 ECU_partial_gold_standard_abandonment:0 "Abandono parcial del patrón oro"
 ECU_partial_gold_standard_abandonment_desc:0 "El patrón oro fue rechazado en Ecuador en 1932, debido a que no se lograron los resultados que los ecuatorianos esperaban con la misión Kemmerer. Este abandono, junto con la gran depresión estadounidense, causó una grave inestabilidad económica."
 ECU_full_gold_standard_abandonment:0 "Abandono total del patrón oro"
 ECU_full_gold_standard_abandonment_desc:0 "Una decisión de la que ya no podemos volver atrás. La estabilidad económica puede fluctuar aún más ahora, pero al menos la moneda ecuatoriana ya no dependerá realmente del valor del oro"
 ECU_returned_to_the_gold_standard:0 "Regreso al patrón oro"
 ECU_returned_to_the_gold_standard_desc:0 "A juzgar por nuestra actividad económica entre 1927 y 1932, cuando aún usábamos el patrón oro, está claro que ese fue el punto de mayor estabilidad de la economía. Aunque tenga inconvenientes a largo plazo, por ahora vale la pena."
