 PAN_sovereignty_points_counter_text_tt:0 "Este contador muestra la cantidad actual de £PAN_panama_flag §YPuntos de Soberanía§! que has acumulado durante las conversaciones en curso con [USA.GetName].\n\nEstos puntos determinarán el resultado de las conversaciones y el nivel de intervención que los Estados Unidos tendrán en la política panameña."
