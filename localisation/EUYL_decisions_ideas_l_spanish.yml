 CHL_the_1938_chilean_elections_desc:0 "El pueblo chileno se está preparando para elegir a su nuevo presidente. Muchas afiliaciones políticas se están postulando, pero solo 3 realmente destacan: los Fascistas, el Frente Popular y los Liberales. La competencia entre los tres parece extremadamente reñida y no hay certeza de quién ganará. Por ahora, solo el tiempo lo dirá. \n\n¡Según la situación actual, el [ROOT.GetElectionWinner38] ganará las elecciones!\n\nLas elecciones ahora se determinan usando la categoría de poder y/o el sistema de Equilibrio de Poder. Si los £CHL_nacista_text  §YNacistas§! están en una categoría de poder §RMajor§! O son dominantes en el §REquilibrio de Poder§!, ganarán las elecciones. Para el £CHL_frente_popular_text  §YFrente Popular§! y los £CHL_democratic_text  §YLiberales§!, ganarán siempre y cuando los £CHL_nacista_text  §YNacistas§! NO estén en una categoría de poder §RMajor§! Y NO sean dominantes en el §REquilibrio de Poder§!."
