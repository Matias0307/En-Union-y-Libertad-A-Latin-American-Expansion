 BOL_discuss_investment_possibilities_with_FROM:0 "Discutir oportunidades de inversión con [FROM.GetNameDef]"
 BOL_toro_will_begin_scheme:0 "Toro §ROcupará§! periódicamente varios estados de nuestra nación"
 BOL_state_taken_by_toro:0 "§R¡Uno de nuestros estados ha sido tomado!§!"
 BOL_dealing_with_toros_schemes:0 "Lidiar con las intrigas de Toro"
 BOL_dealing_with_toros_schemes_desc:0 "Toro no estaba contento con que Germán tomara el poder total sobre la nación y ha decidido desatarse por todo el país, reuniendo a sus partidarios leales en un intento de derrocar a Germán. \n\n¡Ya tomó el control de uno de nuestros estados y planea tomar muchos más hasta que lo detengamos por completo! \n\nActualmente, Toro controla §R[?BOL_number_of_states_controlled_by_toro|R0]§! estado(s)! \n\n§R¡Si Toro controla más de 4 estados, lanzará un golpe!"
 BOL_states_controlled_toro:0 "La cantidad de estados controlados por Toro es menor que §Y5§!"
 BOL_toro_planning_to_control_FROM:0 "Toro planea tomar el control de [FROM.GetName]"
 BOL_retake_control_of_FROM:0 "Recuperar el control de [FROM.GetName]"
 BOL_retake_control_of_FROM:0 "Recuperar el control de [FROM.GetName]"
 BOL_try_to_slow_down_toro:0 "Intentar frenar a Toro"
 BOL_coup_being_planned_by_toro:0 "Toro planea un golpe"
 BOL_coup_being_planned_by_toro_desc:0 "Toro ha decidido empezar a planear un golpe tras tomar el control de la mayoría de nuestros estados. ¡Debemos detenerlo!"
 BOL_toro_rebellious:0 "Toro se está rebelando"
 BOL_decisions_toro_cheaper:0 "Las decisiones de §YRecuperar estados§! serán §Gmás baratas§! y tomarán §Gmenos tiempo§!"
 BOL_toro_controls_no_states:0 "Toro controla un estado o menos"
 BOL_getting_our_sweet_revenge:0 "Cobrarnos una dulce venganza"
 BOL_getting_our_sweet_revenge_desc:0 "Durante décadas hemos ido perdiendo poco a poco nuestro territorio a manos de todos nuestros vecinos, arrancando pedazos de nuestra nación y humillando al pueblo boliviano. Todo eso va a cambiar: cada nación que haya puesto siquiera un dedo sobre nuestro país pagará con su sangre y con sus hombres mientras la humillamos exactamente como ellas hicieron. ¡Ya no seremos conocidos como el débil de Sudamérica!"
 BOL_make_FROM_pay_for_taking_our_land:0 "Hacer que [FROM.GetName] pague por quitarnos nuestras tierras"
 BOL_build_up_the_province_of_FROM:0 "Desarrollar la provincia de [FROM.GetName]"
 BOL_integrate_the_province_of_FROM:0 "Integrar la provincia de [FROM.GetName]"
 form_natural_borders:0 "Nuestras fronteras naturales"
 form_natural_borders_desc:0 "A lo largo de toda nuestra historia, nuestros vecinos han abusado de nuestra posición bastante central en Sudamérica y poco a poco nos han arrebatado pedazos de nuestras tierras, pero eso no durará más, ¡porque verán nuestro verdadero poder y se acobardarán de miedo cuando alcancemos nuestro verdadero potencial!"
 BOL_our_natural_borders:0 "Restaurar nuestras fronteras legítimas"
 BOL_foreign_arms_purchasing:0 "Comprar armas extranjeras"
 BOL_foreign_arms_purchasing_desc:0 "Las potencias extranjeras tienen armamento muy moderno, y adquirirlo nos dará ventaja en cualquier conflicto en el que podamos vernos envueltos."
 BOL_tejadas_incompetence:0 "La incompetencia de Tejada"
 BOL_tejadas_incompetence_desc:0 "Muchos consideran a Tejada un líder incompetente, uno que no está capacitado para dirigir Bolivia, especialmente en su estado actual. ¡Debemos demostrar que el pueblo se equivoca y ayudar a Tejada a convertirse en el líder que todos quieren ver!"
 BOL_learn_to_lead_the_army:0 "Aprender a dirigir el ejército"
 BOL_learn_to_manage_the_economy:0 "Aprender a gestionar la economía"
 BOL_learn_to_manage_the_population:0 "Aprender a gestionar a la población"
 BOL_states_controlled_by_toro_tt:0 "Estos son los estados actualmente §Rcontrolados§! por §YToro§!"

 ### Confederación Peru-Boliviana ###
 PBC_integrating_all_our_claimed_lands:0 "Integrar nuestra legítima arcilla"
 PBC_integrating_all_our_claimed_lands_desc:0 "Como nuestras políticas no coinciden del todo, tendremos que integrar manualmente los territorios que acabamos de adquirir. Esto requerirá tiempo, recursos y a nuestros hombres, pero si queremos llegar de verdad a la Confederación que alguna vez fuimos, debemos integrar por completo todos los territorios que poseemos y convertirnos en la Confederación que nuestros predecesores no pudieron lograr."
 PBC_integrating_our_territory:0 "Integrar por la fuerza la provincia de [FROM.GetName]"
 PBC_winner_of_war_of_independence:0 "Ganamos nuestra Guerra de Independencia"
 PBC_unlock_escalate_tt:0 "Desbloquea §YIntensificar aún más la guerra§!, que §Gfortalecerá§! el espíritu nacional §YNuestra Guerra de Independencia§!"
 PBC_war_of_independence_d:0 "Nuestra Guerra de Independencia"
 PBC_war_of_independence_d_desc:0 "Estos bastardos no nos permitirán ser independientes sin pelear, así que nos aseguraremos de darles pelea. No será fácil, pues tenemos muchos enemigos en contra. Por muy sombría que parezca la situación, la superaremos y derrotaremos a estas viles criaturas."
