 HON_american_owned_industry:0 "Industria de Propiedad Estadounidense"
 HON_american_owned_industry_desc:0 "Las empresas estadounidenses han controlado nuestra economía durante muchos años, desde que se descubrió el 'oro cultivado', como lo llaman. Si bien esto benefició inicialmente nuestra economía, con el tiempo nos ha llevado a que esta sea simplemente una extensión de la [USA.GetAdjective], siendo dependiente y totalmente subordinada a ella. Nuestra industria no puede funcionar sin estas compañías, lo que podría resultar en consecuencias económicas devastadoras si seguimos así. A pesar de esto, expulsarlas también sería perjudicial debido a nuestra dependencia. Es una situación difícil."
