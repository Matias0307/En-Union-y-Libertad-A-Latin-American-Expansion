 URG_teritorial_expansion:0 "Expandir nuestro territorio"
 URG_teritorial_expansion_desc:0 "Nuestras fronteras actuales no son suficientes: debemos ir más allá de ellas y consolidarnos como potencia regional, e incluso como superpotencia si jugamos bien nuestras cartas. Es imposible saber qué ocurrirá en el futuro, ¡pero al menos nos aseguraremos de intentar la victoria!"
