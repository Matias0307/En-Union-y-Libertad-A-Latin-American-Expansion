 COS_manuel_mora_will_take_charge_of_revolution_tt:0 "§YManuel Mora§! se pondrá al frente de la §YRevolución§!\n\nComo §YManuel Mora§!, tu objetivo principal es §YCalmar§! a los revolucionarios y §GReducir§! el §YApoyo a la Revolución§!. Deberás llegar al §G0%§! de §YApoyo a la Revolución§! para celebrar elecciones con éxito y mantener el control del país. No lograr calmar a los revolucionarios desencadenará una §RGuerra Civil§!\n\n"
