 PBC_peruvians_nationalists_planning_uprising:0 "Los nacionalistas peruanos planean un levantamiento"
 PBC_unlock_retake_state_tt:0 "Desbloquea las decisiones de §YRecuperar el estado§!, que te permiten §Grecuperar§! estados que fueron ocupados por los §Rnacionalistas§!."
 PBC_union_will_will_disbanded_tt:0 "Nuestro sindicato será §Disuelto§!"
 PBC_cost_to_retake_state_reduced_tt:0 "El §Ycosto§! de recuperar un estado se §Greducirá§! en §Y10§!"
 PBC_days_to_retake_state_reduced_tt:0 "Los §Ydías§! que toma recuperar un estado se §Greducirán§! en §Y8§!"
