 ARG_infamous_decade_idea:0 "Década Infame"
 ARG_infamous_decade_tt:0 "§LNuestra gran nación está siendo consumida por la codicia, el miedo y la incertidumbre. Con cada día que pasa, nuestro pueblo confía menos en su gobierno, y el miedo a otro golpe está presente en la mente de todos. Esta incertidumbre desmoraliza al pueblo y desestabiliza al país en su conjunto. Será necesario solucionar esta situación si queremos seguir adelante.§!\n\n"
 ARG_corruption_scandal_idea:0 "Escándalo de corrupción"
 ARG_corruption_tt:0 "§LAunque nadie quiere admitirlo, la verdad es que nuestro país está plagado de corrupción. Desde los trabajadores hasta las élites, la corrupción y Argentina van de la mano. Aunque hay dudas sobre algunos de nuestros políticos por ser potencialmente corruptos, señalar con el dedo solo causará más problemas. Si queremos resolver este problema, tendremos que hacerlo en silencio y con el tiempo.§!\n\n"
