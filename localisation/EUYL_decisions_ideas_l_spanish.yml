 PAR_subsidizing_paraguayan_industry_desc:0 "La economía paraguaya está estancada. Si queremos hacer algo al respecto, debemos actuar subsidiando áreas clave de nuestra industria y dejando que florezca una vez más.\n\nPorcentaje de la industria paraguaya subsidiado: [?PAR_percent_subsidize|Y0]§Y%§!"
