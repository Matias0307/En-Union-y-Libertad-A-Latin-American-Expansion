 COS_the_revolution_burns_in_FROM:0 "La Revolución Arde en [FROM.GetName]"
 COS_unlocks_decisions_to_increase_attack_and_defense_against_enemy_countries_tt:0 "Desbloquea decisiones para aumentar el §GAtaque§! y la §GDefensa§! contra países enemigos"
 COS_permanent_revolution_goes_against_the_views_of_manuel_mora_tt:0 "\n\n§RLa Revolución Permanente va en contra de las ideas de Manuel Mora§!\n\nManuel Mora fue un firme defensor de un enfoque más gradual y democrático para alcanzar el socialismo, en lugar de una revolución repentina y violenta. Creía en trabajar dentro del sistema político existente para lograr el cambio, en vez de derrocarlo por completo. Por lo tanto, la idea de una revolución permanente, que exige una acción revolucionaria continua e inmediata, probablemente chocaría con las creencias y estrategias de Manuel Mora para lograr el cambio social en Costa Rica. Provocará los siguientes §YEfectos§!:\n\n"
 COS_has_formed_USC_UNIFIED_tt:0 "Ha formado §Y$USC_UNIFIED$§!"
 COS_capturing_capitals_increases_global_compliance_by_5_tt:0 "Capturar las §YCapitales§! de §Y[361.GetName]§!, §Y[126.GetName]§!, §Y[219.GetName]§! y §Y[282.GetName]§! aumentará la §YConformidad§! global en todos tus §YEstados No Núcleo§! en un §G5%§! cada vez, hasta un máximo de §G20%§!"
 COS_the_reichskommissariat:0 "El Reichskommissariat"
 COS_the_reichskommissariat_desc:0 "Tras el ascenso del NSDAP/AO en Costa Rica y la posterior toma de la administración costarricense, el país ha sido reorganizado como un Reichskommissariat. Esta nueva estructura administrativa está diseñada para facilitar la aplicación de las políticas e ideología nazis en todo el país, con un enfoque en promover la cultura y los valores alemanes. El Reichskommissariat será responsable de supervisar todos los aspectos de la sociedad costarricense, incluidos la educación, los medios de comunicación y las fuerzas del orden, a fin de garantizar que el país se mantenga alineado con los objetivos del Tercer Reich."
 COS_third_reich_will_seize_our_assets_periodically_to_fuel_the_german_war_machine_tt:0 "\n\n§REl Tercer Reich confiscará periódicamente nuestros activos para alimentar la máquina de guerra alemana§!"
 COS_the_reichskommissariat_dec_cat:0 "El Reichskommissariat"
 COS_the_reichskommissariat_dec_cat_desc:0 "Tras el ascenso del NSDAP/AO en Costa Rica y la posterior toma de la administración costarricense, el país ha sido reorganizado como un Reichskommissariat. Esta nueva estructura administrativa está diseñada para facilitar la aplicación de las políticas e ideología nazis en todo el país, con un enfoque en promover la cultura y los valores alemanes. El Reichskommissariat será responsable de supervisar todos los aspectos de la sociedad costarricense, incluidos la educación, los medios de comunicación y las fuerzas del orden, a fin de garantizar que el país se mantenga alineado con los objetivos del Tercer Reich.\n\nLímite actual de §GBonificación§! del §YReichskommissariat§!: §G[?COS.COS_reichskommissariat_upper_limit|%G0]§!\n\nLímite actual de §RPenalización§! del §YReichskommissariat§!: §R[?COS.COS_reichskommissariat_lower_limit|%R0]§!\n\nA los ojos del Tercer Reich, actualmente somos [COS.GetReliability] para la causa.\n\nLa §YFiabilidad§! se puede obtener §YCapitulando§! naciones enemigas, §YCapturando Capitales§! y §YConfiscando Activos Extranjeros§! de naciones enemigas. \n\n§RTen cuidado: si tu fiabilidad baja demasiado, el Tercer Reich confiscará nuestros activos y nos anexará.§!"
