 CHL_internal_political_split_desc:0 "Con las tensiones globales creciendo lentamente y las ideologías extremas como el Fascismo y el Comunismo expandiéndose por todo el mundo, nuestra nación está siendo fuertemente afectada. Las cicatrices de la Gran Depresión, combinadas con el crecimiento del poder de la Alemania Nazi y la Unión Soviética, han impulsado el crecimiento alarmante de ideologías extremas dentro de nuestro país. El bastión de democracia que somos hoy podría no durar si permitimos que los Nacistas o los Comunistas se vuelvan más poderosos de lo que ya son. Tampoco ayuda que estén en un eterno conflicto de poder, afectando gravemente nuestra capacidad de gobernar. Debemos tener cuidado: un solo movimiento en falso y nuestra nación puede caer en completo caos. \n\n§R¡Si ambas facciones alcanzan la categoría de poder §RMajor§!, nuestro poder político estará en peligro (-20%)!§!"
 CHL_POWER_CATEGORY_TOOLTIP:0 "La categoría de poder actual de la facción. Cuanto mayor sea la categoría de poder, más influencia tiene la facción sobre el gobierno y sus políticas. Las categorías de poder son las siguientes:\n\n§GIntegrado§!: Exclusivo de los £CHL_communista_text  §YComunistas§! - La facción está totalmente integrada en el gobierno; no interfiere pero puede presentar demandas.\n§gExcluido§!: La facción está excluida del gobierno y tiene poca o ninguna influencia.\n§YMarginal§!: La facción tiene una pequeña cantidad de influencia.\n§OInfluyente§!: La facción tiene una cantidad moderada de influencia.\n§RMayor§!: La facción tiene una influencia significativa sobre el gobierno y sus políticas."
 CHL_BOP_INFLUENCE_TOOLTIP:0 "La influencia semanal que la facción ejerce sobre el equilibrio de poder. Este valor determina qué tan rápido puede aumentar su influencia. Cuanto más alto sea el valor, más rápido podrá aumentar su poder."
