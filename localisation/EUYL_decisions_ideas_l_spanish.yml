 ECU_the_constituent_assembly:0 "La Asamblea Constituyente"
 ECU_the_constituent_assembly_desc:0 "La Asamblea Constituyente de Ecuador se encarga de manejar la mayoría de las situaciones y decisiones políticas del país. Si se demuestra que el líder es motivo de preocupación para la estabilidad y la soberanía de la nación, la Asamblea votará para destituirlo y tomar el mando directamente."
