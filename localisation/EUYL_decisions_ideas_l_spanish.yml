 PRU_conquered_europe_tt:0 "Nos hemos vengado de los europeos y hemos conquistado Europa"
 PRU_integrate_states_tt:0 "Todo estado con más de §G35%§! de §Ycumplimiento§! se volverá §Gnúcleo§!"
 PRU_conquering_the_imperialist_europeans:0 "Conquistar a los europeos imperialistas"
 PRU_conquering_the_imperialist_europeans_desc:0 "Tras conquistar Sudamérica y consolidarnos como potencia global, podemos terminar de verdad lo que empezamos. Toda la razón de nuestro renacimiento fue únicamente vengarnos de los malditos europeos y hacerles probar su propia medicina. No pararemos hasta que TODAS las naciones europeas hayan sido diezmadas."
 PRU_conquer_the_european_continent:0 "Conquistar el continente europeo"
 PRU_conquer_the_european_continent_desc:0 "Como toda nuestra existencia se sostiene sobre la conquista del continente, el pueblo exige que eliminemos con éxito a los europeos en un plazo de 5 años. Si no logramos cumplir esa tarea en ese tiempo, muchos de nuestros partidarios nos traicionarán y desintegrarán una vez más el Imperio Inca. No por colonialistas, sino por nuestra propia gente."
