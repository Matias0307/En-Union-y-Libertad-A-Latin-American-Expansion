 PAN_american_political_intervention:0 "Intervención Política Americana"
 PAN_american_political_intervention_desc:0 "Los Estados Unidos han mantenido durante mucho tiempo una influencia significativa sobre el panorama político de Panamá. A través de diversos medios, incluyendo ayuda económica, apoyo militar y presión diplomática, los EE. UU. han buscado moldear el gobierno y las políticas panameñas para alinearlas con sus propios intereses. Esta intervención ha sido a menudo recibida con resistencia por parte de ciudadanos y líderes panameños que buscan afirmar la soberanía e independencia de su país."
 PAN_overarching_american_shadow:0 "Sombra Americana Dominante"
 PAN_overarching_american_shadow_desc:0 "A pesar del resultado exitoso de nuestras conversaciones con los Estados Unidos respecto a su intervención en nuestros asuntos políticos, está claro que su influencia seguirá cerniéndose sobre nuestra nación."
 PAN_ongoing_talks_with_the_united_states:0 "Conversaciones en Curso con los Estados Unidos"
 PAN_ongoing_talks_with_the_united_states_desc:0 "Las conversaciones con [USA.GetName] han sido iniciadas por [ROOT.GetLeader] en un intento de reducir la influencia de los Estados Unidos en la política panameña. El objetivo de estas conversaciones es establecer una relación más igualitaria y respetuosa entre ambos países.\n\nEl resultado de estas conversaciones depende de nuestros £PAN_panama_flag §YPuntos de Soberanía§! al finalizar las mismas\n - Con §G90§! £PAN_panama_flag §YPuntos de Soberanía§! o §Gmás§!: Los Estados Unidos aceptan reducir completamente su intervención en la política panameña.\n - Con §G60§! £PAN_panama_flag §YPuntos de Soberanía§! o §Gmás§!: Los Estados Unidos aceptan reducir moderadamente su intervención en la política panameña.\n - §RPor debajo§! de §G60§! £PAN_panama_flag §YPuntos de Soberanía§!: Los Estados Unidos se niegan a reducir su intervención en la política panameña."
