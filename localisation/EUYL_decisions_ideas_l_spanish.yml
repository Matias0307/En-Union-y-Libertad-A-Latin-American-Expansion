 CHL_anarchist_council:0 "El Consejo Anarquista"
 CHL_anarchist_council_desc:0 "Aunque representamos la ausencia de un gobierno central y nos oponemos a la idea de que el pueblo sea dirigido por una entidad, es importante que nos organicemos con un consejo ahora que somos una nación soberana. El consejo estará compuesto por diversas personas seleccionadas completamente al azar y luego verificadas por el propio pueblo, y cuestionarán nuestras acciones como nación y decidirán si las apoyan o se oponen a ellas. \n\n[ROOT.GetCouncilOpinion]"
