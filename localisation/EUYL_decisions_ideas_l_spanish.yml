 COS_public_works_of_costa_rica_dec_cat:0 "Obras Públicas de Costa Rica"
 COS_public_works_of_costa_rica_dec_cat_desc:0 "Con el fin de impulsar la economía y ofrecer oportunidades de empleo a los ciudadanos de Costa Rica, el gobierno ha lanzado una serie de proyectos de obras públicas. Estos proyectos se centrarán en mejorar la infraestructura, como caminos, puentes y edificios públicos, además de brindar servicios esenciales como agua potable y saneamiento. Al invertir en estas obras públicas, esperamos crear una sociedad más próspera y equitativa para todos los costarricenses."
