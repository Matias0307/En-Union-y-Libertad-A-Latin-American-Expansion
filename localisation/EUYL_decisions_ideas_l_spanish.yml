 COS_conservative_coffee_oligarchy_support:0 "Apoyo de la Oligarquía Cafetalera Conservadora"
 COS_conservative_coffee_oligarchy_support_desc:0 "La oligarquía cafetalera conservadora ha sido durante mucho tiempo una fuerza poderosa en la política costarricense, con una influencia considerable sobre el gobierno y la economía. Su apoyo es crucial para contribuir a la economía costarricense. Sin embargo, su influencia también puede derivar en políticas que priorizan sus intereses por encima de los de la población en general, generando tensión y riesgo de disturbios."
 COS_oligarchs_will_appropriate_lands_every_so_often_tt:0 "\n\n§RLos oligarcas se apropiarán de tierras cada cierto tiempo§!\n\nEste espíritu nacional también evita que ocurran §YHuelgas§!."
