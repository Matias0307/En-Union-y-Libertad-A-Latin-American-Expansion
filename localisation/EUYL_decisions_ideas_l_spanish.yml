 COS_nazi_sympathizers_desc:0 "Debido a la afluencia de inmigrantes alemanes tras la Primera Guerra Mundial, sumada a las instituciones alemanas del país, la admiración nacional por la comunidad alemana ha provocado un auge del nazismo en Costa Rica. Junto con el gobierno más nacionalista y de estilo caudillista de Costa Rica, este movimiento ha logrado ganar terreno entre la población. Aunque todavía no es una amenaza importante para el gobierno, es fundamental vigilar este movimiento, ya que podría derivar en inestabilidad en el futuro."
 COS_declaring_war_on_a_major_fascist_power_will_cause_major_protests_tt:0 "\n\n§RDeclarar la guerra a una gran potencia fascista causará grandes protestas§!"
