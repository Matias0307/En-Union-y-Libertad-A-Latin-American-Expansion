 PRU_building_up_the_military:0 "El Ejército Peruano"
 PRU_building_up_the_military_desc:0 "Ahora que estamos bajo un régimen expansivo, podemos empezar a concentrarnos plenamente en las fuerzas armadas. ¡Es hora de que nuestros enemigos se acobarden de miedo mientras les mostramos nuestro poderío militar de frente!"
