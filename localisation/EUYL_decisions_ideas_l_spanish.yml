 PRU_purchase_foreign_arms_from_JAP:0 "Comprar armas extranjeras a Japón"
 PRU_unlock_purchase_japanese_arms_tt:0 "Desbloquea la decisión §YComprar armas extranjeras a Italia§!, que no solo es §Gmás barata§! que las de las potencias europeas, sino que además §Gtarda menos§! en entregar el §Yequipo de infantería§!"
 PRU_higher_opinion_of_us_tt:0 "¡Cuanto §Gmejor§! sea su opinión de §Ynosotros§!, §Gmás probable§! será que §Gacepten§! el pacto!"
 ROOT_alread_was_asked_to_surrender:0 "Aceptó rendirse"
 PRU_peruvian_blitzkrieg:0 "La Blitzkrieg Peruana"
 PRU_the_peruvian_empire:0 "Gestión Imperial"
 PRU_the_peruvian_empire_desc:0 "Ahora que somos un poderoso imperio, debemos asegurarnos de que nuestra fuerza se muestre no solo en toda Sudamérica, sino en todo el planeta. Debemos demostrar al mundo que Sudamérica no es simplemente un caso aislado en la escena global, y lo probaremos con la fuerza militar. ¡Sudamérica caerá de rodillas ante nuestro poderío imperial!"
