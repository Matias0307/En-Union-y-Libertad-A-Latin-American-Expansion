 PAR_legacy_of_solano_lopez_cat_desc:0 "Han pasado 7 décadas desde aquella atroz humillación que sufrimos en la guerra de la triple alianza. Todo este tiempo nos han odiado, resentido y despreciado por completo. Murieron demasiados paraguayos, demasiados para contarlos, y eso es imperdonable... §RIMPERDONABLE§!. §RPagarán, maldita sea, con su sangre, todas estas viles criaturas que nos rodean, cada una de ellas. Verán quiénes somos de verdad, y llevaremos la convicción de§! §YSolano López§!§R. ¡Cueste lo que cueste, venceremos!§!"
