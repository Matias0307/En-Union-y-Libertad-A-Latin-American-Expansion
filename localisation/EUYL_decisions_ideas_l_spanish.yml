 BRA_the_smoking_snakes:0 "Las Serpientes Fumadoras"
 BRA_the_smoking_snakes_desc:0 "La Força Expedicionária Brasileira, FEB, fue una división militar del Ejército y la Fuerza Aérea de Brasil que combatió junto a las fuerzas aliadas en el teatro del Mediterráneo durante la Segunda Guerra Mundial. Contaba con unos 25,900 hombres, incluyendo una división de infantería completa, un vuelo de enlace y un escuadrón de cazas. Nuestros muchachos pueden aprender mucho de la tierra, el aire y los mares del teatro europeo, así que aprovechemos esa información y usémosla a nuestro favor."
