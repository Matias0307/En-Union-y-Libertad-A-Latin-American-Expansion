 HON_royal_exiles_civ_war:0 "Exiliados Reales"
 HON_kingdom_of_honduras_modifier:0 "El Reino de Honduras"
 HON_kingdom_of_honduras_modifier_desc:0 "Con la llegada de los royales desde España, Honduras ha sido declarada nuevamente un reino, con §YCarlos Pio Habsburgo§! como su rey. Esta nueva monarquía aporta un sentido de estabilidad y tradición al país, mientras abre nuevas oportunidades para las relaciones internacionales y el comercio. Sin embargo, también conlleva sus propios desafíos, ya que el gobierno debe navegar las complejidades de una monarquía constitucional y asegurar que los derechos y libertades de sus ciudadanos sean respetados."
