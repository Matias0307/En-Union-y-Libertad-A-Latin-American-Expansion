 PAR_february_revolution:0 "La Revolución de Febrero"
 PAR_february_revolution_desc:0 "La Revolución de Febrero fue un golpe de Estado organizado por los militares paraguayos con el objetivo de derrocar a Eusebio Ayala y poner en el poder a Rafael Franco.\n\nEsto tenga o no consecuencias para nosotros en el futuro, debemos seguir vigilando con cautela a los militares. Sus intenciones siguen siendo bastante vagas, y no sabemos qué motivos ocultos puedan tener, si es que los tienen. Que Dios bendiga a Paraguay por lo que viene."
 PAR_the_february_revolution:0 "La Revolución"
 PAR_unlock_revolution_decisions_tt:0 "Desbloqueará varias §YDecisiones§! relacionadas con la §YRevolución de Febrero§!. Estas decisiones te permitirán §Gretrasar§! la revolución y inclinar el §YEquilibrio de poder§! hacia [PAR.GetLeader].\n\n¡Si se hace correctamente, la §YRevolución§! se verá obligada a §Gcancelarse§! y la §CDemocracia§! prevalecerá!"
