 col_pugna_religiosa:0 "Injerencia religiosa"
 col_pugna_religiosa_desc:2 "Aunque la constitución de 1886 estableció un Estado unitario y confesional, las reformas liberales de los últimos años han reducido considerablemente la participación de la Iglesia. Como resultado, ha estallado un acalorado debate entre los hombres de Estado y los diferentes §Ygrupos religiosos§! que buscan imponer sus ideales en las decisiones del gobierno. \n\nLos £col_cat §YCatólicos§! afectan la §Gestabilidad§! y la §Gganancia de poder político§!.\nLos £col_crist §YCristianos§! afectan la §Gestabilidad§! y la §Gproducción de las fábricas§!.\nLos £col_athe §YAteos§! afectan la §Gganancia de poder político§! y la §Gproducción de las fábricas§!.\n\n§REl estatus político de los distintos grupos religiosos puede afectar la oposición política interna.§!"

 col_ui_status_header:0 "Estatus político"
 COL_STATUS_TOOLTIP:0 "El §Yestatus político§! determina cuán presentes están los grupos religiosos en la administración pública.\n\nLos grupos §Gdominantes§! e §Ginfluyentes§! otorgan bonificaciones en sus respectivos aspectos, mientras que los grupos §Rexcluidos§! otorgan penalizaciones y los §gimparciales§! no ofrecen bonificaciones ni penalizaciones.\n\nLos grupos religiosos pueden exigir una mayor participación, lo que afectará su estatus y el de otros grupos."
