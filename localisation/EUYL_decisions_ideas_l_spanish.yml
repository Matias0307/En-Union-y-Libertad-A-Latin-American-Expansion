 COL_incidente_en_el_canal:0 "Provocar un incidente en el canal"
 COL_incidente_en_el_canal_desc:0 "Es inaudito que Estados Unidos nos haya arrebatado algo que nos pertenece por derecho. El Canal de Panamá no puede seguir en sus manos, y aunque se derrame sangre, volverá a ser nuestro... aunque primero debemos asegurarnos de tener divisiones lo bastante fuertes en la frontera."
 COL_incidente_en_japura:0 "Provocar un incidente en Japurá"
 COL_incidente_en_japura_desc:0 "El territorio de lo que hoy es Japurá formaba parte de nuestra república hace varios años, pero fue vendido sin darse cuenta a Brasil por políticos. Recuperaremos lo que nuestros antiguos gobernantes perdieron."
 COL_incidente_en_mapari:0 "Provocar un incidente en Mapari"
 COL_incidente_en_mapari_desc:0 "Mapari ha sido parte de Colombia desde los tiempos de Bolívar y es el punto más lejano del Amazonas. Sin embargo, su potencial de explotación económica es grande; un potencial que los políticos del pasado no vieron."

