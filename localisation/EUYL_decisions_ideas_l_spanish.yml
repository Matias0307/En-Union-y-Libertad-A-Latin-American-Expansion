 PRU_pan_highway_tooltip:0 "Construye la §YCarretera Panamericana§! (3 infraestructuras en Lima, 1 en Arequipa, y 1 en el resto de la carretera).\n\n§GAumenta la opinión del comercio de Chile, Ecuador, y aumenta la opinión que tienen de ti.§!"
 URG_form_liga_federal_category:0 "Reformar la Liga Federal"
 URG_form_liga_federal_category_desc:0 "La Liga Federal fue una alianza de provincias en lo que hoy se considera Argentina, Uruguay y el sur de Brasil. Este estado, que alguna vez existió, surgió durante la revolución contra los españoles, pero tuvo corta vida. Quizás, con suficiente expansión y sometimiento de nuestros vecinos, podamos devolver a la vida este antaño poderoso estado."
