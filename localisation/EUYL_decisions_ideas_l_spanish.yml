 ROOT_currently_focusing_militarily_against_nation:0 "Está concentrado militarmente contra una nación"
 ROOT_the_second_war_of_the_pacific:0 "La Segunda Guerra del Pacífico"
 ROOT_the_second_war_of_the_pacific_desc:0 "Nuestro continente ha vuelto a caer en el caos y la guerra. Muchos espectadores del mundo exterior ya catalogan este conflicto como el más sangriento que Sudamérica haya visto jamás. Debemos derrotar rápidamente a nuestros enemigos si no queremos que este conflicto se prolongue mucho más y se desperdicien vidas. Todos nuestros esfuerzos se dedicarán a este conflicto, aunque eso signifique que temporalmente matemos de hambre a nuestra propia nación. ¡Será por el bien mayor del pueblo!"
