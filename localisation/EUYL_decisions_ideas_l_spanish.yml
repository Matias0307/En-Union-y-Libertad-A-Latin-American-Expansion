 BRA_dependency_on_our_coffee_productions:0 "Dependencia de nuestra producción de café"
 BRA_dependency_on_our_coffee_productions_desc:0 "Somos uno de los mayores productores de café del planeta. La mayor parte del mundo depende de nuestras plantaciones para su suministro de café. Debido a una demanda tan alta, la industria y las plantaciones cafeteras han acumulado enormes cantidades de poder en nuestra economía. Por eso dictan gran parte de nuestras acciones económicas e industriales. Debemos vigilar cuán dependientes somos de ellas; si no lo hacemos, nuestra economía podría verse seriamente afectada. \n\nNuestra dependencia actual de la producción de café es: §Y[?BRA_dependency_on_coffee|Y0]%§!\n\nLa opinión actual de las plantaciones de café hacia nuestro gobierno es: [ROOT.GetCoffeeOpinion]"
