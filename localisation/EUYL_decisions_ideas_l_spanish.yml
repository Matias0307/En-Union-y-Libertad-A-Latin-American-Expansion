 PRU_gain_2_generals:0 "§GGanarás§! §Y2§! nuevos generales"
 PRU_army_rebellious:0 "\n§RTrabajar con un estado democrático hará que los fascistas restantes del Ejército se rebelen contra ti, y tomará un tiempo volver a ponerlos bajo tu control total. Si has trabajado con un estado fascista con el Ejército, obtendrás una versión peor del Ejército rebelde, y costará más tiempo y recursos deshacerse de ella.§!\n"
 PRU_rebellious_democrats:0 "\n§RTrabajar con un estado fascista hará que los demócratas restantes de la Armada se rebelen contra ti, y tomará un tiempo volver a ponerlos bajo tu control total. Si has trabajado con un estado democrático con el Ejército, obtendrás una versión peor de la Armada rebelde, y costará más tiempo y recursos deshacerse de ella.§!\n"
 PRU_fascist_army_rebellion:0 "\n§RSeguir la vía democrática hará que los fascistas del ejército se rebelen. Esta rebelión solo empeorará si cooperaste con un estado fascista. \nLa armada también se rebelará si cooperas con un estado fascista§!. \n\n§GNada de esto ocurrirá si haces democrático al ejército.§!"
 PRU_rebelling_of_navy:0 "\n§RTrabajar con un estado fascista hará que los demócratas restantes de la Armada se rebelen contra ti, y tomará un tiempo volver a ponerlos bajo tu control total. Si has trabajado con un estado democrático con la Armada, obtendrás una versión peor de la Armada rebelde, y costará más tiempo y recursos deshacerse de ella.§!\n"
 PRU_rebellious_army_fascist:0 "\n§RTrabajar con un estado democrático hará que los fascistas restantes del Ejército se rebelen contra ti, y tomará un tiempo volver a ponerlos bajo tu control total. Si has trabajado con un estado democrático con la Armada, obtendrás una versión peor del Ejército rebelde, y costará más tiempo y recursos deshacerse de ella.§!\n"
 PRU_unlock_restore_order_decision:0 "\nDesbloquea una §Ydecisión§! para §GRestablecer el orden§! en el §Yejército§! o en la §YArmada§!"
