 ARG_infamous_decade_cat:0 "Década Infame"
 ARG_infamous_decade_cat_desc:0 "El panorama político actual es un desastre en Argentina. Desde el brutal golpe de Estado de 1930 que derrocó a Hipólito Yrigoyen, Argentina viene en caída libre. El pueblo se está agitando y los militares vigilan muy atentamente cada uno de nuestros movimientos. Un pequeño error podría significar otra toma de poder militar. \n\nEl estado de la £ucr_a_texticon §YUCRA§! es: [ROOT.GetPartyOpinionUCRA]\nEl estado de la £ucr_texticon §YUCR§! es: [ROOT.GetPartyOpinionUCR]\nEl estado del £partido_socialista_texticon §YPS§! es: [ROOT.GetPartyOpinionPS]\nEl estado de los £col_militar §YMilitares§! es: [ROOT.GetOpinionMilitaryArgentina]"
