 VEN_democratic_revolution:0 "Revolución democrática"
 VEN_democratic_revolution_desc:0 "En 1901, Venezuela atravesó lo que se conoció como la Revolución Libertadora, una revolución dirigida contra el entonces presidente Cipriano Castro. Esta revolución fracasó, lo que llevó a las siguientes 3 décadas bajo el mando del dictador Juan Vicente Gómez. No sorprende que tal derrota haya dejado a la población liberal enojada y frustrada, ansiosa por aprovechar la oportunidad de que otro presidente no administre bien el país. Si no mantenemos el país bajo control, bien podría ocurrir una segunda revolución."
 VEN_impending_democratic_revolution:0 "Inminente revolución democrática"
 VEN_political_crisis:0 "Crisis política"
 VEN_gloria_al_bravo_pueblo_cat:0 "'Gloria al Bravo Pueblo'"
 VEN_gloria_al_bravo_pueblo_cat_desc:0 "Gloria al pueblo de Venezuela, que ha luchado larga y duramente para mantener y hacer crecer el país que tenemos hoy. No podemos decepcionar a nuestro pueblo, y debemos hacer lo que sea necesario para estabilizar nuestra política interna y gestionar adecuadamente el país, ¡para que podamos tener un país aún más fuerte y próspero!"
