 col_terrain_bonus:0 "Planes geográficos"
 col_terrain_bonus_desc:0 "La victoria no está solo en las armas o en los hombres, sino también en el terreno. Estudiar la naturaleza en detalle es una ventaja crucial a la hora del combate."
 supply_bonus:0 "Estudiar las líneas de suministro"
