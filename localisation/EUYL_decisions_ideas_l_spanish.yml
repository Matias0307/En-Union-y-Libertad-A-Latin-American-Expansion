 BRA_industrializing_economy_tt:0 "Hemos §Yindustrializado§! ligeramente nuestra economía"
 BRA_economic_recession:0 "Recesión económica"
 BRA_economic_recession_desc:0 "Nuestra incapacidad para industrializarnos adecuadamente ha dejado a muchos sin empleo, y debido a esta ola de desempleo nuestra economía ha caído drásticamente. Sanar nuestra economía llevará tiempo, y es tiempo que necesitamos para concentrarnos en otras partes de nuestra nación."
 BRA_economic_management:0 "Gestión económica"
 BRA_economic_management_desc:0 "La economía brasileña es una de las más grandes de toda Latinoamérica, así que no sorprende que gestionarla como corresponde sea una molestia. Debemos tener mucho cuidado con las decisiones que tomamos y también ser cautelosos al industrializar nuestra economía, pues estamos haciendo reformas rápidas que nos obligan a impulsar una economía orientada a la industria."
