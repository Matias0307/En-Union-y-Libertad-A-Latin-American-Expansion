 BRA_political_manegement:0 "Gestión política brasileña"
 BRA_political_manegement_desc:0 "El espectro político brasileño ha estado tambaleándose desde la revolución de la década de 1930. La Guerra Civil de 1932 solo empeoró el caos político en Brasil, dejando el estado político de la nación en un limbo constante. El futuro de esta nación es incierto, pero debemos estar atentos si queremos mantenerla como corresponde."
