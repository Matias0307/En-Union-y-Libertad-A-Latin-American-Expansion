 escuela_combate:0 "Escuela de guerra superior"
 escuela_combate_desc:0 "Los variados biomas de la nación la convierten en el lugar perfecto para entrenar a nuestros líderes del ejército en los distintos tipos de terreno en los que lucharán nuestras tropas."
