 ECU_gallos_looming_coup:0 "El Golpe latente de Gallo"
 ECU_gallos_looming_coup_desc:0 "A pesar de no llevar mucho tiempo como presidente, [ROOT.GetLeader] nos ha demostrado que no es un líder confiable para Ecuador y que podría causar problemas si consideramos sus relaciones amistosas con las potencias fascistas. Por esto y por la mala gestión nacional en general, los militares han decidido intervenir y poner en el poder a §YAlberto Enríquez Gallo§! para asegurar que Páez no se salga con la suya y gane 4 años más de presidencia."
 ECU_pro_conservative_navy:0 "Armada proconservadora"
 ECU_pro_conservative_navy_desc:0 "Muchos sectores de la armada ecuatoriana siguen siendo leales a los conservadores, con rumores de persecuciones a liberales que ocurren de vez en cuando dentro de la armada. Por ello, los liberales ven esto como una amenaza para su partido y protestarán si el gobierno se alinea con los conservadores."
