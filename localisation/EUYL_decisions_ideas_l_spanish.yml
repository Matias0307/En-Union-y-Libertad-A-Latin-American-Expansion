 HON_poor_banana_exports_desc:0 "La Gran Depresión ha golpeado a [HON.GetName] al afectar su tesoro más sagrado: las exportaciones de banano. Con una economía tan dependiente de este producto, estamos obligados a resolver este problema antes de que empeore aún más."
