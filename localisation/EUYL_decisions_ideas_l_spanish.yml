 ## ECUADOR ##
 ECU_la_gloriosa:0 "La Gloriosa"
 ECU_la_gloriosa_desc:0 "A pesar de su presidencia bastante corta, el impacto que Velasco ha tenido en los ecuatorianos ha sido simplemente enorme. En caso de que ocurra alguna desgracia dentro del país, es casi seguro que Velasco aprovechará la oportunidad e intentará tomar el poder mediante un golpe de Estado o una revolución a gran escala."
 ECU_if_stability_or_lose_war_with_peru_tt:0 "\n§RSi la§! §YEstabilidad§! §Rcae por debajo del 10% o pierdes la guerra contra §Y[PRU.GetName]§!§R, ¡Velasco exigirá el control de la nación!§! \n\n§R¡No permitirle tomar el control desencadenará una guerra civil!§!"
 ECU_siding_too_much_with_liberals_will_cause_conservative_insurrection_tt:0 "\n§RAlinearse demasiado con los§! £ECU_liberal_texticon §YLiberales§! §Rprovocará una§! £ECU_conservative_texticon §YInsurrección§! §Rconservadora.§!\n\nEsto puede §GEvitarse§! si §YMejoras§! las relaciones con los £ECU_conservative_texticon §YConservadores§!, pero no lo hagas en exceso, ya que eso también puede causar una £ECU_liberal_texticon §YInsurrección§! §Rliberal.§!"
 ECU_aftermath_of_4_day_civil_war:0 "Consecuencias de la guerra civil de 4 días"
 ECU_aftermath_of_4_day_civil_war_desc:0 "Tras la repentina renuncia de Isidro Ayora, se convocaron elecciones de inmediato para elegir cuanto antes al siguiente líder. Las elecciones se celebraron en 1932 y ganó Neptalí Bonifaz. Sin embargo, esta victoria quedó anulada cuando el Congreso ecuatoriano le impidió asumir el poder debido a sus raíces peruanas. Por ello, milicias proconservadoras tomaron las armas en la capital y combatieron para protestar contra el impedimento de su presidencia. Los liberales respondieron con fuego, y el resultado fue una sangrienta guerra civil que se cobró la vida de más de 2000 ecuatorianos. Aunque han pasado casi 4 años desde entonces, los sangrientos hechos siguen vivos en la mente de ambos bandos, y alinearse demasiado con alguno tendrá consecuencias."
 ECU_rural_state:0 "Estado rural"
 ECU_rural_state_desc:0 "Este estado está compuesto en su mayoría por población rural, con muy pocos ecuatorianos viviendo en un entorno urbanizado."
 ECU_economic_reignition:0 "Reactivación económica"
 ECU_economic_reignition_desc:0 "La economía ecuatoriana se vio muy afectada por la Gran Depresión, sobre todo en cinco macrovariables distintas: comercio exterior, ingresos del gobierno, reservas de oro, inflación y PIB. Debido al rechazo del patrón oro impuesto por la misión Kemmerer, la economía ecuatoriana sufrió inestabilidad e inconvertibilidad. Tampoco ayuda que la mayoría de los ecuatorianos viva en zonas rurales, lo que dificulta la industrialización."
 ECU_economic_reignition_cat:0 "Reactivando la economía"
 ECU_economic_reignition_cat_desc:0 "La economía ecuatoriana ha tenido dificultades últimamente, sobre todo por la Gran Depresión y el rechazo del patrón oro. ¡Habrá que hacer varios cambios para reactivar la economía!"
 ECU_liberal_conservative_conflict:0 "Conflicto liberal-conservador"
 ECU_liberal_conservative_conflict_desc:0 "La política ecuatoriana siempre ha estado definida por un feroz tira y afloja entre liberales y conservadores. Esta división solo empeoró tras la guerra civil de 4 días de 1932, lo que hizo que los £ECU_conservative_texticon §YConservadores§! fueran antagonizados desde entonces. Esta división podría intensificarse si no mantenemos a raya a los partidos, y podría ocurrir una insurrección si no tenemos cuidado. \n\nNuestro §YLíder§! actual representa a [ROOT.GetLeaderParty]"
 ECU_rural_provinces_tt:0 "Provincias §Yrurales§!"
 ECU_actively_antagonizing_tt:0 "§RAntagonizando activamente§!"
 ECU_significant_resentment_tt:0 "§OResentimiento significativo§!"
 ECU_slight_resentment_tt:0 "§YResentimiento leve§!"
 ECU_neutral_tt:0 "§gNeutral§!"
 ECU_slight_support_tt:0 "§7Apoyo leve§!"
 ECU_significant_support_tt:0 "§7Apoyo significativo§!"
 ECU_active_cooperation_tt:0 "§GCooperación activa§!"
 ECU_CONFLICT_TT:0 "Este sistema representa nuestra situación actual frente a los £ECU_liberal_texticon §YLiberales§! y los £ECU_conservative_texticon §YConservadores§!. El estado puede ir desde §RAntagonizando activamente§! hasta §GCooperación activa§!. El §YLíder actual§! también puede influir según el partido que represente. Sin embargo, en última instancia no tiene mucho que decir sobre el trato del país hacia el partido en general. \n\nSi hay una §YDiferencia significativa§! de estado entre los dos partidos o cualquiera de los bandos llega al estado §RAntagonizando activamente§!, ese bando provocará una §RInsurrección§!"
