 CEA_managing_the_banana_republic_desc:0 "Las repúblicas bananeras de Centroamérica son conocidas por sus extensas plantaciones de banano y el monopolio estadounidense sobre estos países. Aunque esto ha traído mucho dinero, también ha traído muchos problemas. Los trabajadores están descontentos, la tierra está sobreexplotada y la economía está en ruinas. Es hora de arreglar esto. [ROOT.GetDebtPayment]"
