 PRU_unlock_coup_decisions:0 "Desbloquea decisiones para §Gaumentar§! la probabilidad de que ocurra un §YGolpe Pacífico§! y §Greducir§! la de que ocurra una §YGuerra Civil§!"
 PRU_stockpile_equipment_increase_by_15:0 "§GConservarás un 15%§! más de tu §Yequipo almacenado§!"
 PRU_remove_opposition_arresting:0 "La Guardia Civil §GDejará§! de arrestar a nuestros partidarios"
 PRU_states_fascist_side:0 "§YLoreto, Ucayali y Piura§! se volverán §Gleales§! a nuestro bando"
 PRU_coup_will_launch_tt:0 "§R¡Tomar este foco hará que se lance el golpe!§!"
 PRU_pathcivilwar_tt:0 "§R¡Este camino PUEDE llevar a una guerra civil!§!"
 PRU_navy_abandonment_tt:0 "\n§R¡Si nos volvemos fascistas y la armada no se ha convertido al fascismo, toda la rama nos ABANDONARÁ!§!\n"
 PRU_the_purchase_of_japanese_ships:0 "Compra de barcos japoneses"
 PRU_the_purchase_of_japanese_ships_desc:0 "Tras comprar préstamos extranjeros a Japón e invitar a asesores navales japoneses, además de expandir nuestra diezmada armada, ya podemos empezar a comprar diversos barcos japoneses. La calidad del barco determinará su costo y durante cuánto tiempo tendremos que pagarlo. \n\nPrimero los japoneses deben aceptar cualquier solicitud de compra de un barco, y la IA japonesa se verá influida por los siguientes factores: \n\n - §YEl tamaño actual de su Armada§! \n\n - §YSu opinión sobre nosotros§! \n\n - §YLo pequeña que sea actualmente nuestra Armada§! \n\n - §YSi están en guerra o no§! \n\n - §YNuestro poder industrial actual§!"
 PRU_purchase_japanese_submarines:0 "Comprar un submarino japonés"
 PRU_purchase_destroyers:0 "Comprar un destructor japonés"
 PRU_purchase_light_cruiser:0 "Comprar un crucero ligero japonés"
 PRU_purchase_heavy_cruiser:0 "Comprar un crucero pesado japonés"
 PRU_purchase_carrier:0 "Comprar un portaaviones japonés"
 PRU_purchase_battleship:0 "Comprar un acorazado japonés"
 PRU_union_revolucionaria_may_try_something_tt:0 "\n§RLa§! §YUnión Revolucionaria§! §R¡podría intentar vengarse por esto en un futuro cercano!§!"
 PRU_navy_abandon_tt:0 "§R¡Perderemos todos nuestros barcos si el golpe ocurriera ahora!§!"
 PRU_civil_war:0 "La Guerra Civil Peruana"
 PRU_civil_war_desc:0 "Nuestro país ha caído en una guerra civil. El número de muertos aumenta en ambos bandos y nuestra nación se derrumba sobre sí misma. Si no logramos terminar esta guerra civil rápido, habrá graves consecuencias en el futuro."
 PRU_focus_on_attack:0 "Concentrarse en el ataque"
 PRU_focus_on_defense:0 "Concentrarse en la defensa"
 PRU_aftermath_of_coup:0 "Recuperándose del golpe"
 PRU_aftermath_of_coup_desc:0 "Tras el golpe y la toma del país, nuestro país ha quedado en ruinas y nos espera un largo proceso de reconstrucción."
 PRU_recover_from_coup:0 "Recuperándose del golpe"
 PRU_idustrial_decisions_active_tt:0 "Desbloquea varias decisiones que te permitirán §Yexpandir tu industria, armada y armerías§! mientras la idea §RRecuperándose del golpe§! siga activa."
