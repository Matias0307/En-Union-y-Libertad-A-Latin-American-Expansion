 COS_allows_for_re_elections_tt:0 "Permite que los líderes sean §YReelegidos§!"
 COS_rewrite_the_constitution:0 "Reescribir la Constitución"
 COS_rewrite_the_constitution_desc:0 "Un líder ha sido reelegido recientemente, aunque la constitución actual de Costa Rica no permite las reelecciones. Esto ha generado mucha controversia y malestar en el país, y muchos exigen reescribir la constitución para permitir las reelecciones."
 COS_appropriated_land_communist:0 "Tierras Apropiadas"
 COS_protests_will_erupt_nationwide_failure_to_calm_the_people_will_result_in_a_civil_war_tt:0 "\n\n§RLas protestas estallarán en todo el país§! \n\nNo lograr calmar al pueblo desencadenará una §RGuerra Civil§!"
