 CHL_el_frente_popular_desc:0 "El Frente Popular es una coalición política en Chile que reúne a varios partidos y organizaciones de izquierda. Fue formado en respuesta al auge del fascismo y el autoritarismo en Europa durante los años 1930, con el objetivo de promover la democracia, la justicia social y los derechos de los trabajadores en Chile. El Frente Popular ha sido fundamental en la formación de la política y sociedad chilena, y su influencia continúa sintiéndose hoy en día."
