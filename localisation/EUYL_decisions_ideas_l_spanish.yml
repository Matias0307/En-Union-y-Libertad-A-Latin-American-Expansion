 HON_el_cariato_cat:0 "El Cariato"
 HON_el_cariato_cat_desc:0 "'El Cariato' fue el apodo dado al gobierno autoritario de Tiburcio, caracterizado por censura, represión y violencia para mantener el control. Si bien fue efectivo para mantener el orden, también generó un gran descontento y malestar entre la población durante todo su mandato. Su control sobre la nación no debe tomarse a la ligera; sin embargo, el pueblo hondureño puede cambiar esto en cualquier momento si se une, aunque sus fuerzas se enfrentarán a todo el poder del Cariato."
 
