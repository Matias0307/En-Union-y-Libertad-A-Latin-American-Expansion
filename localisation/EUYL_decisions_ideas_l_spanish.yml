 BRA_friendly_tt:0 "§7Amistoso§!"
 BRA_SUBVERSIVE_ACTIVITY_TOOLTIP:0 "La forma de actuar de los £BRA_communist  §YComunistas§! es distinta a la de los demás partidos políticos. Se involucran en el esquema político mediante la §YActividad subversiva§!. \n\nLa §YActividad subversiva§! es la cantidad de actividad clandestina que realizan los Comunistas contra nuestro gobierno. Hay 4 niveles de actividad: §GBajo§!, §YMedio§!, §OAlto§! y §RMuy alto§!. Cuanto mayor sea la actividad subversiva, más difícil será gestionar la nación y sus ataques contra nuestro líder/gobierno actual serán más frecuentes."
