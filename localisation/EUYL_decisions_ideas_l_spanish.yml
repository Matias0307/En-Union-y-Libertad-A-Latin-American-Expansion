 ARG_internal_tensions:0 "Tensiones internas"
 ARG_internal_tensions_desc:0 "Debido a los recientes cambios políticos, la situación interna del país se ha ido volviendo sombría, pues muchos grupos se alzan para expresar su odio hacia el gobierno actual. Este país realmente nunca conocerá la paz."
 ARG_rapidly_deterioriating_political_situation:0 "Situación política en rápido deterioro"
 ARG_rapidly_deterioriating_political_situation_desc:0 "Muchos sectores de la Concordancia, la más democrática y liberal, han comenzado a aliarse con la Unión Cívica Radical y los socialistas para empezar los preparativos de una revolución a gran escala contra Manuel Fresco, con el objetivo de recuperar el control de la nación y no permitir que un gobierno fascista permanezca en el poder."
